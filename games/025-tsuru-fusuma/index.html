{theme:'確定申告',line:'「今夜は、その……三月なので。覗かないでください」',after:'朝、反物が一反と、還付金の知らせ。',caught:'見ましたね',caught2:'経費を',

];

};

/* ---------- 音 ---------- */
let ac=null,master,inBus,inLP,inGain,outBus,nbuf,creak=null;
function initAudio(){
  if(ac){if(ac.state==='suspended')ac.resume();return}
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
  try{
  ac=new AC();master=ac.createGain();master.gain.value=.5;
  const comp=ac.createDynamicsCompressor();master.connect(comp);comp.connect(ac.destination);
  outBus=ac.createGain();outBus.connect(master);
  inLP=ac.createBiquadFilter();inLP.type='lowpass';inLP.frequency.value=380;
  inGain=ac.createGain();inGain.gain.value=.3;inBus=ac.createGain();inBus.connect(inLP);inLP.connect(inGain);inGain.connect(master);

    crane(1,0,1.42,{neck:o.sneck,turn:o.sturn,shadow:true,hands:hs,dummy:S.night===7&&!cool&&S.st!=='title'});
    g.restore();
    if(o.sturn>.5&&!cool){g.save();g.globalAlpha=(o.sturn-.5)*1.3;g.fillStyle='#ffb060';g.shadowColor='#ff7020';g.shadowBlur=10;
      const ex=gx+(15+5*1.42)*u,ey=dTop+(FL-41*1.42)*u;el(ex-1.7*u,ey,.9*u,.9*u);el(ex+1.7*u,ey,.9*u,.9*u);g.restore()}
  }
  g.restore();
  // 隙間の光
  if(ox>.3){g.save();g.globalCompositeOperation='lighter';const k=Math.min(1,o.open/8),sl=Math.max(0,1-o.open/14),c=cool?'190,210,255':'255,205,120';
    let gr2=g.createLinearGradient(gx-26,0,gx,0);gr2.addColorStop(0,`rgba(${c},0)`);gr2.addColorStop(1,`rgba(${c},${.26*k+.2*sl*k})`);g.fillStyle=gr2;g.fillRect(gx-26,dTop,26,ph);
    gr2=g.createLinearGradient(gx+ox,0,gx+ox+30,0);gr2.addColorStop(0,`rgba(${c},${.3*k+.2*sl*k})`);gr2.addColorStop(1,`rgba(${c},0)`);g.fillStyle=gr2;g.fillRect(gx+ox,dTop,30,ph);
    if(sl>0){g.fillStyle=`rgba(${c},${.5*sl*k})`;g.fillRect(gx-1,dTop,ox+2,ph)}
    g.restore();
    g.fillStyle='#0d0908';g.fillRect(gx+ox-1,dTop,3,ph);g.fillStyle='rgba(255,220,150,.5)';g.fillRect(gx+ox-1,dTop,1,ph)}
  // 鴨居・敷居・床
  let wg=g.createLinearGradient(0,0,0,dTop);wg.addColorStop(0,cool?'#070914':'#08070d');wg.addColorStop(1,cool?'#10142a':'#15111a');g.fillStyle=wg;g.fillRect(0,0,W,dTop);
  g.fillStyle='#1d130e';g.fillRect(0,dTop-Math.max(8,ph*.028),W,Math.max(8,ph*.028));g.fillStyle='rgba(255,220,170,.07)';g.fillRect(0,dTop-Math.max(8,ph*.028),W,1);
  wg=g.createLinearGradient(0,dB,0,H);wg.addColorStop(0,cool?'#141829':'#1a1310');wg.addColorStop(1,'#050408');g.fillStyle=wg;g.fillRect(0,dB,W,H-dB);
  g.strokeStyle='rgba(0,0,0,.5)';g.lineWidth=1;const cx=W/2;for(let i=-8;i<=8;i++){g.beginPath();g.moveTo(cx+i*pw*.36,dB+6);g.lineTo(cx+i*pw*.36*2.4,H);g.stroke()}
  g.fillStyle='#231710';g.fillRect(0,dB,W,6);g.fillStyle='rgba(255,220,170,.08)';g.fillRect(0,dB,W,1);
  if(ox>.3){g.save();g.globalCompositeOperation='lighter';const c=cool?'150,180,255':'255,180,90',k=Math.min(1,o.open/6)*(.9+.1*o.fl);
    const fg=g.createLinearGradient(0,dB,0,H);fg.addColorStop(0,`rgba(${c},${.42*k})`);fg.addColorStop(1,`rgba(${c},0)`);g.fillStyle=fg;
    g.beginPath();g.moveTo(gx,dB);g.lineTo(gx+ox,dB);g.lineTo(gx+ox+(H-dB)*.5+ox*.5,H);g.lineTo(gx-(H-dB)*.9,H);g.closePath();g.fill();g.restore()}
  // 塵
  g.save();g.globalCompositeOperation='lighter';
  dust.forEach(p=>{const X=p.x*W,Y=p.y*H,inb=ox>.3&&X>gx-30&&X<gx+ox+50&&Y>dTop;g.fillStyle=cool?`rgba(180,200,255,${inb?.5:.06})`:`rgba(255,215,140,${inb?.55:.06})`;g.fillRect(X,Y,p.s,p.s)});
  puffs.forEach(p=>{g.fillStyle=`rgba(230,215,180,${.35*(1-p.t/p.l)})`;g.beginPath();g.arc(p.x,p.y,3+p.t*14,0,TAU);g.fill()});
  g.restore();
  // 手
  if(door.drag&&S.st==='play'&&!cool){const hx=gx+ox+pw*.13,hy=dTop+ph*.53+wb,s=pw*.01;
    g.fillStyle='#0e1326';g.beginPath();g.moveTo(hx+s*3,hy+s*3);g.lineTo(hx+s*34,H+10);g.lineTo(hx+s*50,H+10);g.lineTo(hx+s*10,hy-s*2);g.closePath();g.fill();
    g.fillStyle='#5d493c';g.beginPath();g.ellipse(hx+s*5,hy,s*6.6,s*8.4,.3,0,TAU);g.fill();g.fillStyle='#4a392f';for(let i=0;i<4;i++){g.beginPath();g.ellipse(hx-s*1+i*s*.4,hy-s*5.4+i*s*3.6,s*3.6,s*1.7,-.1,0,TAU);g.fill()}}
  // 暁
  if(dw>0){g.fillStyle=`rgba(120,150,210,${.13*dw})`;g.fillRect(0,0,W,H)}
}
function hud(a){
  if(a<.02)return;g.save();g.globalAlpha=a;const n=S.night,top=port?34:26;
  g.textBaseline='middle';g.textAlign='center';g.fillStyle='#f3d9a0';g.font='700 '+(port?17:19)+'px '+FONT;g.fillText('第'+KAN[n]+'夜',W/2,top);
  // 月の道
  const mw=Math.min(W*.5,300),my=top+(port?38:30),k=clamp(S.time/NIGHT_LEN,0,1);
  g.strokeStyle='rgba(233,223,198,.22)';g.lineWidth=1;g.setLineDash([2,5]);g.beginPath();g.moveTo(W/2-mw/2,my);g.quadraticCurveTo(W/2,my-16,W/2+mw/2,my);g.stroke();g.setLineDash([]);
  const mx=W/2-mw/2+mw*k,myy=my-16*2*k*(1-k)*2*.5;
  g.fillStyle=k>.88?'#ffb070':'#f4ecc8';g.shadowColor='#fff3c0';g.shadowBlur=10;g.beginPath();g.arc(mx,myy,6,0,TAU);g.fill();g.shadowBlur=0;
  g.fillStyle='rgba(233,223,198,.5)';g.font='11px '+FONT;g.fillText('暁',W/2+mw/2+12,my);g.fillText('宵',W/2-mw/2-12,my);
  // 点数
  g.textAlign='right';const sx=W-12;g.fillStyle='#fff1cf';g.font='700 '+(port?22:26)+'px '+FONT;g.fillText(fmt(S.total),sx-34,top+2);
  g.font='12px '+FONT;g.fillStyle='#b9ad92';g.fillText('チラ',sx,top+5);
  const mult=1+Math.min(2,S.peekT/4);if(mult>1.05&&door.x>EPS){g.fillStyle='#ffd27a';g.font='700 13px '+FONT;g.fillText('じっくり ×'+mult.toFixed(1),sx,top+26)}
  S.plus.forEach((p,i)=>{g.globalAlpha=a*clamp(1.2-p.t,0,1);g.fillStyle='#ffd27a';g.font='700 15px '+FONT;g.fillText('+'+fmt(p.v),sx-34,top+44+i*16-p.t*14)});g.globalAlpha=a;
  // 縁（羽）
  g.textAlign='left';g.font='11px '+FONT;g.fillStyle='#b9ad92';g.fillText('縁',12,top+(port?26:24));
  for(let i=0;i<3;i++){const fx=36+i*20,fy=top+(port?26:24),lost=i>=3-S.strikes;g.save();g.translate(fx,fy);g.rotate(-.5);g.fillStyle=lost?'rgba(198,58,43,.25)':'#f4ecd6';g.beginPath();g.ellipse(0,0,9,3,0,0,TAU);g.fill();
    g.strokeStyle=lost?'rgba(198,58,43,.6)':'rgba(120,100,70,.9)';g.lineWidth=1;g.beginPath();g.moveTo(-9,0);g.lineTo(11,0);g.stroke();g.restore()}
  // 物音
  const nw=Math.min(150,W*.4),nx=W/2-nw/2,ny=dB+(port?30:22),nv=clamp(S.noise,0,1),sh=nv>.6?rnd(-1.5,1.5)*nv:0;
  g.textAlign='right';g.fillStyle=nv>.6?'#ff8a70':'#b9ad92';g.font='12px '+FONT;g.fillText('物音',nx-8+sh,ny);
  g.fillStyle='rgba(233,223,198,.14)';g.fillRect(nx,ny-3,nw,6);g.fillStyle=nv>.6?RED:'#d9b060';g.fillRect(nx+sh,ny-3,nw*nv,6);
  g.strokeStyle='rgba(233,223,198,.35)';g.lineWidth=1;g.strokeRect(nx+.5,ny-3.5,nw,7);
  if(S.noisePop>.05){g.globalAlpha=a*S.noisePop;g.strokeStyle='#ff8a70';g.lineWidth=2;for(let i=1;i<=3;i++){g.beginPath();g.arc(gx,dTop+ph*.5,(1-S.noisePop)*60+i*14,-.7,.7);g.stroke();g.beginPath();g.arc(gx,dTop+ph*.5,(1-S.noisePop)*60+i*14,Math.PI-.7,Math.PI+.7);g.stroke()}g.globalAlpha=a}
  // 短冊（発見）
  const sp=port?26:34,sw=port?22:28,fs=port?12.5:15;
  for(let i=0;i<4;i++)if(S.got[i]){const k2=easeOut((S.T-S.gotT[i])*2.4),name=NIGHTS[n].items[i][0],x=gx-(port?16:24)-i*sp,hh=(name.length+2.2)*fs*1.08+10,y=dTop+ph*.07-(1-k2)*40;
    g.globalAlpha=a*k2;ln([x,dTop,x,y],1,'rgba(184,148,74,.8)');g.save();g.shadowColor=`rgba(255,200,100,${1-clamp((S.T-S.gotT[i])/1.5,0,1)})`;g.shadowBlur=18;g.fillStyle='#efe4c9';g.fillRect(x-sw/2,y,sw,hh);g.restore();
    g.fillStyle=RED;g.fillRect(x-sw/2+3,y+4,sw-6,fs*1.25);g.fillStyle='#fff5e0';g.font='700 '+(fs*.74)+'px '+FONT;g.textAlign='center';g.textBaseline='middle';g.fillText('発見',x,y+4+fs*.65);
    vtext(name,x,y+fs*1.5+4,fs,INK,true);g.globalAlpha=a}
  // 最初の手引き
  if(n===1&&!S.tut.open&&S.st==='play'){const hx=gx+door.x*u+pw*.13,hy=dTop+ph*.53,p=(S.T*1.1)%1;g.globalAlpha=a*(1-p)*.95;g.strokeStyle='#ffd27a';g.fillStyle='#ffd27a';g.lineWidth=3;
    const ax=hx+pw*.08+p*pw*.22;g.beginPath();g.moveTo(hx+pw*.08,hy);g.lineTo(ax,hy);g.stroke();g.beginPath();g.moveTo(ax+10,hy);g.lineTo(ax-2,hy-8);g.lineTo(ax-2,hy+8);g.fill()}
  g.restore();
}
function render(){
  g.setTransform(dpr,0,0,dpr,0,0);
  const fl=.5+.5*Math.sin(S.T*11)*Math.sin(S.T*4.3+1),n=S.night;
  const sx=S.shake?rnd(-1,1)*S.shake:0,sy=S.shake?rnd(-1,1)*S.shake*.6:0;g.save();g.translate(sx,sy);
  const P={neck:C.neck,turn:C.turn,alert:C.alert,fl,st:C.st,rt:S.T};
  const front=()=>corridor({open:door.x,inner:S.end==='gone'?()=>sceneGone(S.ft):()=>SC[S.st==='title'?1:n](C.wt,P),shadow:S.end!=='gone',sneck:C.neck,sturn:C.turn,dawn:S.dawn,fl});
  if(S.st==='finale'&&S.pan>0||S.st==='result'&&S.end!=='gone'){
    const p=S.st==='result'?1:ease(S.pan);
    const back=()=>corridor({open:S.bOpen,inner:()=>sceneBack(S.T),cool:true,shadow:S.fst>=3||S.st==='result',sneck:.85+Math.sin(S.T*13)*.1,sturn:0,fl,dawn:.6});
    if(p<1){g.save();g.translate(-p*W,0);front();g.restore();g.save();g.translate((1-p)*W,0);back();g.restore();
      g.fillStyle=`rgba(5,4,10,${Math.sin(p*Math.PI)*.5})`;g.fillRect(0,0,W,H)}
    else back();
  }else front();
  g.restore();
  if(S.flash>.02){const vg=g.createRadialGradient(W/2,H/2,Math.min(W,H)*.2,W/2,H/2,Math.max(W,H)*.75);vg.addColorStop(0,'rgba(198,58,43,0)');vg.addColorStop(1,`rgba(198,58,43,${.6*S.flash})`);g.fillStyle=vg;g.fillRect(0,0,W,H)}
  // 周辺減光
  const v=g.createRadialGradient(W/2,H*.5,Math.min(W,H)*.35,W/2,H*.5,Math.max(W,H)*.8);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.55)');g.fillStyle=v;g.fillRect(0,0,W,H);
  hud(S.hud);
}
let last=0;
function loop(ts){const dt=Math.min(.05,(ts-last)/1000||0);last=ts;
  dust.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.x<0)p.x=1;if(p.x>1)p.x=0;if(p.y<0)p.y=1;if(p.y>1)p.y=0});
  for(let i=0;i<(S.ts||1);i++)update(dt);render();requestAnimationFrame(loop)}

/* ---------- 入力 ---------- */
cv.addEventListener('pointerdown',e=>{initAudio();if(S.st!=='play'||S.auto!==null)return;door.drag=true;door.sx=e.clientX;door.so=door.x;door.target=door.x;try{cv.setPointerCapture(e.pointerId)}catch(_){}
  if(S.night===1&&!S.tut.open)sub('襖を、そっと右へ引く',99,true)});
cv.addEventListener('pointermove',e=>{if(!door.drag)return;door.target=clamp(door.so+(e.clientX-door.sx)/u,0,MAX)});
const up=()=>{if(!door.drag)return;door.drag=false;if(door.target>.5)door.target=clamp(door.x+door.v*.05,0,MAX)};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
$('card').addEventListener('pointerdown',()=>{if(cardGo&&S.T-cardAt>.7)cardGo()});
window.addEventListener('keydown',e=>{const k=e.key.length===1?e.key.toLowerCase():e.key;
  if([' ','ArrowLeft','ArrowRight'].includes(k))e.preventDefault();
  if(e.repeat)return;keys[k]=true;
  if(k===' '||k==='Enter'){if($('zukan').classList.contains('on'))return;if(cardGo&&S.T-cardAt>.7){cardGo();keys[k]=false}else if(S.st==='finale'&&S.fst===1&&$('fin').classList.contains('on'))finalePress();}
  if(S.st==='play'&&S.night===1&&!S.tut.open)initAudio();
});
window.addEventListener('keyup',e=>{const k=e.key.length===1?e.key.toLowerCase():e.key;keys[k]=false});
window.addEventListener('blur',()=>{for(const k in keys)keys[k]=false;up()});
$('bStart').onclick=startGame;$('bAgain').onclick=startGame;$('bFin').onclick=finalePress;
$('bZukan').onclick=$('bZ2').onclick=openZukan;$('bZClose').onclick=()=>show('zukan',0);
$('bShare').onclick=()=>window.open('https://twitter.com/intent/tweet?text='+encodeURIComponent(shareText+' #絶対に覗いてはいけません #100個のバカゲー'),'_blank','noopener');
window.addEventListener('resize',resize);
for(let i=0;i<46;i++)dust.push({x:Math.random(),y:Math.random(),vx:rnd(-.008,.008),vy:rnd(-.012,.004),s:rnd(1,2.2)});
resize();refreshTitle();S.auto=2.4;
requestAnimationFrame(loop);
})();
