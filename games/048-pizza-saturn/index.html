@keyframes spinr{to{transform:rotate(-360deg)}}

 if(G.mode==='play')playUpdate(dt,S);else if(G.mode==='ending')endUpdate(dt);
 // 生地の見た目

 if(G.mode==='title'||G.mode==='play'||(G.end&&G.end.kind==='ring')){
  doughG.position.x=0;
  if(G.punch){const p=G.punch;p.t+=dt;const k=clamp(p.t/p.dur,0,1),e=k*k*(3-2*k),y=lerp(p.y0,EY,e);doughG.position.y=y;const dy=y-EY;
   U.uInner.value=Math.max(U.uInner.value,dy<RE?1.13*Math.sqrt(Math.max(0,RE*RE-dy*dy))/R:0);
   if(!p.hit&&dy<RE){p.hit=true;G.freeze=.18;shake(1);sBoom();flash();const c=[0xf7e3b0,0xf0d090];c.fl=1;for(let i=0;i<60;i++){const a=rnd(TAU);emit(Math.cos(a)*RE*.4,-30,Math.sin(a)*RE*.4,Math.cos(a)*RE*rnd(.2,.6),RE*rnd(.2,.8),Math.sin(a)*RE*rnd(.2,.6),RE*rnd(.03,.07),1.8,pick(c),RE*.3,1)}}

function playUpdate(dt,S){
 G.play+=dt;G.st+=dt;if(G.trans>0)G.trans-=dt;G.maxRev=Math.max(G.maxRev,G.rev);

  if(!G.gate){G.D*=Math.exp(grow*dt);if(G.D>=S.d1){G.D=S.d1;G.gate=true;G.gateFill=0;G.gt=0;E_.gtx.innerHTML=`<b>【${S.gate}】</b> ${S.gmsg}`;re(E_.gate);sWarn();shake(.3)}}

   if(G.gt>7&&!G.hint.gate&&G.gateFill<.3){G.hint.gate=1;chefSay('針を白い▼より右へ！思いきり回せ！',4)}

  G.D*=Math.exp(grow*dt);G.frac=clamp(Math.log(G.D/GATE_D)/Math.log(7.69e8/GATE_D),0,1);const pf=G.fin;G.fin-=dt;if(G.fin<5&&(pf|0)!==(G.fin|0))sTick(1-G.fin/5);

 }
 // 厚み
