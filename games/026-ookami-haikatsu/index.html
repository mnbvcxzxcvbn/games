<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>狼の肺活量</title>
<style>
:root{--ink:#33272b;--paper:#fbf3e0;--red:#d9503f;--gold:#f2b632}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#bfe6f2;color:var(--ink);
  font-family:"Hiragino Maru Gothic ProN","Rounded Mplus 1c","Yu Gothic","Meiryo",sans-serif;
  -webkit-user-select:none;user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
canvas.hold{cursor:grabbing}
#back{position:fixed;left:8px;top:6px;z-index:9;font-size:12px;font-weight:700;color:var(--ink);background:rgba(251,243,224,.85);
  padding:3px 9px;border-radius:10px;text-decoration:none;border:1.5px solid var(--ink)}
.ov{position:fixed;z-index:5;display:none}
.card{background:var(--paper);border:3px solid var(--ink);border-radius:18px;box-shadow:5px 6px 0 rgba(51,39,43,.9);padding:16px 18px}
.btn{font:inherit;font-weight:800;font-size:18px;color:var(--ink);background:var(--gold);border:3px solid var(--ink);border-radius:999px;
  padding:10px 24px;cursor:pointer;box-shadow:3px 4px 0 var(--ink);transition:transform .08s,box-shadow .08s;white-space:nowrap}
.btn:hover{transform:translate(-1px,-1px);box-shadow:4px 5px 0 var(--ink)}
.btn:active{transform:translate(2px,3px);box-shadow:1px 1px 0 var(--ink)}
.btn.sub{background:#fff;font-size:15px;padding:9px 18px}
/* title */
#title{right:4vw;bottom:7vh;width:min(440px,46vw)}
#title .lead{font-size:16px;font-weight:800;line-height:1.5;margin-bottom:10px}
#title ul{list-style:none;font-size:13.5px;line-height:1.75;margin-bottom:12px}
#title li b{display:inline-block;background:var(--ink);color:var(--paper);border-radius:6px;padding:0 7px;margin-right:6px;font-size:12px}
#title .row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
#title .rec{font-size:12px;line-height:1.5;opacity:.85}
/* result */
#res{right:4vw;top:50%;transform:translateY(-50%);width:min(430px,46vw)}
#res .card{text-align:center;animation:pop .45s cubic-bezier(.2,1.5,.4,1)}
@keyframes pop{from{transform:scale(.7) rotate(-3deg);opacity:0}to{transform:none;opacity:1}}
#rEnd{font-size:12px;font-weight:800;letter-spacing:.1em;color:#fff;background:var(--ink);display:inline-block;border-radius:999px;padding:2px 12px}
#rName{font-size:30px;line-height:1.2;margin:8px 0 2px;color:var(--red);text-shadow:2px 2px 0 var(--ink)}
#rTitle{font-size:15px;font-weight:800;margin-bottom:10px}
.stats{display:flex;justify-content:center;gap:8px;margin-bottom:10px}
.stats div{flex:1;background:#fff;border:2px solid var(--ink);border-radius:12px;padding:6px 2px}
.stats b{display:block;font-size:19px;line-height:1.2}
.stats span{font-size:11px;opacity:.8}
#rCom{font-size:14px;line-height:1.6;margin-bottom:10px;font-weight:700}
#rEnds{display:flex;justify-content:center;gap:5px;margin-bottom:6px}
#rEnds i{font-style:normal;width:30px;height:30px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font-size:13px;font-weight:800;background:#e9dfc8;color:#a89c84}
#rEnds i.on{background:var(--gold);color:var(--ink)}
#rEnds i.now{outline:3px solid var(--red);outline-offset:1px}
#rHint{font-size:12px;opacity:.85;margin-bottom:12px;min-height:1.2em}
#res .row{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
#knock{right:18px;bottom:84px;z-index:6}
@media (orientation:portrait){
  #title{left:12px;right:12px;bottom:12px;width:auto}
  #title .card{padding:12px 14px}
  #title .lead{font-size:14.5px;margin-bottom:6px}
  #title ul{font-size:12.5px;line-height:1.65;margin-bottom:8px}
  #res{left:12px;right:12px;top:auto;bottom:12px;transform:none;width:auto}
  #res .card{padding:12px 12px}
  #rName{font-size:26px}
  #knock{right:12px;bottom:96px}
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<a id="back" href="../../index.html">← 一覧</a>
<div id="title" class="ov"><div class="card">
  <p class="lead">三匹の子豚の狼になって、家を吹き飛ばせ。<br>藁、木、レンガ……そして宇宙へ。</p>
  <ul>
    <li><b>吸う</b>画面を押して うしろ（←）へ引く</li>
    <li><b>吹く</b>離す（上下に引くと角度が変わる）</li>
    <li><b>注意</b>吸いすぎると、狼が破裂します</li>
    <li><b>キー</b>スペース長押しで吸う／↑↓で角度</li>
  </ul>
  <div class="row"><button id="start" class="btn">吸いはじめる</button><div class="rec" id="rec"></div></div>
</div></div>
<div id="res" class="ov"><div class="card">
  <div id="rEnd"></div>
  <h2 id="rName"></h2>
  <div id="rTitle"></div>
  <div class="stats"><div><b id="rScore"></b><span>スコア</span></div><div><b id="rWind"></b><span>最大風速</span></div><div><b id="rDest"></b><span>吹き飛ばした家</span></div></div>
  <p id="rCom"></p>
  <div id="rEnds"></div>
  <p id="rHint"></p>
  <div class="row"><button id="again" class="btn">もう一度</button><button id="share" class="btn sub">Xでシェア</button></div>
</div></div>
<button id="knock" class="btn sub ov">吹かない（ノックする）</button>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),cv=$('c'),g=cv.getContext('2d');
const TAU=Math.PI*2,INK='#33272b',PAPER='#fbf3e0',RED='#d9503f',GOLD='#f2b632';
const FONT='"Hiragino Maru Gothic ProN","Rounded Mplus 1c","Yu Gothic","Meiryo",sans-serif';
const rnd=(a=1,b)=>b===undefined?Math.random()*a:a+Math.random()*(b-a);
const clamp=(v,a=0,b=1)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t;
const eOut=t=>1-Math.pow(1-t,3),eBack=t=>{const c=1.70158;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2)};
const hash=i=>{const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x)};
const pick=a=>a[(Math.random()*a.length)|0];
const mix=(a,b,t)=>{t=clamp(t);const p=parseInt(a.slice(1),16),q=parseInt(b.slice(1),16);
  return `rgb(${lerp(p>>16,q>>16,t)|0},${lerp(p>>8&255,q>>8&255,t)|0},${lerp(p&255,q&255,t)|0})`};
let W=0,H=0,DPR=1,portrait=false,LW=2.6;

/* ================= セーブ ================= */
const KEY='ookami-haikatsu-26';
let save={hi:0,ends:{},plays:0};
try{Object.assign(save,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){}
const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(save))}catch(e){}};

/* ================= 音 ================= */
let AC=null,MG=null,NB=null,amb=null,inh=null,drone=null;const sfxT={};
function audio(){
  if(AC){if(AC.state==='suspended')AC.resume();return}
  try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){return}
  MG=AC.createGain();MG.gain.value=.5;const cp=AC.createDynamicsCompressor();MG.connect(cp);cp.connect(AC.destination);
  NB=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  const s=AC.createBufferSource();s.buffer=NB;s.loop=true;const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=360;
  const ga=AC.createGain();ga.gain.value=.03;s.connect(f);f.connect(ga);ga.connect(MG);s.start();amb={f,ga};
  const o=AC.createOscillator();o.type='sine';o.frequency.value=55;const og=AC.createGain();og.gain.value=0;o.connect(og);og.connect(MG);o.start();drone=og;
}
function nz(dur,o={}){if(!AC)return;const t=AC.currentTime+(o.d||0),s=AC.createBufferSource();s.buffer=NB;s.loop=true;
  const f=AC.createBiquadFilter();f.type=o.type||'bandpass';f.frequency.setValueAtTime(o.f||800,t);
  if(o.f2)f.frequency.exponentialRampToValueAtTime(o.f2,t+dur*(o.fr||1));f.Q.value=o.q||1;
  const ga=AC.createGain();ga.gain.setValueAtTime(.0001,t);ga.gain.linearRampToValueAtTime(o.v||.2,t+(o.a||.008));
  ga.gain.exponentialRampToValueAtTime(.0001,t+dur);s.connect(f);f.connect(ga);ga.connect(MG);s.start(t,Math.random());s.stop(t+dur+.05)}
function tn(fq,dur,o={}){if(!AC)return;const t=AC.currentTime+(o.d||0),s=AC.createOscillator();s.type=o.type||'sine';
  s.frequency.setValueAtTime(fq,t);if(o.f2)s.frequency.exponentialRampToValueAtTime(o.f2,t+dur);
  const ga=AC.createGain();ga.gain.setValueAtTime(.0001,t);ga.gain.linearRampToValueAtTime(o.v||.15,t+(o.a||.01));
  ga.gain.exponentialRampToValueAtTime(.0001,t+dur);s.connect(ga);ga.connect(MG);s.start(t);s.stop(t+dur+.05)}
function sfx(k,v=1){if(!AC)return;const now=AC.currentTime;if(sfxT[k]&&now-sfxT[k]<.05)return;sfxT[k]=now;
  if(ST&&ST.space&&k!=='pop')v*=.45;
  switch(k){
    case'straw':nz(.14,{f:2200+rnd(1800),q:.6,v:.07*v});break;
    case'wood':nz(.09,{f:650+rnd(500),q:5,v:.34*v});tn(170+rnd(90),.07,{type:'triangle',v:.1*v});break;
    case'brick':nz(.13,{f:260+rnd(160),q:1.2,v:.4*v,type:'lowpass'});tn(95+rnd(40),.09,{v:.16*v,f2:55});break;
    case'conc':nz(.32,{f:190,q:.8,v:.5*v,type:'lowpass'});tn(62,.3,{v:.3*v,f2:34});break;
    case'steel':tn(520+rnd(380),.4,{type:'square',v:.045*v});tn(1310+rnd(500),.3,{v:.05*v});nz(.07,{f:3200,q:2,v:.15*v});break;
    case'glass':for(let i=0;i<4;i++)tn(2100+rnd(3200),.12+rnd(.15),{v:.045*v,d:i*.02});nz(.1,{f:6000,q:.8,v:.1*v});break;
    case'pig':tn(720,.34,{type:'sawtooth',v:.07,f2:1750});tn(740,.34,{type:'square',v:.03,f2:1850});break;
    case'pop':nz(.3,{f:1300,q:.4,v:.75,f2:180});tn(300,.28,{v:.35,f2:38});break;
    case'puff':nz(.12,{f:900,q:.7,v:.1});break;
    case'knock':tn(190,.06,{type:'triangle',v:.3,f2:120});nz(.04,{f:900,q:2,v:.2});break;
    case'tick':tn(1300+rnd(900),.03,{type:'square',v:.03});break;
    case'heart':tn(58,.12,{v:.3,f2:40});break;
    case'star':tn(1760,.5,{v:.07});tn(2637,.6,{v:.05,d:.06});break;
    case'splat':nz(.22,{f:520,q:.7,v:.4,f2:140,type:'lowpass'});break;
    case'ui':tn(660,.08,{type:'triangle',v:.12});tn(990,.12,{type:'triangle',v:.1,d:.06});break;
  }}
function jingle(ns,type='triangle',v=.12){let t=0;for(const [f,d] of ns){if(f)tn(f,d*1.6,{type,v,d:t});t+=d}}
function inhStart(){if(!AC||inh)return;const s=AC.createBufferSource();s.buffer=NB;s.loop=true;const f=AC.createBiquadFilter();f.type='bandpass';f.Q.value=2.2;
  f.frequency.value=300;const ga=AC.createGain();ga.gain.value=0;s.connect(f);f.connect(ga);ga.connect(MG);s.start();inh={s,f,ga}}
function inhSet(c){if(!inh)return;const t=AC.currentTime;inh.f.frequency.setTargetAtTime(280+c*2100,t,.05);inh.ga.gain.setTargetAtTime(.05+c*.17,t,.05)}
function inhStop(){if(!inh)return;inh.ga.gain.setTargetAtTime(0,AC.currentTime,.03);inh.s.stop(AC.currentTime+.25);inh=null}
function blowSnd(P,dur){if(!AC)return;const v=ST.space?.45:1;
  nz(dur+.35,{type:'lowpass',f:500+P*2600,f2:240,q:.7,v:(.22+P*.3)*v,a:.03});
  nz(dur*.8,{f:1500+P*1200,f2:600,q:1.5,v:.1*v,a:.02});
  if(P>.5)tn(70,dur+.3,{v:.2*P*v,f2:36})}
function ambient(i){if(!amb)return;const t=AC.currentTime;
  amb.f.frequency.setTargetAtTime([360,420,330,260,200,90][i],t,.5);amb.ga.gain.setTargetAtTime([.03,.03,.03,.04,.06,.012][i],t,.5);
  drone.gain.setTargetAtTime(i===5?.05:i===4?.025:0,t,.5)}

/* ================= 状態 ================= */
const G={state:'title',phase:'',t:0,si:0,score:0,lives:3,breaths:0,blows:0,houses:0,maxWind:0,rel:0,hs:0,flash:0,
  bub:[],banner:null,wipe:null,card:0,hint:'',flown:false,usedHere:0,tt:0,lastRel:0,end:null};
let PO=0,ST=null,bodies=[],pigs=[],items=[],parts=[],timers=[],total=1,supDirty=false;
const cam={x:300,y:0,s:1,gy:500,focus:null};let shake=0,shx=0,shy=0;
const wolf={x:0,y:0,rx:0,c:0,aim:-.12,blow:0,pop:0,blush:0,tw:null,mx:0,my:0,t:0};
const wind={on:false,t:0,dur:1,P:0,c:0,cur:0,ux:1,uy:0,mx:0,my:0,end:-9};
const FIN={candles:true,cake:true,cream:false,banner:true,wax:0,happy:false,broken:false};
const after=(d,fn)=>timers.push({t:G.t+d,fn});
const pw=c=>c<=1?Math.pow(c,1.2):1+(c-1)*3.2;
const isFinal=()=>G.si===5;

/* ================= 物理 ================= */
const GRAV=1500,VW=1900;
const MAT={
  straw:{den:.22,wind:2.6,air:2.4,tough:.07,col:['#eccb5c','#dfb948','#f3d874'],fx:'straw'},
  wood:{den:.6,wind:1.3,air:.25,tough:.3,col:['#b9793f','#a96b35','#c98a4c'],fx:'wood'},
  brick:{den:1.3,wind:.85,air:.05,tough:.65,col:['#c6573d','#b54c35','#d16549'],fx:'brick'},
  tile:{den:1,wind:.95,air:.05,tough:.5,col:['#7c4a52','#6f424b','#8a545b'],fx:'brick'},
  conc:{den:1.5,wind:.75,air:.03,tough:.84,col:['#b9b6ad','#aeaba2','#c4c1b8'],fx:'conc',crack:1},
  steel:{den:2.1,wind:.7,air:.02,tough:1.1,col:['#7f8e9c','#74838f','#8a99a6'],fx:'steel',crack:1},
  glass:{den:.4,wind:2,air:.5,tough:.16,col:['#bfe9f3','#bfe9f3','#bfe9f3'],fx:'glass',thin:1},
  bag:{den:.7,wind:1.4,air:.3,tough:.3,col:['#cdb98b','#c2ae80','#d6c398'],fx:'straw'},
  hull:{den:.5,wind:1.5,air:0,tough:9,col:['#f1eee6','#e6e3da','#f6f4ee'],fx:'steel'},
  panel:{den:.3,wind:2,air:0,tough:9,col:['#3d5a9a','#38548f','#4463a5'],fx:'glass'}
};
function part(x,y,w,h,mat,o){const M=MAT[mat];
  const b={x,y,hw:w/2,hh:h/2,a:0,vx:0,vy:0,w:0,mat,M,fz:true,sl:false,still:0,dmg:0,tough:M.tough,ci:(Math.random()*3)|0,
    cnt:true,need:1,sup:null,gr:false,dead:false,seed:Math.random(),shk:0,x0:0,x1:0,y0:0,y1:0};
  if(o)Object.assign(b,o);b.m=M.den*w*h/100;b.I=b.m*(w*w+h*h)/12;b.inv=0;b.invI=0;aabb(b);bodies.push(b);return b}
function aabb(b){const c=Math.abs(Math.cos(b.a)),s=Math.abs(Math.sin(b.a)),ex=c*b.hw+s*b.hh,ey=s*b.hw+c*b.hh;b.x0=b.x-ex;b.x1=b.x+ex;b.y0=b.y-ey;b.y1=b.y+ey}
function row(x0,x1,yc,h,unit,off,mat,holes,o){holes=holes||[];let ed=[x0,x1];
  for(let x=x0+off;x<x1-2;x+=unit)if(x>x0+2)ed.push(x);for(const hh of holes)ed.push(hh[0],hh[1]);
  ed=[...new Set(ed.map(v=>Math.round(v*10)/10))].sort((p,q)=>p-q);const out=[];
  for(let i=0;i<ed.length-1;i++){const a=ed[i],b=ed[i+1];if(b-a<3||a<x0||b>x1)continue;const m=(a+b)/2;
    if(holes.some(q=>m>q[0]&&m<q[1]))continue;out.push(part(m,yc,b-a,h,mat,o))}return out}
function link(){const fz=bodies.filter(b=>b.fz);
  for(const b of fz){if(b.sup||b.gr)continue;if(ST.space||b.y1>=-1.5){b.gr=true;continue}
    b.sup=fz.filter(o=>o!==b&&Math.abs(o.y0-b.y1)<3&&Math.min(o.x1,b.x1)-Math.max(o.x0,b.x0)>2);if(!b.sup.length)b.gr=true}}
function checkSupport(){supDirty=false;for(const b of bodies){if(!b.fz||b.gr||!b.sup)continue;let n=0;for(const s of b.sup)if(s.fz)n++;
  if(n<Math.min(b.need,b.sup.length))release(b,rnd(-30,30),0)}}
function release(b,vx,vy){if(!b.fz)return;b.fz=false;b.inv=1/b.m;b.invI=1/b.I;b.vx=vx;b.vy=vy;b.w=rnd(-1,1)*(Math.abs(vx)>80?4:.6);
  supDirty=true;G.lastRel=G.t;if(b.cnt)G.rel++;for(const o of bodies)if(o.sl){o.sl=false;o.still=0}
  const fx=b.M.fx,area=b.hw*b.hh;shake=Math.max(shake,Math.min(9,2+b.m*.25));sfx(fx,clamp(.5+b.m*.05,.4,1.3));
  if(fx==='glass'){b.dead=true;for(let i=0;i<9;i++)bit(b.x+rnd(-b.hw,b.hw),b.y+rnd(-b.hh,b.hh),vx*.5+rnd(-200,400),rnd(-300,200),pick(['#dff6fb','#bfe9f3','#fff']),rnd(4,10))}
  else if(fx==='straw'){for(let i=0;i<3;i++)bit(b.x+rnd(-b.hw,b.hw),b.y+rnd(-b.hh,b.hh),vx*.6+rnd(-100,300),rnd(-300,50),pick(b.M.col),rnd(6,14),1.5)}
  else if(fx==='wood'){for(let i=0;i<3;i++)bit(b.x,b.y,vx*.5+rnd(-200,300),rnd(-350,50),pick(b.M.col),rnd(5,12));
    if(b.hw>34&&!b.draw&&Math.random()<.6&&Math.abs(vx)>50){b.dead=true;
      for(const s of[-1,1]){const h=part(b.x+s*b.hw/2*Math.cos(b.a),b.y+s*b.hw/2*Math.sin(b.a),b.hw,b.hh*2,'wood',{cnt:false,a:b.a,ci:b.ci});
        h.fz=false;h.inv=1/h.m;h.invI=1/h.I;h.vx=vx+rnd(-60,60);h.vy=vy+rnd(-120,40);h.w=rnd(-5,5)}}}
  else if(fx==='brick'){dust(b.x,b.y,'#d9a08f',14)}
  else if(fx==='conc'){dust(b.x,b.y,'#d8d4c8',26);for(let i=0;i<3;i++)bit(b.x,b.y,rnd(-200,300),rnd(-300,0),'#b9b6ad',rnd(5,10))}
  else if(fx==='steel'){for(let i=0;i<5;i++)bit(b.x,b.y,rnd(-300,400),rnd(-400,100),pick(['#ffe08a','#fff6c9']),rnd(3,6))}
  if(area>900&&G.hs<=0&&G.t-G.lastHs>.5){G.hs=.035;G.lastHs=G.t}
  if(b.onRel)b.onRel(b)}
function pressureAt(x,y){const rx=x-wind.mx,ry=y-wind.my,al=rx*wind.ux+ry*wind.uy;if(al<-30)return 0;
  const pe=rx*wind.uy-ry*wind.ux,a=Math.max(al,0),wd=(72+a*.3)*ST.cone,r=a/ST.reach;return wind.cur*Math.exp(-(pe*pe)/(wd*wd))/(1+r*r)}
const bins=new Map();
function windFrozen(dt){bins.clear();const fz=bodies.filter(b=>b.fz&&!b.dead).sort((a,b)=>a.x0-b.x0),vw=VW*ST.fly;
  for(const b of fz){const p0=pressureAt(b.x,b.y),i0=Math.floor(b.y0/26),i1=Math.floor((b.y1-.01)/26);let mn=99;
    for(let i=i0;i<=i1;i++)mn=Math.min(mn,bins.get(i)||0);const p=p0*Math.pow(.8,mn);
    for(let i=i0;i<=i1;i++)bins.set(i,(bins.get(i)||0)+(b.M.thin?.3:1));
    const q=p/b.tough;b.shk=Math.max(b.shk,Math.min(q,1.6));
    if(q>1)b.dmg+=dt*6*q*q;else if(q>.55)b.dmg+=dt*.5*q;

  const gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,b.sky[0]);gr.addColorStop(.75,b.sky[1]);g.fillStyle=gr;g.fillRect(0,0,W,H);ink();
  const U=Math.min(W,H);
  if(b.k===5){for(let i=0;i<90;i++){const x=hash(i)*W,y=hash(i+50)*H,r=1+hash(i+9)*1.6;g.globalAlpha=.5+.5*Math.sin(G.t*2+i);g.fillStyle='#fff';g.fillRect(x,y,r,r)}g.globalAlpha=1;
    const ex=W*.2-cam.x*.03,ey=H*(portrait?.14:.2)-cam.y*s*.06,er=U*.11;circ(ex,ey,er,'#4f9fd6');g.save();g.beginPath();g.arc(ex,ey,er,0,TAU);g.clip();
    ell(ex-er*.3,ey-er*.2,er*.45,er*.3,'#7fc77d',false,.4);ell(ex+er*.4,ey+er*.35,er*.4,er*.25,'#7fc77d',false,-.3);
    g.globalAlpha=G.si===5?.18:.6;ell(ex,ey-er*.55,er*.7,er*.12,'#fff',false);g.globalAlpha=1;g.restore();
    txt('↑ 大気が ちょっと減った',ex,ey+er+14,Math.max(10,U*.018),'rgba(255,255,255,.7)')}
  else{const sx=W*.84+wind.cur*14,sy=H*.15,sr=U*.065;g.save();g.translate(sx,sy);g.rotate(G.t*.1);g.lineWidth=2.6;
    for(let i=0;i<10;i++){const a=i*TAU/10;g.beginPath();g.moveTo(Math.cos(a)*sr*1.2,Math.sin(a)*sr*1.2);g.lineTo(Math.cos(a)*sr*1.45,Math.sin(a)*sr*1.45);g.stroke()}g.restore();
    g.lineWidth=2.6;circ(sx,sy,sr,b.k===3?'#ffb35c':b.k===4?'#f1e3b2':'#ffd95c');g.fillStyle=INK;g.fillRect(sx-sr*.35,sy-sr*.2,4,5);g.fillRect(sx+sr*.25,sy-sr*.2,4,5);
    if(wind.on||G.phase==='inhale'&&wolf.c>.9)circ(sx,sy+sr*.3,sr*.14,INK,false),g.fill();else{g.beginPath();g.arc(sx,sy+sr*.15,sr*.3,.2,Math.PI-.2);g.stroke()}
    for(const c of clouds){c.x+=(.004+wind.cur*1.1)*(1/60);if(c.x>1.25)c.x=-.25;const x=c.x*W,y=c.y*H,r=U*.045*c.s;g.fillStyle=b.k===4?'#eee6d2':'#fff';
      g.beginPath();g.arc(x,y,r,0,TAU);g.arc(x+r*1.1,y+r*.15,r*.8,0,TAU);g.arc(x-r*1.1,y+r*.2,r*.7,0,TAU);g.fill()}}
  if(b.k!==5){g.fillStyle=b.far;g.beginPath();g.moveTo(0,H);for(let x=0;x<=W+24;x+=24){const wx=(x-W/2)/s+cam.x*.3;g.lineTo(x,hz-(50+36*Math.sin(wx/210)+16*Math.sin(wx/71+2))*s*1.25)}g.lineTo(W,H);g.fill();
    const par=.55,sp=b.k===3?130:b.k===1?95:190,i0=Math.floor((cam.x*par-W/2/s)/sp)-1,i1=Math.ceil((cam.x*par+W/2/s)/sp)+1;g.lineWidth=Math.max(1.6,2*s);
    for(let i=i0;i<=i1;i++){const h1=hash(i+b.k*31),h2=hash(i*3+5),x=W/2+(i*sp+h1*sp*.5-cam.x*par)*s+shx*.5;g.fillStyle=b.deco;
      if(b.k===0){g.beginPath();g.arc(x,hz,(26+h2*30)*s,Math.PI,TAU);g.fill()}
      else if(b.k===1){const h=(150+h2*130)*s,w=(42+h1*20)*s;poly([x-w,hz,x,hz-h,x+w,hz],b.deco,false);poly([x-w*.75,hz-h*.4,x,hz-h*1.15,x+w*.75,hz-h*.4],b.deco,false)}
      else if(b.k===2){if(h2>.35){const w=(50+h1*30)*s,h=(40+h2*30)*s;g.fillRect(x-w/2,hz-h,w,h);poly([x-w*.65,hz-h,x,hz-h-w*.5,x+w*.65,hz-h],b.deco,false)}}
      else if(b.k===3){const w=(70+h1*50)*s,h=(160+h2*460)*s;g.fillRect(x-w/2,hz-h,w,h);g.fillStyle='rgba(255,224,138,.75)';
        for(let r=0;r<h/(26*s)-1;r++)for(let c=0;c<3;c++)if(hash(i*7+r*3+c)>.45)g.fillRect(x-w/2+w*(.16+c*.27),hz-h+(10+r*26)*s,w*.14,10*s)}
      else if(b.k===4){if(h2>.5){const w=(120+h1*90)*s,h=(50+h2*50)*s;poly([x-w/2,hz,x-w*.38,hz-h,x+w*.38,hz-h,x+w/2,hz],b.deco,false)}
        else{g.strokeStyle=b.deco;g.lineWidth=5*s;g.beginPath();g.moveTo(x,hz);g.lineTo(x,hz-60*s);g.moveTo(x,hz-36*s);g.lineTo(x-16*s,hz-52*s);g.moveTo(x,hz-28*s);g.lineTo(x+14*s,hz-46*s);g.stroke();ink()}}}
    g.fillStyle=b.gnd;g.fillRect(0,hz,W,H-hz+40);g.fillStyle=b.gnd2;g.fillRect(0,hz,W,Math.max(5,9*s));
    g.strokeStyle=b.gnd2;g.lineWidth=Math.max(1.5,2.4*s);g.lineCap='round';const t0=Math.floor((cam.x-W/2/s)/53)-1,t1=t0+Math.ceil(W/s/53)+2;g.beginPath();
    for(let i=t0;i<=t1;i++){const x=W/2+(i*53+hash(i)*30-cam.x)*s+shx,y=hz+(16+hash(i+77)*(H-hz)/s*.9)*s;g.moveTo(x-6*s,y);g.lineTo(x,y-7*s);g.lineTo(x+6*s,y)}g.stroke();
    ink();g.lineWidth=Math.max(2,LW*s);g.beginPath();g.moveTo(0,hz);g.lineTo(W,hz);g.stroke()}}
function drawMoon(){circ(140,1500,1500,'#cfcfd8');for(const[x,y,r]of[[-90,60,30],[120,34,18],[260,90,40],[40,130,24],[-200,150,34]])ell(x,y,r,r*.4,'#b9b9c6')}

/* ================= HUD ================= */
function drawBubbles(){const fs=portrait?13:15;g.font=`800 ${fs}px ${FONT}`;
  for(const b of G.bub){const[ax,ay,bl]=anchor(b.id),[sx,sy]=w2s(ax,ay),ln=b.text.split('\n');let w=0;for(const l of ln)w=Math.max(w,g.measureText(l).width);w+=22;const h=ln.length*(fs+5)+13;
    const k=b.t<.18?eBack(b.t/.18):b.t>b.dur-.12?(b.dur-b.t)/.12:1;const x=clamp(sx,w/2+8,W-w/2-8),y=bl?sy+h/2+14:clamp(sy-h/2-12,h/2+62,H-h/2-70),d=bl?-1:1;
    g.save();g.translate(x,y);g.scale(k,k);g.lineWidth=2.5;g.strokeStyle=INK;g.lineJoin='round';
    const tx=clamp(sx-x,-w/2+12,w/2-12);g.beginPath();g.moveTo(tx-7,d*(h/2-2));g.lineTo(tx+(sx-x-tx)*.2,d*(h/2+11));g.lineTo(tx+7,d*(h/2-2));g.fillStyle=PAPER;g.fill();g.stroke();
    rr(-w/2,-h/2,w,h,12,PAPER);g.fillStyle=PAPER;g.fillRect(tx-6,bl?-h/2-1:h/2-4,12,5);
    ln.forEach((l,i)=>txt(l,0,-h/2+7+(fs+5)*(i+.5),fs,b.id==='wolf'?'#3d4a66':INK));g.restore()}}
function heart(x,y,r,on){g.beginPath();g.moveTo(x,y+r*.9);g.bezierCurveTo(x-r*1.6,y-r*.2,x-r*.7,y-r*1.3,x,y-r*.35);g.bezierCurveTo(x+r*.7,y-r*1.3,x+r*1.6,y-r*.2,x,y+r*.9);g.fillStyle=on?RED:'rgba(255,255,255,.5)';g.fill();g.stroke()}
function drawHUD(){const fs=portrait?13:15;g.lineWidth=2;g.strokeStyle=INK;g.lineJoin='round';
  txt(`第${G.si+1}話　${ST.name}`,12,46,fs+2,PAPER,{al:'left',st:INK,sw:5,wt:900});
  txt(G.score.toLocaleString(),W-12,22,fs+6,PAPER,{al:'right',st:INK,sw:5,wt:900});
  g.lineWidth=1.6;for(let i=0;i<3;i++)heart(W-24-i*27,50,10,i<G.lives);g.lineWidth=2;
  const bx=12,by=66;txt('息',bx,by+1,fs,PAPER,{al:'left',st:INK,sw:4});
  for(let i=0;i<ST.breaths;i++){const x=bx+fs+16+i*26,on=i<G.breaths;for(const e of on?[2.2,0]:[0]){g.fillStyle=e?INK:on?'#fff':'rgba(255,255,255,.35)';g.beginPath();g.arc(x-5,by+2,6+e,0,TAU);g.fill();g.beginPath();g.arc(x+4,by,8+e,0,TAU);g.fill();g.beginPath();g.arc(x+11,by+3,5+e,0,TAU);g.fill()}}
  if(!isFinal()){const r=clamp(G.rel/total),w=portrait?120:170,x=W/2-w/2,y=portrait?92:20;rr(x,y,w,14,7,'rgba(255,255,255,.55)');if(r>0){rr(x,y,Math.max(14,w*r),14,7,r>=ST.clear?RED:GOLD)}
    g.beginPath();g.moveTo(x+w*ST.clear,y-4);g.lineTo(x+w*ST.clear,y+18);g.stroke();txt(`破壊率 ${Math.round(r*100)}%`,W/2,y+27,fs-2,PAPER,{st:INK,sw:4})}
  // 肺メーター
  const mw=Math.min(W-84,440),mh=22,mx=W/2-mw/2,my=H-(portrait?62:44),c=wolf.c,act=G.phase==='inhale';
  if(['ready','inhale','blow','settle'].includes(G.phase)){
    rr(mx,my,mw,mh,11,'rgba(251,243,224,.92)');g.save();rr(mx,my,mw,mh,11,null,false);g.clip();
    g.fillStyle='rgba(217,80,63,.28)';g.fillRect(mx+mw*.8,my,mw*.2,mh);
    for(let i=0;i<7;i++){g.fillStyle='rgba(217,80,63,.5)';g.beginPath();const x=mx+mw*.8+i*14-((G.t*20)%14);g.moveTo(x,my+mh);g.lineTo(x+8,my);g.lineTo(x+13,my);g.lineTo(x+5,my+mh);g.fill()}
    if(c>0){const gr=g.createLinearGradient(mx,0,mx+mw,0);gr.addColorStop(0,'#8fd17c');gr.addColorStop(.6,GOLD);gr.addColorStop(.82,RED);gr.addColorStop(1,'#9a4a9c');g.fillStyle=gr;g.fillRect(mx,my,mw*c/1.25,mh)}
    g.restore();rr(mx,my,mw,mh,11,null);g.beginPath();g.moveTo(mx+mw*.8,my-5);g.lineTo(mx+mw*.8,my+mh+5);g.stroke();
    txt('肺',mx-2,my+mh/2,fs+6,RED,{al:'right',st:INK,sw:5,wt:900});txt('キケン',mx+mw*.9,my+mh/2+1,11,act&&c>1&&Math.sin(G.t*30)>0?'#fff':INK,{wt:900});
    if(c>0)txt(Math.round(c*100)+'%',mx+Math.max(26,mw*c/1.25-4),my+mh/2+1,13,INK,{al:'right',wt:900});
    if(G.hint&&G.phase==='ready')txt(G.hint,W/2,my-16,portrait?11.5:14,PAPER,{st:INK,sw:4});
    if(G.phase==='ready'&&G.si===0&&G.blows===0){const t=(G.t%2.2)/2.2,px=W*.56-eOut(clamp(t*1.6))*Math.min(150,W*.3),py=H*(portrait?.8:.6),a=t>.8?(1-t)/.2:1;g.globalAlpha=a*.9;
      g.setLineDash([5,7]);g.beginPath();g.moveTo(W*.56,py);g.lineTo(px,py);g.stroke();g.setLineDash([]);circ(px,py,14,'rgba(251,243,224,.9)');circ(px,py,5,INK,false);g.fill();
      txt(t<.6?'← 引いて 吸う':'パッ と離す',px,py-28,fs,PAPER,{st:INK,sw:4});g.globalAlpha=1}}
  if(act&&inp.down){g.save();g.globalAlpha=.6;g.setLineDash([4,6]);g.lineWidth=2.5;g.strokeStyle='#fff';g.beginPath();g.moveTo(inp.sx,inp.sy);g.lineTo(inp.x,inp.y);g.stroke();g.setLineDash([]);
    g.globalAlpha=.85;circ(inp.sx,inp.sy,6,'#fff',false);g.strokeStyle=INK;circ(inp.x,inp.y,13,'rgba(251,243,224,.85)');g.restore()}
  if(G.phase==='card'){const t=G.card,k=t<.35?eBack(t/.35):t>2.15?Math.max(0,1-(t-2.15)/.3):1,w=Math.min(W-36,440),h=portrait?150:164;
    g.save();g.translate(W/2,H*.4-(1-k)*H*.6);g.rotate(-.025);g.fillStyle='rgba(51,39,43,.9)';rr(-w/2+6,-h/2+7,w,h,18,'rgba(51,39,43,.9)',false);g.lineWidth=3;rr(-w/2,-h/2,w,h,18,PAPER);
    txt(`第 ${G.si+1} 話`,0,-h/2+26,15,RED,{wt:900});txt(ST.name,0,-h/2+64,Math.min(40,w/ST.name.length*.86),INK,{wt:900});txt(ST.sub,0,-h/2+101,Math.min(15,w/ST.sub.length*.92),INK);
    rr(-w/2+26,h/2-40,w-52,26,13,INK,false);txt(`今回の肺活量　${ST.cc}`,0,h/2-26,14,GOLD,{wt:900});g.restore()}
  if(G.banner){const b=G.banner,k=b.t<.25?eBack(b.t/.25):1,sz=Math.min(W*.2,110);g.save();g.translate(W/2,H*.3);g.rotate(-.07);g.scale(k,k);
    txt(b.text,0,0,sz,RED,{st:INK,sw:sz*.18,wt:900});txt(b.text,0,0,sz,RED,{st:PAPER,sw:sz*.07,wt:900});g.restore();
    if(b.t>.35)txt(b.sub,W/2,H*.3+sz*.78,portrait?14:19,PAPER,{st:INK,sw:5,wt:900})}}
function drawWipe(){const w=G.wipe;if(!w)return;const n=9,bh=H/n+2;for(let i=0;i<n;i++){const d=i*.035,t=w.t<.5?clamp((w.t-d)/.32):1-clamp((w.t-.55-d)/.32),e=eOut(t);
  g.fillStyle=i%2?PAPER:'#f3e7c8';if(w.t<.5)g.fillRect(-10,i*bh-1,(W+20)*e,bh);else g.fillRect((W+20)*(1-e)-10,i*bh-1,(W+20)*e+10,bh)}
  if(w.t>.25&&w.t<.8){g.globalAlpha=clamp(Math.min(w.t-.25,.8-w.t)*8);txt('のっし のっし…',W/2,H/2,portrait?22:30,INK,{wt:900});g.globalAlpha=1}}
function drawTitleLogo(){for(const o of titleLt){g.save();g.translate(o.x,o.y);g.rotate(o.a+(o.ch==='の'?.08:-.03));const L=o.L*(o.ch==='の'?.72:1);
  txt(o.ch,4,5,L,INK,{wt:900,st:INK,sw:L*.16});txt(o.ch,0,0,L,o.ch==='肺'?RED:PAPER,{wt:900,st:INK,sw:L*.16});g.restore()}}

/* ================= 描画 ================= */
function draw(){g.setTransform(DPR,0,0,DPR,0,0);drawBG();
  g.save();g.translate(W/2+shx,cam.gy+shy);g.scale(cam.s,cam.s);g.translate(-cam.x,-cam.y);ink();
  if(ST.space)drawMoon();
  if(G.state!=='title'){
    for(const p of pigs)if(p.st==='in')drawPig(p.x,p.y+(p.win?Math.sin(p.t*40)*1.2:0),p.r,pigMood(p));
    ink();for(const b of bodies)if(!b.dead&&(b.fz||!b.cnt))drawPart(b);for(const b of bodies)if(!b.dead&&!b.fz&&b.cnt)drawPart(b);
    for(const p of pigs){if(p.st==='win')drawPig(p.win.x,(p.wy!==undefined?p.wy:p.win.y)+2,p.wy!==undefined?10:p.win.hh*.62,pigMood(p),{head:true});
      else if(p.st==='hub'&&!FIN.broken)drawPig(p.x,p.y+(FIN.happy?-Math.abs(Math.sin(p.t*7))*9:0),p.r,pigMood(p),{hat:true});
      else if(p.st==='fly')drawPig(p.x,p.y,p.r,2,{rot:p.rot,hat:p.hat})}
    for(const it of items)drawItem(it)}
  ink();drawWolf();
  if(G.phase==='inhale'){const a=wolf.aim,L=150+wolf.c*260,sp=.16*ST.cone;g.save();g.globalAlpha=.55;g.strokeStyle='#fff';g.lineWidth=3/cam.s;g.setLineDash([8/cam.s,10/cam.s]);g.lineDashOffset=G.t*60;
    for(const d of[-sp,sp]){g.beginPath();g.moveTo(wolf.mx+Math.cos(a+d)*30,wolf.my+Math.sin(a+d)*30);g.lineTo(wolf.mx+Math.cos(a+d)*L,wolf.my+Math.sin(a+d)*L);g.stroke()}g.restore()}
  drawParts();g.restore();
  if(G.flash>0){g.fillStyle=`rgba(255,255,255,${G.flash*.6})`;g.fillRect(0,0,W,H)}
  if(G.state==='title')drawTitleLogo();
  else{drawBubbles();if(G.state==='play')drawHUD()}
  drawWipe()}

/* ================= 入力 ================= */
function press(){if(G.state!=='play')return false;audio();
  if(G.phase==='card'){G.card=Math.max(G.card,2.15);return false}
  if(G.phase==='cut'){endCut();return false}
  if(G.phase!=='ready'||G.wipe)return false;G.phase='inhale';G.warned=false;wolf.c=0;wolf.blow=0;inhStart();cv.classList.add('hold');G.bub=G.bub.filter(b=>b.id==='wolf'?false:true);return true}
cv.addEventListener('pointerdown',e=>{e.preventDefault();if(inp.down||inp.kb)return;if(press()){inp.down=true;inp.id=e.pointerId;inp.sx=inp.x=e.clientX;inp.sy=inp.y=e.clientY;try{cv.setPointerCapture(e.pointerId)}catch(_){}}});
cv.addEventListener('pointermove',e=>{if(inp.down&&e.pointerId===inp.id){inp.x=e.clientX;inp.y=e.clientY}});
const up=e=>{if(inp.down&&e.pointerId===inp.id){inp.down=false;if(G.phase==='inhale')doBlow()}};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
cv.addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='Enter'){if(G.state!=='play')return;e.preventDefault();if(e.repeat||inp.down||inp.kb)return;inp.kaim=wolf.aim;if(press())inp.kb=true}
  if(e.code==='ArrowUp'){inp.kaim=clamp(inp.kaim-.09,-1.05,.42);if(G.phase!=='inhale')wolf.aim=inp.kaim;e.preventDefault()}
  if(e.code==='ArrowDown'){inp.kaim=clamp(inp.kaim+.09,-1.05,.42);if(G.phase!=='inhale')wolf.aim=inp.kaim;e.preventDefault()}});
addEventListener('keyup',e=>{if((e.code==='Space'||e.code==='Enter')&&inp.kb){inp.kb=false;if(G.phase==='inhale')doBlow()}});
addEventListener('blur',()=>{if(G.phase==='inhale'&&(inp.down||inp.kb)){inp.down=inp.kb=false;doBlow()}});
$('start').onclick=startGame;$('again').onclick=startGame;
$('share').onclick=()=>window.open('https://twitter.com/intent/tweet?text='+encodeURIComponent(lastShare+' #狼の肺活量 #100個のバカゲー'),'_blank','noopener');
$('knock').onclick=()=>{if(G.phase!=='ready'||!isFinal())return;audio();showOv('knock',false);G.hint='';ending(4)};
function resize(){W=innerWidth;H=innerHeight;DPR=Math.min(2,devicePixelRatio||1);portrait=H>W;cv.width=W*DPR;cv.height=H*DPR;layoutTitle()}
addEventListener('resize',resize);resize();
let last=0;function frame(ts){const now=ts/1000;let dt=Math.min(.034,now-last||.016);last=now;if(G.hs>0){G.hs-=dt;dt=0}
  update(dt);draw();requestAnimationFrame(frame)}
G.lastHs=-9;toTitle();ts2();cam.s=.8;requestAnimationFrame(frame);
})();
</script>
