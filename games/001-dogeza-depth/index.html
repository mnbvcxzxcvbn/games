<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>土下座が深すぎる</title>
<style>
:root{--paper:#f2e8d5;--ink:#1d1a17;--shu:#d63a2a;--navy:#26334d;--mincho:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP","Noto Serif CJK JP","IPAMincho",serif;--goth:"Hiragino Sans","Yu Gothic","Noto Sans JP","Noto Sans CJK JP","IPAPGothic",sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--paper);color:var(--ink);font-family:var(--goth);-webkit-user-select:none;user-select:none;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:pointer}
#back{position:fixed;left:8px;top:6px;z-index:30;font-size:12px;font-weight:700;color:var(--ink);text-decoration:none;background:rgba(242,232,213,.85);padding:3px 8px;border:2px solid var(--ink);border-radius:3px}
#back:hover{background:var(--ink);color:var(--paper)}
.ov{position:fixed;inset:0;z-index:20;display:none;flex-direction:column;align-items:center;pointer-events:none}
.ov.on{display:flex}
.ov>*{pointer-events:auto}
/* title */
#title{justify-content:space-between;padding:max(34px,4vh) 12px max(14px,2.5vh)}
.logo{font-family:var(--mincho);font-weight:900;line-height:1;text-align:center;background:var(--paper);border:4px solid var(--ink);box-shadow:6px 6px 0 var(--ink);padding:14px 26px 16px;transform:rotate(-1.5deg);position:relative}
.logo .l1{display:block;font-size:clamp(20px,4.2vmin,34px);letter-spacing:.3em;margin-bottom:6px}
.logo .l2{display:block;font-size:clamp(44px,10vmin,84px);letter-spacing:.04em;color:var(--shu)}
.logo #fuka{display:inline-block;transform-origin:50% 0;animation:fuka 4.6s cubic-bezier(.6,0,.9,.4) infinite}
@keyframes fuka{0%,22%{transform:scaleY(1)}48%,70%{transform:scaleY(2.7)}78%,100%{transform:scaleY(1)}}
.logo .hanko{position:absolute;right:-18px;bottom:-16px;width:54px;height:54px;border:3px solid var(--shu);border-radius:50%;color:var(--shu);font-size:15px;display:flex;align-items:center;justify-content:center;transform:rotate(14deg);background:rgba(242,232,213,.9);line-height:1.05}
.tag{margin-top:14px;font-weight:900;font-size:clamp(13px,2.4vmin,17px);background:var(--ink);color:var(--paper);padding:5px 14px;text-align:center}
.card{background:var(--paper);border:4px solid var(--ink);box-shadow:6px 6px 0 var(--ink);padding:14px 18px;width:min(94vw,520px);text-align:center}
.how{list-style:none;text-align:left;font-size:clamp(12px,2.1vmin,14.5px);line-height:1.75;font-weight:700;margin-bottom:10px}
.how li{padding-left:1.5em;position:relative}
.how li::before{content:"";position:absolute;left:.2em;top:.55em;width:.7em;height:.7em;background:var(--shu);border-radius:50%}
.how b{color:var(--shu)}
button{font-family:var(--goth);font-weight:900;cursor:pointer;border:4px solid var(--ink);background:var(--shu);color:#fff;font-size:clamp(17px,3.2vmin,22px);padding:10px 26px;box-shadow:4px 4px 0 var(--ink);transition:transform .08s,box-shadow .08s;letter-spacing:.08em}
button:hover{transform:translate(-1px,-1px);box-shadow:6px 6px 0 var(--ink)}
button:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
button.sub{background:var(--paper);color:var(--ink);font-size:13px;padding:6px 12px;border-width:3px;box-shadow:3px 3px 0 var(--ink);letter-spacing:0}
.rec{margin-top:10px;font-size:12px;font-weight:700;display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap}
.rec span{white-space:nowrap}
/* result */
#result{justify-content:center;padding:34px 10px 10px;background:rgba(29,26,23,.45)}
.sheet{touch-action:pan-y;background:var(--paper);border:4px solid var(--ink);box-shadow:8px 8px 0 var(--ink);width:min(96vw,560px);max-height:calc(100vh - 44px);overflow-y:auto;padding:16px 20px 16px;position:relative;animation:sheet .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes sheet{from{transform:translateY(40px) rotate(3deg) scale(.9);opacity:0}}
.sh-head{display:flex;justify-content:space-between;align-items:baseline;border-bottom:3px double var(--ink);padding-bottom:5px;font-family:var(--mincho);font-weight:900}
.sh-head .doc{font-size:20px;letter-spacing:.6em}
.sh-head .end{font-size:12px;background:var(--ink);color:var(--paper);padding:2px 8px;font-family:var(--goth)}
.lbl{font-size:11px;font-weight:700;opacity:.65;margin-top:9px}
#rtitle{font-family:var(--mincho);font-weight:900;font-size:clamp(28px,7.4vmin,46px);line-height:1.15;color:var(--ink);padding-right:84px}
#rhanko{position:absolute;right:18px;top:50px;width:78px;height:78px;border:5px solid var(--shu);border-radius:50%;color:var(--shu);font-family:var(--mincho);font-weight:900;font-size:26px;display:flex;align-items:center;justify-content:center;transform:rotate(-12deg);animation:hanko .35s .55s cubic-bezier(.3,1.6,.5,1) both;line-height:1}
@keyframes hanko{from{transform:rotate(-12deg) scale(3);opacity:0}}
.scoreline{display:flex;align-items:baseline;gap:8px;margin-top:4px;flex-wrap:wrap}
#rscore{font-size:clamp(40px,9vmin,58px);font-weight:900;color:var(--shu);line-height:1;font-variant-numeric:tabular-nums}
.scoreline small{font-size:13px;font-weight:700}
#rbest{font-size:12px;font-weight:900;margin-left:auto;border:2px solid var(--ink);padding:2px 7px}
#rbest.new{background:var(--shu);color:#fff;border-color:var(--shu)}
#rcomment{font-weight:900;font-size:clamp(13px,2.6vmin,16px);margin-top:8px;padding:6px 10px;border-left:6px solid var(--shu);background:rgba(29,26,23,.06)}
.stats{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.stats div{flex:1 1 30%;border:2px solid var(--ink);padding:3px 6px;font-size:11px;font-weight:700;text-align:center;white-space:nowrap}
.stats b{display:block;font-size:15px}
#rlist{list-style:none;margin-top:8px;font-size:12px;font-weight:700}
#rlist li{display:flex;gap:6px;align-items:center;border-bottom:1px dashed rgba(29,26,23,.4);padding:2.5px 0}
#rlist .g{flex:0 0 22px;height:22px;border:2px solid var(--shu);color:var(--shu);border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--mincho);font-weight:900;font-size:12px}
#rlist .g.ng{border-color:var(--ink);color:var(--paper);background:var(--ink)}
#rlist .q{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#rlist .d{flex:0 0 auto;font-variant-numeric:tabular-nums;opacity:.8}
#repi{margin-top:8px;font-family:var(--mincho);font-size:13px;font-weight:700;text-align:right}
.btns{display:flex;gap:10px;justify-content:center;margin-top:12px;flex-wrap:wrap;align-items:center}
.btns button{font-size:clamp(15px,3vmin,18px);padding:8px 18px}
#share{background:var(--ink)}
/* zukan */
#zukan{justify-content:center;background:rgba(29,26,23,.6);z-index:40;padding:10px}
#zukan .sheet{max-height:calc(100vh - 20px)}
#zukan h3{font-family:var(--mincho);font-size:15px;margin:10px 0 4px;border-bottom:2px solid var(--ink)}
#zukan ol{list-style:none;font-size:12px;font-weight:700;line-height:1.7}
#zukan ol li.no{opacity:.35}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chips span{border:2px solid var(--ink);font-size:12px;font-weight:700;padding:1px 7px}
.chips span.no{opacity:.3;border-style:dashed}
#zclose{position:sticky;bottom:0;display:block;margin:12px auto 0}
</style>
</head>
<body>
<canvas id="c"></canvas>
<a id="back" href="../../index.html">← 一覧</a>

<div id="title" class="ov on">
  <div style="display:flex;flex-direction:column;align-items:center">
    <h1 class="logo"><span class="l1">土下座が</span><span class="l2"><span id="fuka">深</span>すぎる</span><span class="hanko">誠<br>意</span></h1>
    <p class="tag">謝罪は、深さが命。ピタリと止めろ。止めないと地球を貫く。</p>
  </div>
  <div class="card">
    <ul class="how">
      <li><b>長押し</b>（マウス／タップ／スペース）で頭が下がる</li>
      <li><b>離す</b>と止まる。一発勝負。<b>朱色の線</b>が適正な深さ</li>
      <li>浅いと「誠意がない」。深いと<b>床を突き破る</b></li>
    </ul>
    <button id="start">謝罪をはじめる</button>
    <div class="rec"><span id="trec"></span><button id="zbtn" class="sub">やらかし図鑑</button></div>
  </div>
</div>

<div id="result" class="ov">
  <div class="sheet">
    <div class="sh-head"><span class="doc">始末書</span><span class="end" id="rend"></span></div>
    <div id="rhanko"></div>
    <div class="lbl">あなたの称号</div>
    <div id="rtitle"></div>
    <div class="scoreline"><small>誠意</small><span id="rscore">0</span><small id="rmax"></small><span id="rbest"></span></div>
    <div id="rcomment"></div>
    <div class="stats" id="rstats"></div>
    <ol id="rlist"></ol>
    <div id="repi"></div>
    <div class="btns"><button id="again">もう一度謝る</button><button id="share">Xでシェア</button><button id="zbtn2" class="sub">図鑑</button></div>
  </div>
</div>

<div id="zukan" class="ov">
  <div class="sheet">
    <div class="sh-head"><span class="doc">図鑑</span><span class="end" id="zcount"></span></div>
    <h3>謝罪先（止まった場所）</h3><div class="chips" id="zzones"></div>
    <h3>結末</h3><div class="chips" id="zends"></div>
    <h3>やらかし一覧</h3><ol id="zlist"></ol>
    <button id="zclose" class="sub">とじる</button>
  </div>
</div>

<script>
(()=>{'use strict';
const $=id=>document.getElementById(id);
const cv=$('c'),ctx=cv.getContext('2d');
const PAPER='#f2e8d5',INK='#1d1a17',SHU='#d63a2a',NAVY='#26334d',SKIN='#f3cfa3';
const SANS='"Hiragino Sans","Yu Gothic","Noto Sans JP","Noto Sans CJK JP","IPAPGothic",sans-serif';
const MIN='"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP","Noto Serif CJK JP","IPAMincho","IPAPGothic",serif';
const RAD=Math.PI/180,TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t;
const smooth=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t)};
const rnd=(a=1,b)=>b===undefined?Math.random()*a:a+Math.random()*(b-a);
const pick=a=>a[Math.random()*a.length|0];
const hash=(i,j)=>{let h=(i*374761393+j*668265263)|0;h=(h^(h>>>13))*1274126177|0;return((h^(h>>>16))>>>0)/4294967296};
const easeOutBack=t=>{const c=1.70158;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2)};
const easeIO=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;

/* ===== 深さの定義 ===== */
const CA=.25,CB=.12,UMAX=11.3;
const uOf=t=>CA*t+CB*t*t, tOf=u=>(-CA+Math.sqrt(CA*CA+4*CB*u))/(2*CB);
const ANCH=[[1,0],[1.25,1],[2,20],[3,80],[4,3e4],[5.5,2.9e6],[6.5,6.371e6],[7.5,9.842e6],[8.6,1.2712e7],[9,1.2742e7],[9.6,1.2842e7],[10.3,3.97e8],[11.3,4.0e8]];
function depthM(u){if(u<=1)return 0;for(let i=1;i<ANCH.length;i++){const[a,ma]=ANCH[i-1],[b,mb]=ANCH[i];if(u<=b){const t=(u-a)/(b-a);return(ma>0&&mb/ma>50)?ma*Math.pow(mb/ma,t):lerp(ma,mb,t)}}return 4e8}
const fmtM=m=>m<10?m.toFixed(1)+' m':m<1000?Math.round(m)+' m':Math.round(m/1000).toLocaleString('ja-JP')+' km';
const depthLabel=u=>u<=1?Math.round(u*90)+'°':'深さ '+fmtM(depthM(u));
const ZN=['応接室','床下','地層','地下鉄','地底','マントル','地球の核','地球の裏側','ブラジル上空','宇宙','月'];
function zoneOf(u,cr=1.06){return u<=cr?0:u<1.25?1:u<2?2:u<3?3:u<4?4:u<5.5?5:u<7.5?6:u<8.6?5:u<9.25?7:u<9.6?8:u<10.3?9:10}
const poseName=u=>u<.3?'会釈':u<.5?'敬礼':u<.7?'最敬礼':u<.97?'平身低頭':'土下座';
const tgtLabel=q=>q.u<=1?(q.u===1?'土下座（額を床ぴったり）':poseName(q.u)+' '+Math.round(q.u*90)+'°'):(q.n||ZN[zoneOf(q.u)])+'（'+depthLabel(q.u)+'）';
/* 背景ゾーン */
const ZONES=[
 {a:1,b:1.25,t:'#5d4633',d:'#4a3829',k:'e'},{a:1.25,b:1.42,t:'#8a6a48',d:'#7c5d3e',k:'e'},{a:1.42,b:1.6,t:'#a07850',d:'#93693f',k:'e'},
 {a:1.6,b:1.8,t:'#6f5a48',d:'#62503f',k:'e'},{a:1.8,b:2,t:'#8d7358',d:'#7a6048',k:'e'},{a:2,b:3,t:'#55483e',d:'#463a38',k:'e'},
 {a:3,b:4,t:'#3c3340',d:'#5a2a2a',k:'e'},{a:4,b:5.5,t:'#b93a1c',d:'#f08a1c',k:'m'},{a:5.5,b:6.5,t:'#f5a51c',d:'#fff3b8',k:'c'},
 {a:6.5,b:7.5,t:'#fff3b8',d:'#f5a51c',k:'c'},{a:7.5,b:8.6,t:'#f08a1c',d:'#b93a1c',k:'m'},{a:8.6,b:9,t:'#6f4a34',d:'#8a5a38',k:'e'},
 {a:9,b:9.6,t:'#9fdcf5',d:'#3f7fd0',k:'s'},{a:9.6,b:10.3,t:'#1c2c5c',d:'#05060f',k:'x'},{a:10.3,b:12.4,t:'#d6d3c4',d:'#a9a595',k:'l'}];

/* ===== やらかし（お題）42種 ===== */
const QS=[
/*T1 会釈*/
{r:1,u:.2,t:'メールの宛名の「様」を付け忘れた',c:'君ねえ、呼び捨てだよ呼び捨て。私は君の同級生か？'},
{r:1,u:.22,t:'会議に2分遅刻した',c:'2分あればカップ麺が…いや、できないな。でも遅刻は遅刻だ。'},
{r:1,u:.17,t:'エレベーターで「開」と「閉」を押し間違えた',c:'挟まれたんだよ、私は。肩を。ドアに。'},
{r:1,u:.26,t:'「サイトウ」と「サイドウ」を呼び間違えた',c:'濁るんだよ、うちは。先祖代々、濁ってきたんだ。'},
{r:1,u:.18,t:'打ち合わせ中にお腹が盛大に鳴った',c:'今の音、議事録に残すからね。'},
/*T2 敬礼*/
{r:2,u:.5,t:'見積書の桁を1つ間違えた',c:'ボールペン1本、38万円。純金製かね？'},
{r:2,u:.4,t:'添付ファイルのないメールを3回連続で送った',c:'「再送します」が3通。中身は全部、君の気持ちだけだ。'},

/*T3 最敬礼〜平身低頭*/
{r:3,u:.8,t:'ネジ100個のつもりで100万個発注した',c:'倉庫がネジだ。廊下もネジだ。私の机の引き出しもネジだ。'},
{r:3,u:.66,t:'プレゼン資料に猫の写真が40枚混入していた',c:'売上グラフの次が茶トラ。その次も茶トラ。かわいかったが。'},
{r:3,u:.86,t:'納品先を間違えて南極に送った',c:'ペンギンがコピー機を囲んで暖を取っているそうだ。'},

{r:3,u:.7,t:'接待ゴルフで取引先に本気で勝った',c:'ホールインワンのあとのガッツポーズ、あれは要ったかね？'},
/*T4 土下座ぴったり*/
{r:4,u:1,t:'社長の盆栽（樹齢300年）を枝豆と間違えて食べた',c:'江戸時代から生きてたんだ。君の小腹を満たすためじゃない。'},

{r:4,u:1,t:'契約書をヤギに食べさせた',c:'印紙まで綺麗に食べたそうじゃないか。'},
{r:4,u:1,t:'創業者の銅像にあだ名を彫った',c:'「もじゃ」とは何だ。創業者は確かにもじゃもじゃだったが。'},
{r:4,u:1,t:'金庫の暗証番号を社内報のクイズにした',c:'正解者が38名も出た。全員に賞品を出したそうだね。'},
/*T5 めり込み土下座*/
{r:5,u:1.5,n:'地層',t:'本社ビルを一棟、間違えてフリマに出品して売った',c:'「美品・駅近・送料込み」じゃないんだよ。'},
{r:5,u:1.33,n:'地層',t:'取引先のロゴを勝手に「かわいく」した',c:'なぜ我が社の鷲にリボンとまつ毛が付いているのかね。'},
{r:5,u:1.7,n:'地層',t:'サーバールームに味噌汁を全社員分こぼした',c:'データは消えた。代わりに出汁の香りがする。'},
{r:5,u:1.9,n:'地層',t:'株主総会で居眠りし、寝言で社外秘を全部言った',c:'君の寝言で株価が動いた。'},
{r:5,u:1.42,n:'地層',t:'社長の娘の結婚式で新郎の名前を3回間違えた',c:'3回とも違う名前だった。逆にすごいよ。'},

{r:6,u:2.5,n:'地下鉄ホーム',t:'誤発注で湾がまるごとプリンで埋まった',c:'漁船がカラメルに沈んでいる。カモメは喜んでいる。'},

{r:6,u:3.3,n:'地底',t:'日本一の山をうっかり1センチ削った',c:'教科書を全部刷り直しだ。語呂合わせも作り直しだ。'},

{r:6,u:3.55,n:'地底人の村',t:'日本中の「の」を「ぬ」に一括置換した',c:'「私ぬ会社ぬ売上」。もう誰も真面目に働けない。'},
/*T7 マントル〜核*/
{r:7,u:4.7,n:'マントル',t:'うっかり海の栓を抜いた',c:'水位が下がっている。タコが困惑している。'},
{r:7,u:6.5,n:'地球の中心',t:'地球の自転を誤って3分止めた',c:'全人類が東に3メートルずつ転んだ。'},
{r:7,u:4.5,n:'マントル',t:'月曜日を誤って2回発注した',c:'今日も月曜だ。昨日も月曜だった。君のせいだ。'},
{r:7,u:6.5,n:'地球の中心',t:'重力の請求書を払い忘れ、全人類が3センチ浮いた',c:'督促状が来ている。宇宙から。'},
{r:7,u:5.75,n:'外核',t:'北極と南極を取り違えて納品した',c:'シロクマとペンギンが名刺交換をしている。'},

const EVS=[[2,'地下鉄'],[3,'地底'],[4,'マントル'],[5.5,'地球の核'],[6.5,'地球の中心'],[7.5,'帰りのマントル'],[9,'ブラジル'],[9.6,'宇宙'],[10.3,'月']];
function crossings(a,b,silent){
 if(!G.broke&&b>R.crashU){G.broke=true;G.rot=-1.25;G.rotV=0;G.hs=.09;G.shake=22;G.expr='shock';G.patch=false;if(!silent)SFX.crash();
  burst(HX,0,34,['#c9b877','#a89a5c','#8a5a34','#e6dcae'],420);G.callout={t:0,s:'バキィッ！！',big:1}}
 for(let i=0;i<EVS.length;i++){const[e,n]=EVS[i];if(a<e&&b>=e){G.callout={t:0,s:n};G.hs=.05;G.shake=14;if(!silent){SFX.zone(i);if(i===0)SFX.horn()}burst(HX,Y(e),18,zoneCols(e+.01),340)}}
}
function update(dt){
 G.t+=dt;G.shake*=Math.pow(.0015,dt);if(G.callout){G.callout.t+=dt;if(G.callout.t>1.1)G.callout=null}G.flash=Math.max(0,G.flash-dt*2);G.fly=Math.max(0,(G.fly||0)-dt);if(G.ring)G.ring=G.ring>.4?0:G.ring+dt;
 if(G.hs>0){G.hs-=dt;return}
 G.st+=dt;
 // 物理（刺さった体の揺れ）
 G.rotV+=(-G.rot*140-G.rotV*9)*dt;G.rot+=G.rotV*dt;
 const flipT=(G.state==='still'||G.state==='judge')&&R.u>=8.85&&R.u<9.6?Math.PI:0;G.flip+=(flipT-G.flip)*Math.min(1,dt*(flipT?5:14));
 switch(G.state){
 case'title':{ // デモ：勝手に土下座して床を抜く
  G.demoT+=dt;const c=G.demoT%7.2;R.crashU=1.06;R.tgt=.5;
  if(c<1.2){G.u=0;G.broke=false;G.expr='angry'}
  else if(c<1.2+tOf(2.5)){const pu=G.u;G.u=uOf(c-1.2);crossings(pu,G.u,true)}
  else if(c<5.9){G.u=2.5}
  else{const k=easeIO((c-5.9)/1.3);G.u=2.5*(1-k);if(G.u<1.06)G.broke=false}
  break}
 case'intro':if(G.st>3.2)setState('talk');break;
 case'talk':{const n=Math.floor(G.st*26);if(n!==R._n&&n<=R.q.c.length&&n%2===0)SFX.blip();R._n=n;if(n>=R.q.c.length+6)setState('wait');break}
 case'wait':if(G.st>R.delay){setState('ready');SFX.signal();G.shake=6}break;
 case'ready':if(G.st>6){R.afk=true;R.holdT=0;R.u=0;setState('still');G.st=.9}break;
 case'bow':{
  R.holdT+=dt;const pu=G.u,nu=uOf(R.holdT);crossings(pu,nu);G.u=R.u=nu;const v=CA+2*CB*R.holdT;
  if(nu>=UMAX){stopBow(true);break}
  if(G.broke){const n=1+(v*1.6|0);for(let i=0;i<n;i++){const sd=Math.random()<.5?-1:1;P.push({x:HX+sd*rnd(14,30)*s,y:Y(nu)-rnd(0,20)*s,vx:sd*rnd(40,220)*s,vy:-rnd(80,380)*s,g:500*s,life:rnd(.3,.7),t:0,sz:rnd(2,7)*s,c:pick(zoneCols(nu)),rot:rnd(TAU),vr:rnd(-9,9)})}G.shake=Math.max(G.shake,1.5+v*2.2)}
  const rem=R.tgtT-R.holdT;if(rem>0&&rem<1.15){R.tick-=dt;if(R.tick<=0){SFX.tick(620+(1.15-rem)*800);R.tick=Math.max(.05,rem*.2)}}
  if(drill){const now=AC.currentTime,on=G.broke?1:.25;drill.f.frequency.setTargetAtTime(250+v*900,now,.05);drill.g.gain.setTargetAtTime(.12*on+v*.05*on,now,.05);drill.o.frequency.setTargetAtTime(34+v*40,now,.05);drill.og.gain.setTargetAtTime(G.broke?.05:0,now,.05)}
  break}
 case'still':if(G.st>1.25)judge(R.afk);break;
 case'judge':{const tg=R.res.total;if(G.shownScore<tg&&G.st>.35){G.shownScore=Math.min(tg,G.shownScore+dt*120);if((G.shownScore|0)%4===0)SFX.count()}break}
 case'rewind':{const k=easeIO(clamp(G.st/R.rewD,0,1));G.u=R.u*(1-k);if(G.u<=R.crashU&&G.broke&&k<1){/* 引っこ抜かれた */}if(G.st>=R.rewD+.15){G.u=0;afterRewind()}break}
 }
 if(G.state!=='judge')G.shownScore=0;
 for(let i=P.length-1;i>=0;i--){const p=P[i];p.t+=dt;if(p.t>p.life){P.splice(i,1);continue}p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt}
 if(P.length>400)P.splice(0,P.length-400);
}

function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath()}

 const k=easeOutBack(clamp((t-.25)/.35,0,1)),px=(W-pw)/2,py=H-(ph+8)*k;
 // ハンコ
 const side=px>300,sk=t<.22?lerp(3.2,1,t/.22):1,fs=side?Math.min(50,(px-70)/5.2):portrait?40:44;
 const low=!side&&!portrait,fz=low?Math.min(fs,W*.045):fs;
 ctx.save();ctx.translate(side?px/2:low?W*.2:W/2,side?H-ph*.55:low?Math.max(120,H-ph-150):H-ph-8-fs*1.05);ctx.rotate(-.09);ctx.scale(fz/fs,fz/fs);ctx.scale(sk,sk);ctx.globalAlpha=clamp(t/.12,0,1);
 ctx.font=`900 ${fs}px ${MIN}`;const tw=ctx.measureText(STAMP[r.g]).width+fs*.9,col=r.fail?INK:SHU;
 box(-tw/2,-fs*.82,tw,fs*1.64,8,'rgba(242,232,213,.95)',portrait?6:8,col);ctx.lineWidth=2;ctx.strokeStyle=col;rr(-tw/2+9,-fs*.82+9,tw-18,fs*1.64-18,4);ctx.stroke();
 txt(STAMP[r.g],0,3,fs,col,'center',MIN);ctx.restore();ctx.globalAlpha=1;
 if(G.flash>0){ctx.fillStyle=`rgba(255,255,255,${G.flash*.5})`;ctx.fillRect(0,0,W,H)}
 if(t<.25)return;
 ctx.fillStyle=INK;ctx.fillRect(px+5,py+5,pw,ph);box(px,py,pw,ph,2,PAPER,4);
 // 合計
 txt('今回の誠意',px+16,py+24,12,INK,'left',SANS,700);
 txt(String(G.shownScore|0),px+pw*.5,py+36,portrait?44:50,r.fail?INK:SHU,'right');txt('点',px+pw*.5+4,py+44,15,INK,'left');
 const totX=px+pw-16;txt('通算 '+G.total,totX,py+22,13,INK,'right');
 if(r.fail)txt('堪忍袋の緒 '+'×'.repeat(G.strikes)+'・'.repeat(3-G.strikes),totX,py+42,12,SHU,'right');
 else txt(r.g==='god'?'お見事！':'セーフ',totX,py+42,12,SHU,'right');
 // 内訳
 const cols=[['深さ',r.dp,60,r.devi],['初動',r.rp,20,r.rlab],['静止',r.sp,20,r.slab]],cw=inner/3;
 cols.forEach(([n,v,m,sub],i)=>{const x=px+14+cw*i,y=py+68;box(x+2,y,cw-4,54,2,i===0&&r.fail?'rgba(29,26,23,.1)':'rgba(214,58,42,.07)',2);
  txt(n,x+10,y+14,11,INK,'left',SANS,700);txt(v+'',x+cw-34,y+16,19,INK,'right');txt('/'+m,x+cw-32,y+18,10,INK,'left',SANS,700);
  ctx.font=`700 10px ${SANS}`;let sb=sub;while(ctx.measureText(sb).width>cw-14&&sb.length>4)sb=sb.slice(0,-1);txt(sb,x+cw/2,y+40,portrait?9.5:11,SHU,'center',SANS,700)});
 // セリフ
 let y=py+132;const tag=(name,c)=>{ctx.font=`900 11px ${SANS}`;const w=ctx.measureText(name).width+14;ctx.fillStyle=c;ctx.fillRect(px+14,y,w,18);txt(name,px+14+w/2,y+9.5,11,PAPER)};
 tag('取引先・'+RANKS[G.round],INK);y+=22;l1.forEach((l,i)=>txt(l,px+16,y+fsL*.6+i*fsL*1.4,fsL,INK,'left',SANS,700));y+=l1.length*fsL*1.4+6;
 if(r.res&&t>.7){tag(r.res[0],SHU);y+=22;l2.forEach((l,i)=>txt(l,px+16,y+fsL*.6+i*fsL*1.4,fsL,INK,'left',SANS,700))}
 if(t>.9&&Math.sin(G.t*7)>-.2)txt('▼ クリックで次へ',px+pw-14,py+ph-11,11,INK,'right',SANS,700);
}

/* ===== ループ ===== */
let last=0;
function frame(ts){
 const dt=Math.min(.05,(ts-last)/1000||0);last=ts;
 update(dt);bgm();
 ctx.setTransform(DPR,0,0,DPR,0,0);ctx.fillStyle=PAPER;ctx.fillRect(0,0,W,H);
 const w=drawWorld();
 const camFloor=(()=>{const dive=G.broke&&G.u>1;return dive?w.hsY-Y(G.u):floorY})();
 drawHUD({hsY:w.hsY,floorS:camFloor});
 if(G.state==='title'&&G.callout){const c=G.callout;if(c.big){ctx.save();ctx.globalAlpha=clamp(1-(c.t-.6)/.4,0,1);ctx.translate(HX+90*s,floorY-60*s);ctx.rotate(-.1);otxt(c.s,0,0,portrait?30:44,SHU,PAPER,9,'center',MIN);ctx.restore();ctx.globalAlpha=1}}

}
