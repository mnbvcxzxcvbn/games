<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>走馬灯エディター</title>
<style>
:root{--bg:#121217;--panel:#1c1d24;--panel2:#272933;--line:#363947;--ink:#ece6d6;--dim:#8f8c84;--amber:#ffb648;--red:#ff5d4d;--teal:#62d6bd;
 --sans:"Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP","Meiryo",sans-serif;--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;--serif:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none}
#back{position:fixed;left:10px;top:9px;z-index:60;font-size:12px;color:#a9a59b;text-decoration:none;padding:2px 4px}
#back:hover{color:var(--amber)}
.scr{position:absolute;inset:0;display:none}.scr.on{display:flex}
.btn{background:var(--amber);color:#1b1408;font-weight:700;border-radius:4px;padding:12px 26px;font-size:16px;letter-spacing:.08em;box-shadow:0 3px 0 #a86a12;transition:transform .08s,filter .15s}
.btn:hover{filter:brightness(1.1)}.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #a86a12}
.btn.sub{background:var(--panel2);color:var(--ink);box-shadow:0 3px 0 #0c0c10;border:1px solid var(--line)}
.mono{font-family:var(--mono)}
/* ---------- title ---------- */
#title{flex-direction:column;align-items:center;justify-content:center;gap:clamp(10px,2.4vh,22px);background:radial-gradient(ellipse at 50% 40%,#22222b 0%,#0c0c10 75%);text-align:center;padding:16px}
#strip{width:100vw;height:clamp(92px,19vh,150px);display:block;flex:none}
#title h1{font-family:var(--serif);font-size:clamp(34px,7.4vw,84px);letter-spacing:.14em;font-weight:700;color:#f6ecd6;text-shadow:0 0 24px rgba(255,182,72,.35),3px 3px 0 #5a3a10;line-height:1.1;animation:flick 5s infinite}
@keyframes flick{0%,100%{opacity:1}47%{opacity:1}48%{opacity:.82}49%{opacity:1}73%{opacity:.9}74%{opacity:1}}
#title .lead{font-size:clamp(14px,2.2vw,20px);color:var(--amber);letter-spacing:.12em}
#title .how{font-size:clamp(11px,1.5vw,14px);color:#bdb8ab;line-height:1.9;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:6px;padding:10px 18px;max-width:640px}
#title .how b{color:var(--ink)}
#tStat{font-size:12px;color:var(--dim);font-family:var(--mono);min-height:16px}
/* ---------- select ---------- */
#select{flex-direction:column;align-items:center;padding:44px 16px 16px;gap:14px;overflow:auto;background:radial-gradient(ellipse at 50% 0%,#23232c 0%,#0e0e12 80%)}
#select h2{font-family:var(--serif);font-size:clamp(20px,3.4vw,30px);letter-spacing:.2em}
#boss{display:flex;gap:10px;align-items:flex-start;max-width:760px;font-size:clamp(12px,1.6vw,15px);line-height:1.7;color:#d8d2c2}
#boss i{flex:none;font-style:normal;background:#000;color:var(--amber);border:1px solid var(--amber);font-size:11px;padding:2px 7px;border-radius:3px;margin-top:3px}
#cards{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;width:100%;max-width:1100px}
.dos{width:320px;max-width:100%;background:#e9e1cb;color:#2a241b;border-radius:3px;padding:12px 14px 14px;text-align:left;position:relative;box-shadow:0 10px 30px rgba(0,0,0,.5);transition:transform .18s cubic-bezier(.2,1.4,.4,1);cursor:pointer;display:block}
.dos:nth-child(1){transform:rotate(-1.2deg)}.dos:nth-child(3){transform:rotate(1.1deg)}
.dos:hover{transform:translateY(-8px) rotate(0)}
.dos canvas{width:100%;aspect-ratio:16/9;display:block;image-rendering:pixelated;border:2px solid #2a241b;background:#000}
.dos .no{font-family:var(--mono);font-size:10px;color:#7a6e58;display:flex;justify-content:space-between;margin-bottom:6px}
.dos h3{font-family:var(--serif);font-size:22px;margin:8px 0 0;letter-spacing:.1em}
.dos .sb{font-size:12px;color:#6a5e48;margin-bottom:6px}
.dos .rq{font-size:13px;line-height:1.6;border-left:3px solid #b8452f;padding-left:8px;margin:6px 0 8px;min-height:62px}
.dos .rq small{display:block;color:#8a7c62;font-size:10px}
.dos .pg{font-family:var(--mono);font-size:11px;color:#5a5040;line-height:1.7}
.dos .pg b{color:#b8452f;letter-spacing:2px}
.dos .stamp{position:absolute;right:10px;top:150px;border:3px solid #b8452f;color:#b8452f;font-family:var(--serif);font-weight:700;font-size:15px;padding:2px 8px;transform:rotate(-12deg);opacity:.85;border-radius:4px;background:rgba(233,225,203,.7)}
/* ---------- editor ---------- */
#edit{flex-direction:column;background:var(--bg)}
.top{height:38px;flex:none;display:flex;align-items:center;gap:12px;padding:0 12px 0 74px;background:#0d0d11;border-bottom:1px solid var(--line);font-size:12px}
.top .fname{font-family:var(--mono);color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
#ecg{width:150px;height:26px;flex:none}
#dl{font-family:var(--mono);font-size:15px;color:var(--teal);white-space:nowrap;flex:none}
#dl.hot{color:var(--red);animation:blink .5s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}
.main{flex:1;min-height:0;display:flex;gap:6px;padding:6px 6px 0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:5px;display:flex;flex-direction:column;min-height:0;min-width:0}
.ph{flex:none;font-size:11px;letter-spacing:.14em;color:var(--dim);padding:6px 10px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.02)}
.ph small{letter-spacing:0;color:#6d6b66}
.binp{flex:1.55}
#bin{flex:1;overflow:auto;padding:8px;display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:8px;align-content:start}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:4px;overflow:hidden;cursor:grab;position:relative;transition:transform .12s,border-color .12s,opacity .2s;touch-action:pan-y}
.card:hover{transform:translateY(-2px);border-color:#6a6d80}
.card.sel{border-color:var(--amber);box-shadow:0 0 0 1px var(--amber)}
.card .th{aspect-ratio:16/9;background-size:cover;image-rendering:pixelated}
.card .nm{font-size:11px;padding:4px 5px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .du{position:absolute;right:3px;top:3px;background:rgba(0,0,0,.72);font-family:var(--mono);font-size:10px;padding:1px 4px;border-radius:2px;color:var(--amber)}
.card.used{opacity:.33}
.card.used::after{content:"使用中";position:absolute;left:0;right:0;top:26%;text-align:center;font-size:11px;font-weight:700;color:#fff;letter-spacing:.2em}
.side{flex:1;max-width:400px}
.side .in{padding:8px;display:flex;flex-direction:column;gap:7px;min-height:0;overflow:auto;flex:1}
#mon{width:100%;aspect-ratio:16/9;display:block;background:#000;border-radius:3px;flex:none}
#info{min-height:74px}
#info .hd{display:flex;align-items:baseline;gap:8px}
#iTitle{font-size:15px;font-weight:700}#iDur{font-family:var(--mono);font-size:12px;color:var(--amber)}
#iCap{font-size:13px;line-height:1.65;color:#d3cdbd;margin-top:3px}
#acts{display:flex;gap:6px;flex:none}
#acts button{background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:7px 10px;font-size:12px}
#acts button:hover:not(:disabled){border-color:var(--amber);color:var(--amber)}
#acts button:disabled{opacity:.3;cursor:default}
#bAdd{flex:1;font-weight:700}
#memo{font-size:12px;line-height:1.6;color:#bdb7a8;border-top:1px dashed var(--line);padding-top:7px}
#memo b{color:var(--ink)}#memo em{font-style:normal;color:var(--amber)}
.tl{flex:none;margin:6px}
.tl .ph{flex-wrap:nowrap}
#tc{font-family:var(--mono);font-size:13px;color:var(--ink);letter-spacing:0;white-space:nowrap}
#tc.over{color:var(--red)}
#hint{flex:1;letter-spacing:0;font-size:12px;color:#b5b0a2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
#hint.warn{color:var(--red)}#hint.good{color:var(--teal)}
#bPlay{flex:none;padding:7px 16px;font-size:13px;box-shadow:0 2px 0 #a86a12}
#bPlay:disabled{background:#4a4a52;color:#888;box-shadow:none;cursor:default}
#bPlay.ready{animation:pulse 1.1s infinite}
@keyframes pulse{50%{box-shadow:0 2px 0 #a86a12,0 0 0 6px rgba(255,182,72,.22)}}
#track{position:relative;height:112px;margin:6px 10px 10px}
#ruler{position:absolute;left:0;right:0;top:0;height:16px;font-family:var(--mono);font-size:9px;color:var(--dim)}
#ruler span{position:absolute;top:0;transform:translateX(-50%)}
#lane{position:absolute;left:0;right:0;top:18px;bottom:0;background-color:#0f0f14;border:1px solid var(--line);border-radius:3px;
 background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.07) 0 1px,transparent 1px calc(var(--pps,30)*1px)),repeating-linear-gradient(90deg,rgba(255,255,255,.1) 0 1px,transparent 1px calc(var(--pps,30)*5px))}
#lane.shake{animation:shake .3s}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
#dead{position:absolute;top:0;bottom:0;right:0;background:repeating-linear-gradient(135deg,rgba(255,93,77,.2) 0 6px,rgba(255,93,77,.06) 6px 12px);border-left:2px solid var(--red);pointer-events:none}
#dead::before{content:"ここで臨終";position:absolute;left:4px;top:3px;font-size:10px;color:var(--red);white-space:nowrap;writing-mode:vertical-rl;letter-spacing:.2em}
#empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:13px;color:#6f6c66;pointer-events:none;padding-right:16%}
.tclip{position:absolute;top:5px;bottom:5px;border-radius:3px;overflow:hidden;background-size:cover;background-position:center;image-rendering:pixelated;border:1px solid #000;cursor:grab;touch-action:none;transition:left .16s cubic-bezier(.2,1,.3,1);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14);animation:pop .22s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.tclip::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.0) 35%,rgba(0,0,0,.8))}
.tclip span{position:absolute;left:3px;right:2px;bottom:2px;font-size:10px;z-index:1;white-space:nowrap;overflow:hidden;text-shadow:0 1px 2px #000}
.tclip em{position:absolute;left:3px;top:2px;font-family:var(--mono);font-style:normal;font-size:9px;color:var(--amber);z-index:1;text-shadow:0 1px 2px #000}
.tclip.sel{box-shadow:0 0 0 2px var(--amber);z-index:2}
.tclip.over{filter:saturate(.3) brightness(.7);border-color:var(--red)}
#slot{position:absolute;top:5px;bottom:5px;border:2px dashed var(--amber);border-radius:3px;background:rgba(255,182,72,.12);pointer-events:none;display:none}
#slot.bad{border-color:var(--red);background:rgba(255,93,77,.14)}
.mk{position:absolute;top:50%;width:16px;height:16px;margin:-8px 0 0 -8px;background:var(--teal);transform:rotate(45deg);z-index:3;box-shadow:0 0 10px var(--teal);animation:mk .5s cubic-bezier(.2,1.8,.4,1);pointer-events:none}
@keyframes mk{from{transform:rotate(45deg) scale(0)}}
.ghost{position:fixed;z-index:80;pointer-events:none;width:110px;aspect-ratio:16/9;background-size:cover;image-rendering:pixelated;border:2px solid var(--amber);border-radius:3px;transform:translate(-50%,-60%) rotate(-3deg);box-shadow:0 10px 24px rgba(0,0,0,.6);opacity:.92}
/* ---------- theater ---------- */
#theater{flex-direction:column;align-items:center;justify-content:center;background:#000;gap:10px;padding:8px}
#thWrap{position:relative;flex:none}
#thWrap.jolt{animation:jolt .28s}
@keyframes jolt{20%{transform:translate(-5px,3px)}45%{transform:translate(4px,-3px)}70%{transform:translate(-2px,1px)}}
#scrn{display:block;width:100%;height:100%;border-radius:10px}
#slate{position:absolute;left:14px;top:10px;font-family:var(--mono);font-size:clamp(10px,1.5vw,14px);color:#fff3d6;text-shadow:0 1px 3px #000,0 0 8px #000;letter-spacing:.06em;opacity:.9}
#banner{position:absolute;left:50%;top:14%;transform:translate(-50%,0) scale(.6);opacity:0;background:rgba(8,20,18,.86);border:2px solid var(--teal);color:#eafff9;padding:8px 18px;border-radius:4px;font-size:clamp(13px,2.2vw,22px);font-weight:700;white-space:nowrap;letter-spacing:.06em;box-shadow:0 0 30px rgba(98,214,189,.5);pointer-events:none;text-align:center}
#banner small{display:block;font-size:.55em;color:var(--teal);letter-spacing:.3em;font-weight:400}
#banner.on{animation:ban 2.6s forwards}
@keyframes ban{0%{opacity:0;transform:translate(-50%,0) scale(.6)}8%{opacity:1;transform:translate(-50%,0) scale(1.1)}14%{transform:translate(-50%,0) scale(1)}85%{opacity:1}100%{opacity:0;transform:translate(-50%,-10px) scale(1)}}
#endCard{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;padding:10px}
#endCard.on{display:flex;animation:ec 1.2s cubic-bezier(.2,1,.3,1)}
@keyframes ec{from{opacity:0;transform:scale(1.15);filter:blur(6px)}}
#endCard .en{font-family:var(--mono);font-size:clamp(10px,1.5vw,14px);letter-spacing:.5em;color:var(--amber)}
#endCard .et{font-family:var(--serif);font-size:clamp(24px,5.4vw,58px);font-weight:700;letter-spacing:.12em;color:#fff6e0;text-shadow:0 2px 14px #000,0 0 40px rgba(0,0,0,.9)}
#endCard .nw{font-size:12px;color:#1b1408;background:var(--amber);padding:1px 8px;border-radius:2px;font-weight:700;letter-spacing:.2em}
#prog{position:relative;height:7px;background:#1b1b22;border-radius:4px;overflow:hidden;display:flex;flex:none}
#prog i{display:block;height:100%;border-right:2px solid #000;background:#33343f}
#progIn{position:absolute;left:0;top:0;bottom:0;background:var(--amber);mix-blend-mode:screen;opacity:.85}
#sub{min-height:96px;width:min(92vw,900px);text-align:center;font-size:clamp(15px,2.4vw,23px);line-height:1.6;flex:none;display:flex;flex-direction:column;align-items:center;gap:4px}
#subWho{font-size:11px;color:var(--amber);border:1px solid var(--amber);padding:0 8px;border-radius:2px;letter-spacing:.2em;visibility:hidden}
#subWho.on{visibility:visible}
#sub.last #subTx{font-family:var(--serif);font-size:clamp(18px,3.1vw,30px);color:#fff6e0;letter-spacing:.06em}
#thBtns{height:44px;flex:none;display:flex;gap:10px;align-items:center}
#bFF{font-family:var(--mono);font-size:12px;color:var(--dim);border:1px solid var(--line);padding:6px 12px;border-radius:3px}
#bFF.on{color:#1b1408;background:var(--amber);border-color:var(--amber)}
#bRes{display:none}
/* ---------- result ---------- */
#result{overflow:auto;background:radial-gradient(ellipse at 50% 20%,#262630 0%,#0c0c10 80%);padding:40px 12px 20px;justify-content:center;align-items:flex-start}
#rc{width:min(760px,100%);background:#17171d;border:1px solid var(--line);border-radius:6px;position:relative;padding:30px 26px 24px;box-shadow:0 20px 60px rgba(0,0,0,.6);margin:auto;animation:rcin .5s cubic-bezier(.2,1.2,.3,1)}
@keyframes rcin{from{transform:translateY(30px);opacity:0}}
#rc::before,#rc::after{content:"";position:absolute;left:0;right:0;height:14px;background:repeating-linear-gradient(90deg,#000 0 10px,#e9e1cb 10px 18px,#000 18px 28px);opacity:.55}
#rc::before{top:6px}#rc::after{bottom:6px}
.rhead{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--dim);gap:8px;flex-wrap:wrap}
.ren{font-family:var(--mono);font-size:12px;letter-spacing:.5em;color:var(--amber);text-align:center;margin-top:14px}
#rTitle{font-family:var(--serif);font-size:clamp(26px,5.6vw,46px);text-align:center;letter-spacing:.1em;color:#fff6e0;margin:2px 0 8px}
#rLast{font-family:var(--serif);font-size:clamp(15px,2.6vw,21px);line-height:1.75;text-align:center;color:#eadfc6;padding:10px 6px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
#rLast small{display:block;font-family:var(--sans);font-size:11px;color:var(--dim);letter-spacing:.2em;margin-bottom:2px}
#rFilm{display:flex;gap:3px;margin:12px 0;background:#000;padding:8px 6px;border-radius:3px;overflow:hidden}
#rFilm i{flex:1 1 0;aspect-ratio:16/9;background-size:cover;image-rendering:pixelated;min-width:0;max-width:110px;border-radius:1px}
#rFilm i.cut{filter:grayscale(1) brightness(.5)}
.rrow{display:flex;gap:14px;align-items:stretch;flex-wrap:wrap}
.rbox{flex:1 1 200px;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:10px 12px}
.rbox .lb{font-size:10px;color:var(--dim);letter-spacing:.2em}
#rRank{font-size:clamp(17px,3vw,24px);font-weight:700;color:var(--amber);margin-top:2px}
#rSat{font-family:var(--mono);font-size:clamp(30px,6vw,46px);font-weight:700;line-height:1;color:#fff6e0}
#rSat small{font-size:.4em;color:var(--dim);font-family:var(--sans)}
.mt{display:flex;align-items:center;gap:8px;font-size:12px;margin-top:5px}
.mt span{width:34px;color:var(--dim)}.mt div{flex:1;height:8px;background:#0c0c10;border-radius:4px;overflow:hidden}
.mt div b{display:block;height:100%;border-radius:4px;transition:width 1s cubic-bezier(.2,1,.3,1)}
#rCombo{font-size:13px;line-height:1.9;margin-top:10px;color:#cfeee6}
#rCombo b{color:var(--teal)}#rCombo u{text-decoration:none;font-size:10px;background:var(--teal);color:#06231d;padding:0 5px;border-radius:2px;margin-left:4px;font-weight:700}
#rBoss{font-size:13px;line-height:1.7;margin-top:10px;color:#d8d2c2;display:flex;gap:8px}
#rBoss i{flex:none;font-style:normal;background:#000;color:var(--amber);border:1px solid var(--amber);font-size:10px;padding:1px 6px;border-radius:3px;height:20px;margin-top:2px}
#rHint{font-size:12px;color:var(--dim);margin-top:6px;line-height:1.6}
#rZu{font-family:var(--mono);font-size:11px;color:var(--dim);margin-top:8px;letter-spacing:1px}
#rZu b{color:var(--amber)}#rZu em{color:var(--teal);font-style:normal}
.rbtn{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:16px 0 10px}
.rbtn .btn{padding:10px 18px;font-size:14px}
#bShare{background:#e9e1cb;box-shadow:0 3px 0 #8a8068}
@media(max-width:760px){
 .main{flex-direction:column}
 .side{order:-1;max-width:none;flex:none}
 .side .ph{display:none}
 .side .in{display:grid;grid-template-columns:44% 1fr;grid-template-rows:auto auto;gap:6px 8px;overflow:visible}
 #mon{grid-row:1/3}
 #info{min-height:0}#iCap{font-size:11px;line-height:1.5;max-height:66px;overflow:auto}#iTitle{font-size:13px}
 #acts button{padding:6px 8px}
 #memo{display:none}
 .binp{flex:1}
 #bin{grid-template-columns:repeat(4,1fr);gap:5px;padding:6px}
 .card .nm{font-size:10px;padding:3px 3px 4px}
 .top{padding-left:66px;gap:6px}.top .fname{font-size:10px}#ecg{width:70px}
 #hint{display:none}.tl .ph{justify-content:space-between}
 #track{height:92px;margin:6px}
 .tclip span{display:none}
 #rc{padding:28px 14px 22px}
 .dos{width:100%;max-width:420px;display:grid;grid-template-columns:128px 1fr;column-gap:10px;padding:10px 12px}.dos:nth-child(n){transform:none}
 .dos .no,.dos .rq,.dos .pg{grid-column:1/-1}.dos canvas{grid-row:2/4;align-self:center}.dos h3{margin:0;font-size:19px;align-self:end}.dos .sb{margin:0}.dos .rq{min-height:0;margin:8px 0 6px}.dos .stamp{top:34px}
 #select{padding-top:36px;gap:10px}
 .mk{width:10px;height:10px;margin:-5px 0 0 -5px}
}
</style>
</head>
<body>

<div id="title" class="scr on">
 <canvas id="strip"></canvas>

 setSub(r.c.who,say);}
function tickTheater(dt,now){const r=T.r,w=scrn.width,h=scrn.height,sp=T.speed;T.pt+=dt*(T.ph==='last'||T.ph==='card'?1:sp);
 if(T.sub&&T.subN<T.sub.length){const rate=T.ph==='last'?9:34*sp;const n0=Math.floor(T.subN);T.subN=Math.min(T.sub.length,T.subN+dt*rate);if(Math.floor(T.subN)>n0){$('subTx').textContent=T.sub.slice(0,Math.floor(T.subN));if(T.ph==='last')sfx.type();}}
 if(T.ph==='leader'){const n=3-Math.floor(T.pt/.5);if(n!==T.ln&&n>0){T.ln=n;sfx.lead();}g=lg;R(0,0,SW,SH,'#b8b0a0');R(79,0,2,SH,'#333');R(0,44,SW,2,'#333');
  film(cx,w,h,now,1.4);if(n>0){const q=(T.pt%.5)/.5;cx.strokeStyle='#222';cx.lineWidth=h*.012;cx.beginPath();cx.arc(w/2,h/2,h*.36,0,7);cx.stroke();cx.beginPath();cx.arc(w/2,h/2,h*.3,0,7);cx.stroke();
   cx.fillStyle='rgba(0,0,0,.28)';cx.beginPath();cx.moveTo(w/2,h/2);cx.arc(w/2,h/2,h*.6,-1.57,-1.57+q*6.283);cx.fill();cx.fillStyle='#1a1612';cx.font=`900 ${h*.42}px sans-serif`;cx.textAlign='center';cx.textBaseline='middle';cx.fillText(n,w/2,h/2+h*.02);}
  if(T.pt>=1.5){T.ph='play';T.pt=0;}return;}
 if(T.ph==='play'){T.t+=dt*sp;if(T.t>=T.end){T.t=T.end;$('progIn').style.width=T.t/30*100+'%';projector(false);music(null);
   if(r.cut){T.ph='snap';T.pt=0;sfx.snap();jolt();setSub('','——ブツッ。');$('slate').textContent='';}else{T.ph='out';T.pt=0;setSub('','');$('slate').textContent='';}return;}
  let i=T.idx;while(i+1<r.played.length&&T.t>=T.starts[i+1])i++;if(i<0)i=0;if(i!==T.idx)onClip(i);const k=r.played[i];scene(k.id,T.t-T.starts[i],k.d);film(cx,w,h,now,1);
  if(T.flash>0){cx.fillStyle=`rgba(255,250,235,${T.flash*.75})`;cx.fillRect(0,0,w,h);T.flash-=dt*9;}$('progIn').style.width=T.t/30*100+'%';return;}
 if(T.ph==='snap'){cx.fillStyle='#000';cx.fillRect(0,0,w,h);if(T.pt<.12){cx.fillStyle='#fff';cx.fillRect(0,h/2-2,w,4);}if(T.pt>1.1)toLast();return;}
 if(T.ph==='out'){g=lg;R(0,0,SW,SH,Math.random()<.5?'#fff8e0':'#d8d0b8');for(let i=0;i<4;i++)R(Math.random()*SW,0,1,SH,'#555');film(cx,w,h,now,2);cx.fillStyle=`rgba(0,0,0,${cl(T.pt/1.3)})`;cx.fillRect(0,0,w,h);if(T.pt>1.4)toLast();return;}
 /* 臨終 */
 const dim=T.ph==='card'?1:0;scene(r.c.port,now/1000,9,dim);film(cx,w,h,now,.5);
 const fade=T.ph==='card'?Math.min(.62,T.pt*.6):0;cx.fillStyle=`rgba(0,0,0,${cl(1-T.pt/1.2)*(T.ph==='last'?1:0)+fade})`;cx.fillRect(0,0,w,h);
 /* 心電図 */
 const flat=T.ph==='card',bt=T.pt/1.5;cx.strokeStyle=flat?'#ff5d4d':'#62d6bd';cx.lineWidth=Math.max(2,h*.006);cx.globalAlpha=.85;cx.beginPath();
 for(let x=0;x<=w;x+=3){const ph=((bt-(w-x)/w*2.2)%1+1)%1,y=h*.9-(flat?0:ecgY(ph))*h*.1;x?cx.lineTo(x,y):cx.moveTo(x,y);}cx.stroke();cx.globalAlpha=1;
 if(T.ph==='last'){const b=Math.floor(bt+.76);if(b!==T.lb){T.lb=b;sfx.beep(.03);}
  if(T.subN>=T.sub.length){T.hold=(T.hold||0)+dt;if(T.hold>1.5){T.ph='card';T.pt=0;sfx.flat();setTimeout(()=>{if(S.scr!=='theater')return;sfx.stamp();$('ecNo').textContent=`ENDING ${r.endNo} / ${r.c.ends.length}`;$('ecT').textContent=`『${r.end.title}』`;$('ecNew').style.display=r.newEnd?'':'none';$('endCard').classList.add('on');$('bRes').style.display='inline-block';},1300);}}}}
function toLast(){const r=T.r;$('banner').classList.remove('on');T.ph='last';T.pt=0;T.hold=0;$('bFF').style.display='none';$('sub').classList.add('last');setSub(`${r.c.name}　最期の一言`,r.end.last);setTimeout(()=>{if(S.scr==='theater')music(r.end.m);},600);}
$('theater').addEventListener('pointerdown',e=>{if(!T||e.target.closest('button'))return;if(T.ph==='last'&&T.subN<T.sub.length){T.subN=T.sub.length;$('subTx').textContent=T.sub;}});
$('bFF').onclick=()=>{T.speed=T.speed===1?3:1;$('bFF').classList.toggle('on',T.speed>1);sfx.click();};
$('bRes').onclick=()=>{sfx.click();openResult();};

/* ================= 納品書 ================= */
function openResult(){const r=S.res,c=r.c;music(r.end.m);
 $('rNo').textContent=`納品書 No.${String(r.no).padStart(4,'0')}　走馬灯編集部`;$('rWho').textContent=`依頼人：${c.name}（${c.sub}）`;
 $('rEn').textContent=`ENDING ${r.endNo} / ${c.ends.length}${r.newEnd?'　NEW!':''}`;$('rTitle').textContent=`『${r.end.title}』`;
 $('rLast').innerHTML=`<small>最期の一言</small>「${r.end.last}」`;
 $('rFilm').innerHTML=r.played.map((k,i)=>`<i title="${k.title}" class="${r.cut&&i===r.played.length-1?'cut':''}" style="background-image:url(${thumb(k.id)})"></i>`).join('');
 $('rRank').textContent=r.rank;$('rSat').innerHTML=`${r.sat}<small> %${r.sat>100?'（成仏）':''}</small>`;$('rUse').textContent=`使用尺 ${r.raw}秒 / 30秒　${r.played.length}クリップ${r.cut?'（尺オーバー）':''}`;
 $('mL').style.width='0';$('mC').style.width='0';setTimeout(()=>{$('mL').style.width=Math.round(r.laugh*100)+'%';$('mC').style.width=Math.round(cl(r.cry)*100)+'%';},80);
 $('rCombo').innerHTML=r.found.length?'発見したつなぎ：'+r.found.map(f=>`<b>◆${f.k.name}</b>${f.isNew?'<u>NEW</u>':''}`).join('　'):'発見したつなぎ：なし（並べ順で、記憶の意味が変わる組み合わせがある）';
 $('rBossTx').textContent=(r.auto?'納期を過ぎたから俺が繋いだ。次は手を動かせ。':r.end.boss);
 const fe=SV.e[c.id]||[],fc=SV.c[c.id]||[],un=c.ends.filter(e=>!fe.includes(e.id)&&e.hint),hn=un.find(e=>e.true)||un[Math.random()*un.length|0];
 $('rHint').textContent=hn?`編集長メモ：未発見のエンディング —— ${hn.hint}`:'編集長メモ：この依頼人のエンディングは、すべて納品済みだ。';
 $('rZu').innerHTML=`図鑑　ENDING <b>${c.ends.map(e=>fe.includes(e.id)?'●':'○').join('')}</b>　つなぎ <em>${c.combos.map(k=>fc.includes(k.id)?'◆':'◇').join('')}</em>`;
 show('result');$('result').scrollTop=0;}
$('bAgain').onclick=()=>{sfx.start();music(null);openEdit(S.res.c.id);};
$('bSel').onclick=()=>{sfx.click();music(null);openSelect();};
$('bShare').onclick=()=>{const r=S.res;const tx=`${r.c.name}（${r.c.sub.split('・')[0]}）の走馬灯を30秒に編集しました。\n最期の一言「${r.end.last}」\nENDING『${r.end.title}』／${r.rank}／本人満足度${r.sat}%\n#走馬灯エディター #100個のバカゲー`;
 window.open('https://twitter.com/intent/tweet?text='+encodeURIComponent(tx),'_blank');};
$('bStart').onclick=()=>{initAudio();sfx.start();openSelect();};

/* ================= ループ ================= */
let lastNow=0;
function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,(now-lastNow)/1000||0);lastNow=now;
 if(S.scr==='title')drawStrip(now);else if(S.scr==='select')drawPorts(now);else if(S.scr==='edit')tickEdit(dt,now);else if(S.scr==='theater'&&T)tickTheater(dt,now);}
window.addEventListener('resize',()=>{if(S.scr==='edit')layoutTL();if(S.scr==='theater')sizeTheater();});
refreshTitle();requestAnimationFrame(loop);
</script>
</body>
