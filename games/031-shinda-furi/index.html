<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>死んだふり</title>
<style>
:root{--ink:#3a2418;--paper:#fbf3dc;--bear:#8a5a3c;--red:#d8452e;--green:#5d8a4a;--honey:#f2b632;--lw:3px}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;overflow:hidden;background:#cfeadf;color:var(--ink);
 font-family:"Hiragino Maru Gothic ProN","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",system-ui,sans-serif;
 font-weight:700;user-select:none;-webkit-user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent}
body.play,body.play *{cursor:none!important}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;transition:transform 4s cubic-bezier(.5,0,.3,1)}
#back{position:fixed;left:10px;top:8px;z-index:60;font-size:12px;color:var(--ink);text-decoration:none;
 background:rgba(251,243,220,.85);border:2px solid var(--ink);border-radius:999px;padding:3px 10px}
/* ---- HUD ---- */
#hud{position:fixed;left:0;right:0;top:10px;z-index:30;text-align:center;pointer-events:none;opacity:0;transition:opacity .3s}
#hud.on{opacity:1}
#timer{display:inline-block;font-size:clamp(30px,6vw,46px);font-weight:900;letter-spacing:.02em;font-variant-numeric:tabular-nums;
 background:var(--paper);border:var(--lw) solid var(--ink);border-radius:16px;padding:2px 20px;box-shadow:0 5px 0 var(--ink);min-width:5.2em}
#phase{margin-top:10px;font-size:13px}
#phase span{display:inline-block;background:var(--ink);color:var(--paper);border-radius:999px;padding:3px 14px}
#phase.pop span{animation:pop .5s cubic-bezier(.2,2,.4,1)}
#chip{position:fixed;left:50%;bottom:14px;translate:-50% 0;z-index:26;font-size:13px;background:rgba(251,243,220,.92);
 border:2px solid var(--ink);border-radius:999px;padding:4px 14px;opacity:0;transition:opacity .4s,translate .4s;pointer-events:none;white-space:nowrap}
#chip.on{opacity:1;translate:-50% -6px}
@keyframes pop{0%{scale:.4}100%{scale:1}}
/* ---- 熊の吹き出し ---- */
#say{position:fixed;z-index:25;left:0;top:0;max-width:min(80vw,430px);background:#fff;border:var(--lw) solid var(--ink);border-radius:20px;
 padding:10px 18px;font-size:clamp(16px,2.6vw,21px);line-height:1.45;box-shadow:4px 5px 0 var(--ink);opacity:0;scale:.6;
 transition:opacity .12s,scale .18s cubic-bezier(.2,1.8,.4,1);pointer-events:none;transform-origin:50% 100%}
#say.on{opacity:1;scale:1}
#say.big{font-size:clamp(26px,5.2vw,44px);font-weight:900;padding:12px 26px}
#say.sm{font-size:13px;color:#7a6658}
#say i{position:absolute;left:50%;bottom:-9px;width:16px;height:16px;margin-left:-8px;background:#fff;border-right:var(--lw) solid var(--ink);
 border-bottom:var(--lw) solid var(--ink);rotate:45deg}
#say.up i{bottom:auto;top:-9px;rotate:225deg}
#say.sl i{left:-9px;margin-left:0;bottom:50%;margin-bottom:-8px;rotate:135deg}
#say.sr i{left:auto;right:-9px;margin-left:0;bottom:50%;margin-bottom:-8px;rotate:-45deg}
/* ---- 画面効果 ---- */
#flash{position:fixed;inset:0;z-index:35;pointer-events:none;opacity:0;background:#fff}
#count{position:fixed;left:2%;width:34%;top:20%;z-index:32;text-align:center;pointer-events:none;display:none}
#count b{display:block;white-space:nowrap;line-height:1.25;font-size:clamp(30px,4.3vw,58px);font-weight:900;color:#fff;-webkit-text-stroke:2px var(--ink);
 text-shadow:0 6px 0 var(--ink),4px 4px 0 var(--ink),-4px 4px 0 var(--ink),4px -3px 0 var(--ink),-4px -3px 0 var(--ink);paint-order:stroke fill}
#count em{display:inline-block;font-style:normal;margin-top:6px;font-size:clamp(54px,12vw,96px);font-weight:900;color:var(--honey);
 text-shadow:0 6px 0 var(--ink),4px 4px 0 var(--ink),-4px 4px 0 var(--ink),4px -3px 0 var(--ink),-4px -3px 0 var(--ink)}
#count small{display:block;font-size:14px;margin-top:8px}
#count small span{background:var(--paper);border:2px solid var(--ink);border-radius:999px;padding:3px 12px}
/* ---- 共通UI ---- */
.card{background:var(--paper);border:var(--lw) solid var(--ink);border-radius:20px;box-shadow:6px 7px 0 var(--ink)}
.btn{font:inherit;font-weight:900;color:var(--ink);font-size:16px;padding:.62em 1.25em;border:var(--lw) solid var(--ink);border-radius:999px;
 background:var(--honey);box-shadow:0 5px 0 var(--ink);cursor:pointer;transition:translate .08s,box-shadow .08s}
.btn:hover{translate:0 -2px;box-shadow:0 7px 0 var(--ink)}
.btn:active{translate:0 4px;box-shadow:0 1px 0 var(--ink)}
.btn.sub{background:#fff}
.btn.x{background:var(--ink);color:var(--paper)}
/* ---- タイトル ---- */
#title{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:space-between;
 padding:max(34px,5vh) 14px max(16px,3vh)}
#logo{text-align:center}
#logo h1{margin:0;font-size:clamp(54px,min(13vw,15vh),118px);font-weight:900;line-height:1;letter-spacing:.04em;color:var(--paper);
 text-shadow:0 8px 0 var(--ink),5px 5px 0 var(--ink),-5px 5px 0 var(--ink),5px -4px 0 var(--ink),-5px -4px 0 var(--ink),0 -5px 0 var(--ink)}
#logo h1 span{display:inline-block;animation:dead 3.6s ease-in-out infinite}
#logo h1 span:nth-child(4){animation-delay:.15s}#logo h1 span:nth-child(5){animation-delay:.3s}
@keyframes dead{0%,70%,100%{rotate:0deg;translate:0 0}80%,92%{rotate:14deg;translate:0 8px}}
#logo p{margin:16px 0 0;font-size:clamp(15px,2.6vw,20px)}
#logo p span{background:var(--ink);color:var(--paper);padding:4px 16px;border-radius:999px}
#tcard{width:min(94vw,560px);padding:14px 18px 16px;text-align:center}
#tcard .how{font-size:clamp(13px,2.1vw,15px);line-height:1.75;margin:0 0 12px}
#tcard .how b{font-size:1.25em;color:var(--red)}
#tcard .ng{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin:6px 0 2px}
#tcard .ng s{text-decoration:none;font-size:12px;border:2px solid var(--ink);border-radius:999px;padding:1px 9px;background:#fff;position:relative}
#tcard .ng s::after{content:"";position:absolute;left:4px;right:4px;top:50%;border-top:2px solid var(--red);rotate:-8deg}
#tcard .row{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
#tcard .rec{font-size:12px;margin-top:10px;opacity:.8}
#start{font-size:clamp(18px,3.2vw,22px)}
/* ---- 結果 ---- */
#result{position:fixed;inset:0;z-index:45;display:none;align-items:center;justify-content:flex-end;padding:14px 5vw;pointer-events:none}
#result.on{display:flex}
.rc{position:relative;width:min(94vw,470px);padding:16px 20px 18px;pointer-events:auto;animation:rcin .55s cubic-bezier(.2,1.5,.4,1)}
@keyframes rcin{0%{translate:0 60px;opacity:0;rotate:3deg}100%{translate:0 0;opacity:1;rotate:0deg}}
.rc h2{margin:0 0 8px;font-size:13px;letter-spacing:.25em;text-align:center;border-bottom:2px dashed var(--ink);padding-bottom:8px}
.rc .lab{font-size:11px;letter-spacing:.2em;opacity:.7}
.rc .time{font-size:clamp(50px,12vw,72px);font-weight:900;line-height:1.05;font-variant-numeric:tabular-nums}
.rc .time small{font-size:.35em;margin-left:4px}
.rc .rank{display:inline-block;margin:4px 0 10px;font-size:clamp(19px,4.4vw,25px);font-weight:900;background:var(--ink);color:var(--paper);padding:3px 16px;border-radius:10px}
.rc .cause{font-size:14px;line-height:1.6;border-left:6px solid var(--red);padding:2px 0 2px 10px;margin-bottom:10px}
.rc .cause b{color:var(--red)}
.rc .cm{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.55;background:#fff;border:2px solid var(--ink);border-radius:14px;padding:8px 12px;margin-bottom:10px}
.rc .cm::before{content:"🐻";font-size:24px;line-height:1.1}
.rc .st{display:flex;gap:6px;font-size:11px;margin-bottom:12px}
.rc .st div{flex:1;text-align:center;border:2px solid var(--ink);border-radius:10px;padding:4px 2px;background:#fff}
.rc .st b{display:block;font-size:16px;font-variant-numeric:tabular-nums}
.rc .bt{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.rc .bt .btn{font-size:15px}
.rc .note{font-size:11px;text-align:center;margin-top:10px;opacity:.75}
.stamp{position:absolute;right:16px;top:50px;width:104px;height:104px;border:5px solid var(--red);border-radius:50%;color:var(--red);
 display:flex;align-items:center;justify-content:center;font-size:25px;font-weight:900;rotate:14deg;opacity:.9;
 box-shadow:inset 0 0 0 3px var(--paper),inset 0 0 0 5px var(--red);animation:stamp .35s .45s cubic-bezier(.3,2,.5,1) both}
.stamp.ok{border-color:var(--green);color:var(--green);box-shadow:inset 0 0 0 3px var(--paper),inset 0 0 0 5px var(--green)}
@keyframes stamp{0%{scale:3;opacity:0}100%{scale:1;opacity:.9}}
/* ---- 図鑑 ---- */
#zukan{position:fixed;inset:0;z-index:70;display:none;align-items:center;justify-content:center;background:rgba(58,36,24,.55);padding:12px}
#zukan.on{display:flex}
#zk{width:min(96vw,640px);max-height:92vh;display:flex;flex-direction:column;padding:14px 16px}
#zk h3{margin:0 0 4px;font-size:18px;text-align:center}
#zk .sub{font-size:12px;text-align:center;margin-bottom:8px;opacity:.8}
#zl{overflow:auto;touch-action:pan-y;flex:1;padding-right:4px}
#zl h4{margin:10px 0 6px;font-size:12px;letter-spacing:.15em}
#zl h4 span{background:var(--ink);color:var(--paper);border-radius:999px;padding:2px 12px}
#zl .g{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:5px}
#zl .it{font-size:12px;border:2px solid var(--ink);border-radius:10px;padding:5px 8px;background:#fff;display:flex;gap:6px;align-items:center}
#zl .it.no{opacity:.4;background:transparent;border-style:dashed}
#zl .it.ko{background:#fbdcd4}
#zk .btn{align-self:center;margin-top:10px}
/* ---- 熊の罠（偽UI） ---- */
#fx{position:fixed;inset:0;z-index:20;pointer-events:none;overflow:hidden}
.bait{position:absolute;pointer-events:auto;animation:pop .28s cubic-bezier(.2,1.7,.4,1)}
.paw{position:absolute;right:6px;bottom:2px;font-size:10px;opacity:.38}
.sys{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-weight:500;background:#f3f3f6;border:var(--lw) solid var(--ink);border-radius:12px;
 box-shadow:6px 7px 0 rgba(58,36,24,.6);color:#222;overflow:hidden}
.sys .tb{background:#dcdce6;padding:6px 12px;font-size:12px;border-bottom:2px solid var(--ink);display:flex;justify-content:space-between;font-weight:700}
.sys .bd{padding:14px 16px 12px;font-size:14px;line-height:1.65}
.sys .bd b{font-size:15px}
.sys .bs{display:flex;gap:8px;justify-content:flex-end;padding:0 14px 14px;flex-wrap:wrap}
.bb{font:inherit;font-weight:700;font-size:14px;padding:7px 16px;border:2px solid var(--ink);border-radius:9px;background:#fff;color:#222}
.bb.p{background:#3b7be0;color:#fff}
.bb.r{background:var(--red);color:#fff}
.ctr{left:50%;top:50%;translate:-50% -50%;width:min(88vw,400px);rotate:-1.2deg}
.low{left:50%;top:auto;bottom:9%;translate:-50% 0;width:min(88vw,400px);rotate:1deg}
.tr{right:14px;top:92px;width:min(84vw,330px);rotate:1deg}
.brc{right:14px;bottom:16px;width:min(84vw,320px)}
.dim{inset:0;background:rgba(58,36,24,.38);animation:fade .4s}
@keyframes fade{0%{opacity:0}100%{opacity:1}}
.cookie{left:0;right:0;bottom:0;border-radius:16px 16px 0 0;border-bottom:0;animation:up .45s cubic-bezier(.2,1.3,.4,1)}
@keyframes up{0%{translate:0 100%}100%{translate:0 0}}
.cookie .bd{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:center;padding:14px 16px 18px}
.ntf{left:50%;translate:-50% 0;width:min(92vw,380px);border-radius:16px;padding:9px 14px;font-size:13px;line-height:1.45;display:flex;gap:10px;align-items:center;
 animation:down .45s cubic-bezier(.2,1.4,.4,1)}
.ntf u{text-decoration:none;font-size:24px}
.ntf small{display:block;opacity:.6;font-size:11px}
@keyframes down{0%{translate:-50% -160%}100%{translate:-50% 0}}
.ph{right:5vw;bottom:5vh;width:186px;height:320px;background:#1d2030;border:var(--lw) solid var(--ink);border-radius:26px;box-shadow:6px 7px 0 rgba(58,36,24,.6);
 color:#fff;text-align:center;padding:26px 10px 0;font-family:system-ui,sans-serif;font-weight:500}
.ph.vib{animation:vib .09s linear infinite}
@keyframes vib{0%{translate:-2px 1px;rotate:-.8deg}50%{translate:2px -1px;rotate:.8deg}100%{translate:-2px 1px;rotate:-.8deg}}
.ph .t{font-size:12px;opacity:.7}
.ph .av{width:74px;height:74px;border-radius:50%;background:#e9c2a0;margin:14px auto 8px;font-size:44px;line-height:74px;border:2px solid #fff}
.ph .n{font-size:30px;font-weight:800}
.ph .m{font-size:12px;line-height:1.5;background:#fff;color:#222;border-radius:12px;padding:8px 9px;margin:12px 2px 0;text-align:left;display:none}
.ph .b{position:absolute;left:0;right:0;bottom:22px;display:flex;justify-content:space-around;padding:0 22px}
.ph .b span{width:52px;height:52px;border-radius:50%;font-size:24px;line-height:52px;background:var(--red)}
.ph .b span+span{background:#3cb55a;animation:pulse .6s ease-in-out infinite alternate}
@keyframes pulse{0%{scale:1}100%{scale:1.16}}
.clr{left:50%;top:50%;translate:-50% -50%;width:min(90vw,440px);text-align:center;padding:18px 18px 20px}
.clr h3{margin:0;white-space:nowrap;font-size:clamp(19px,5vw,30px);font-weight:900;color:var(--red)}
.clr p{margin:8px 0 14px;font-size:14px;line-height:1.6}
.clr .btn{animation:pulse .5s ease-in-out infinite alternate}
.redb{left:50%;bottom:8%;translate:-50% 0;text-align:center}
.redb .cap{width:150px;height:150px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff8a70,var(--red) 60%);border:var(--lw) solid var(--ink);
 box-shadow:0 14px 0 #8f2416,0 14px 0 3px var(--ink);display:flex;align-items:center;justify-content:center;color:#fff;font-size:21px;font-weight:900;
 line-height:1.3;padding:14px;animation:pulse .7s ease-in-out infinite alternate;text-shadow:0 2px 0 rgba(0,0,0,.35)}
.ad{left:50%;top:26%;translate:-50% 0;width:min(90vw,460px);background:linear-gradient(135deg,#fff36b,#ff9a3c);border:var(--lw) solid var(--ink);border-radius:8px;
 padding:14px 16px;text-align:center;box-shadow:6px 7px 0 rgba(58,36,24,.6);transition:scale 5s linear,top 5s linear;transform-origin:50% 0}
.ad h3{margin:0;font-size:clamp(20px,4.6vw,28px);font-weight:900;color:var(--red);text-shadow:2px 2px 0 #fff}
.ad p{margin:4px 0 8px;font-size:13px}
.ad .xx{position:absolute;right:4px;top:2px;font-size:10px;border:1px solid var(--ink);border-radius:50%;width:14px;height:14px;line-height:12px;background:#fff}
.ad .pr{position:absolute;left:6px;top:3px;font-size:9px;opacity:.7}
.skip{right:0;bottom:22%;background:rgba(20,20,26,.86);color:#fff;border:2px solid #fff;border-right:0;padding:10px 16px;font-size:15px;font-family:system-ui,sans-serif;font-weight:600}
.skip.go{background:#fff;color:#111;border-color:var(--ink)}
.stars{font-size:34px;letter-spacing:4px;color:#c9c9d0}
.stars b{color:var(--honey);-webkit-text-stroke:1px var(--ink)}
.cap2{display:flex;align-items:center;gap:12px;font-size:15px}
.cap2 i{display:inline-block;width:28px;height:28px;border:2px solid #666;border-radius:4px;background:#fff}
.cap2 small{margin-left:auto;font-size:9px;text-align:center;opacity:.6;line-height:1.3}
.qte{left:50%;bottom:1.5%;translate:-50% 0;width:min(92vw,440px);text-align:center}
.qte .h{white-space:nowrap;font-size:clamp(28px,7vw,44px);font-weight:900;color:#fff;text-shadow:0 5px 0 var(--ink),3px 3px 0 var(--ink),-3px 3px 0 var(--ink),3px -3px 0 var(--ink),-3px -3px 0 var(--ink)}
.qte .k{display:inline-block;background:var(--red);color:#fff;border:var(--lw) solid var(--ink);border-radius:12px;padding:6px 14px;font-size:16px;animation:pulse .18s linear infinite alternate}
.qte .gb{height:20px;border:var(--lw) solid var(--ink);border-radius:999px;background:#fff;margin-top:10px;overflow:hidden}
.qte .gb i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--honey),var(--red))}
.bigw{left:50%;top:40%;translate:-50% -50%;font-size:clamp(60px,16vw,150px);font-weight:900;color:var(--red);white-space:nowrap;rotate:-8deg;
 text-shadow:0 7px 0 var(--ink),5px 5px 0 var(--ink),-5px 5px 0 var(--ink),5px -4px 0 var(--ink),-5px -4px 0 var(--ink);pointer-events:none}
.cd{left:auto;right:7%;top:30%;text-align:center;padding:8px 26px 10px;min-width:230px}
.cd small{display:block;font-size:13px}
.cd b{font-size:clamp(50px,11vw,84px);font-weight:900;line-height:1;font-variant-numeric:tabular-nums;color:var(--red)}
.terms .tx{height:128px;overflow:hidden;border:2px solid #999;border-radius:6px;background:#fff;padding:8px 22px 8px 10px;font-size:12px;line-height:1.7;position:relative;margin-top:8px}
.terms .tx::after{content:"";position:absolute;right:4px;top:6px;width:8px;height:30px;border-radius:4px;background:#aaa}
.bb.dis{opacity:.45}
.sleep{inset:0;background:#000;opacity:0;transition:opacity 1.6s;animation:none;display:flex;align-items:center;justify-content:center;flex-direction:column;color:#8a8a96;
 font-family:system-ui,sans-serif;font-weight:500;font-size:14px;gap:14px;text-align:center}
.sleep.on{opacity:.97}
.sleep b{font-size:40px;letter-spacing:22px;margin-left:22px;opacity:0;transition:opacity .5s;color:#f2b632}
.fcur{width:22px;height:30px;animation:none;pointer-events:none;z-index:5}
.rip{width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;border:4px solid rgba(255,255,255,.95);background:rgba(255,255,255,.35);animation:rip .7s ease-out forwards;pointer-events:none}
@keyframes rip{0%{scale:.3;opacity:1}100%{scale:1.5;opacity:0}}
.nade{font-size:17px}
.spin{display:inline-block;width:15px;height:15px;border:3px solid #bbb;border-top-color:#3b7be0;border-radius:50%;animation:sp 1s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{rotate:360deg}}
.fres{left:50%;top:50%;translate:-50% -50%;animation:none}
@media (orientation:portrait){
 #count{left:0;width:100%;top:104px}
 #count b{font-size:clamp(28px,8.4vw,44px)}
 #count em{font-size:56px;margin-top:0}
 .cd{left:50%;right:auto;top:15%;translate:-50% 0}
 .tr{top:auto;bottom:7%}
 #result{align-items:flex-end;justify-content:center;padding:8px 8px 10px}
 .rc{padding:12px 16px 14px}
 .stamp{width:86px;height:86px;font-size:21px;top:44px;right:12px}
 .ph{right:50%;translate:50% 0;bottom:3vh;height:290px}
 .tr{right:50%;translate:50% 0}
}
@media (max-height:520px){
 #title{padding-top:30px}#logo h1{font-size:54px}#logo p{margin-top:8px}#tcard .ng{display:none}
 .rc .cm{display:none}.rc .time{font-size:46px}.stamp{width:80px;height:80px;font-size:19px}
}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<a id="back" href="../../index.html">← 一覧</a>
<div id="hud"><div id="timer">0:00.0</div><div id="phase"><span></span></div></div>
<div id="fx"></div>
<div id="say"><span id="sayt"></span><i></i></div>
<div id="chip"></div>
<div id="count"><b></b><em></em><small><span></span></small></div>
<div id="flash"></div>

<div id="title">
 <div id="logo"><h1><span>死</span><span>ん</span><span>だ</span><span>ふ</span><span>り</span></h1><p><span>熊が来た。動いたら、バレる。</span></p></div>
 <div id="tcard" class="card">
  <p class="how">操作方法：<b>なにもしない。</b>
   <span class="ng"><s>マウスを動かす</s><s>クリック</s><s>キー</s><s>スクロール</s><s>タッチ</s><s>よそ見（タブ移動）</s></span>
   <span id="tip">スマホは机に置いて、さわらずに見守ろう。</span></p>

 e.upd=t=>{B.lookT=[0,0];B.T.ry=-70+(t>.8&&t<2?Math.sin(t*26)*30:0)};
},{tense:.8}),
E('flip','天地がえし',4,10,'首かしげたら負けやで',e=>{
 face('happy','smile',0);pose({lx:-210,ly:-420,rx:210,ry:-420});
 e.at(.3,()=>say('よいしょっと'));
 e.at(1,()=>{cv.style.transform='rotate(180deg)';hush()});e.cl.push(()=>{cv.style.transform=''});
 e.at(5.4,()=>say('天地ひっくり返っても動かへんのか'));
 e.at(6.6,()=>{cv.style.transform=''});
})
];
const EMAP={};EVS.forEach(e=>EMAP[e.id]=e);
function txtBurst(s,x,y){part({x,y,vy:-40,life:.9,txt:s,sz:54,col:'#ffe066',rot:-.15})}
function buzz(ms){try{if(navigator.vibrate){navigator.vibrate(ms);S.vibUntil=performance.now()+ms+400}}catch(e){}}

function startEv(def){
 const e={def,t:0,q:[],els:[],cl:[],upd:null,draw:null};
 e.at=(t,fn)=>e.q.push({t,fn});
 e.every=(p,fn,a=0,b=def.dur)=>{for(let t=a;t<b;t+=p)e.q.push({t,fn})};
 e.dom=(html,cls)=>{const d=document.createElement('div');d.className='bait '+(cls||'');d.innerHTML=html;fx.appendChild(d);e.els.push(d);return d};
 e.clearDom=()=>{e.els.forEach(d=>d.remove());e.els=[]};
 EV=e;S.used[def.id]=1;S.lastId=def.id;S.tenseT=def.tense!==undefined?def.tense:.25+def.tier*.1;
 resetBear();pose({});def.run(e);e.q.sort((a,b)=>a.t-b.t);
}
function endEv(ok){
 if(!EV)return;const e=EV;EV=null;e.clearDom();e.cl.forEach(f=>f());
 P.trem=0;P.jig=0;P.bump=0;P.wet=0;S.tenseT=.15;
 if(ok){resetBear();pose({});S.lastEnd=e.def;S.lastEndT=S.el;S.survived++;S.seenRun[e.def.id]=1;
  const ch=$('#chip');ch.textContent='✔「'+e.def.n+'」に耐えた';ch.classList.add('on');clearTimeout(ch._t);ch._t=setTimeout(()=>ch.classList.remove('on'),1900);
  S.gap=[0,1.7,1.4,1.1,.8][S.tier]}
}
const TIERS=[0,25,70,150];
const PH=['','第1章　さわってくる','第2章　揺さぶってくる','第3章　画面を偽ってくる','最終章　手段を選ばない'];
function pickEv(){
 if(S.forced.length)return EMAP[S.forced.shift()];
 let pool=EVS.filter(e=>e.tier<=S.tier&&!S.used[e.id]);
 if(!pool.length){S.used={};pool=EVS.filter(e=>e.tier<=S.tier&&e.id!==S.lastId)}
 const w=pool.map(e=>(e.tier===S.tier?7:e.tier===S.tier-1?2:1)*(SV.seen[e.id]?1:1.7));
 let r=R()*w.reduce((a,b)=>a+b,0);for(let i=0;i<pool.length;i++){r-=w[i];if(r<=0)return pool[i]}return pool[0];
}
function updPlay(dt){
 S.el=(performance.now()-S.t0)/1000;
 if(S.el>=300){win();return}
 let tier=1;for(let i=1;i<4;i++)if(S.el>=TIERS[i])tier=i+1;
 if(tier!==S.tier){S.tier=tier;const p=$('#phase');p.firstChild.textContent=PH[tier];p.classList.remove('pop');void p.offsetWidth;p.classList.add('pop');
  if(tier>1){sfx.ding();S.forced.push(['','','phone','clear','fakeres'][tier])}}
 if(!S.frozen)$('#timer').textContent=fmt(S.el);
 if(EV){const e=EV;e.t+=dt;while(e.q.length&&e.q[0].t<=e.t){e.q.shift().fn();if(EV!==e)return}
  if(e.upd)e.upd(e.t,dt);if(e.t>=e.def.dur)endEv(true)}
 else{B.lookT=[Math.sin(S.t*.9)*.8,.7];S.gap-=dt;if(S.gap<=0)startEv(pickEv())}
}

/* ================= 入力検知（＝負け） ================= */
const KN={' ':'Space',Escape:'Esc',ArrowUp:'↑',ArrowDown:'↓',ArrowLeft:'←',ArrowRight:'→',Control:'Ctrl'};
const baitOf=t=>{const b=t&&t.closest&&t.closest('[data-b]');return b?b.dataset.b:''};
addEventListener('pointermove',e=>{
 if(S.armed&&e.pointerType!=='touch'){if(mx==null){mx=e.clientX;my=e.clientY;lose('move',{d:1});return}
  const d=Math.hypot(e.clientX-mx,e.clientY-my);if(d>=1)lose('move',{d:Math.max(1,Math.round(d))})}
 else if(S.armed)lose('touch',{b:baitOf(e.target)});
 mx=e.clientX;my=e.clientY},true);
addEventListener('pointerdown',e=>{if(S.armed){e.preventDefault();lose(e.pointerType==='touch'?'touch':'click',{b:baitOf(e.target)})}},true);
addEventListener('touchstart',e=>{if(S.armed)lose('touch',{b:baitOf(e.target)})},{capture:true,passive:true});
addEventListener('keydown',e=>{if(S.armed&&!e.repeat){e.preventDefault();lose('key',{k:KN[e.key]||(e.key.length===1?e.key.toUpperCase():e.key)})}},true);
addEventListener('wheel',e=>{if(S.armed)lose('wheel',{})},{capture:true,passive:true});
addEventListener('contextmenu',e=>{if(S.state!=='title'&&S.state!=='result')e.preventDefault()});
document.addEventListener('visibilitychange',()=>{if(S.armed&&document.hidden)lose('hide',{})});
addEventListener('blur',()=>{if(S.armed)lose('blur',{})});
addEventListener('devicemotion',e=>{
 if(!S.armed||performance.now()<S.vibUntil||(performance.now()-S.t0)<2500)return;
 const r=e.rotationRate,a=e.acceleration;
 const rv=r&&r.alpha!=null?Math.hypot(r.alpha||0,r.beta||0,r.gamma||0):0,av=a&&a.x!=null?Math.hypot(a.x||0,a.y||0,a.z||0):0;
 if(rv>45||av>2.6)lose('shake',{})});

function causeText(kind,o){
 switch(kind){
  case'move':return'マウスを <b>'+o.d+'px</b> 動かした';
  case'click':return o.b?'<b>「'+o.b+'」</b>を'+'クリックした':'クリックした';
  case'touch':return o.b?'<b>「'+o.b+'」</b>をタップした':'画面にさわった';
  case'key':return'<b>「'+o.k+'」</b>キーを押した';
  case'wheel':return'スクロールした';
  case'hide':return'よそのタブへ逃げた';
  case'blur':return'よそ見をした（ウィンドウを離れた）';
  case'shake':return'端末を揺らした';
 }return'動いた'}
const GEN={move:'いまピクッてしたやろ。ワシの目はごまかされへんで',click:'死体はクリックせぇへんねん',touch:'死体は画面さわらへんねん',key:'死体はキーボード打たへんねん',
 wheel:'死体がスクロールすな',hide:'死体がよそのタブ行くかいな',blur:'よそ見する死体がおるかいな',shake:'地震か思たらキミやった'};
const RANKS=[[3,'即バレ'],[10,'落ち着きのない人'],[25,'ふつうの人間'],[45,'タヌキ寝入り'],[70,'石ころ見習い'],[110,'置物'],[150,'マネキン'],[200,'仏像'],[250,'化石'],[300,'ほぼ死体']];
const rankOf=t=>{for(const r of RANKS)if(t<r[0])return r[1];return'森の伝説'};

function lose(kind,o){
 if(!S.armed)return;S.armed=false;S.state='lose';document.body.classList.remove('play');
 const t=Math.min(300,(performance.now()-S.t0)/1000);S.el=t;$('#timer').textContent=fmt(t);
 let ev=EV?EV.def:(S.el-S.lastEndT<1.2?S.lastEnd:null);
 if(EV)endEv(false);S.frozen=false;cv.style.transform='';
 const what=causeText(kind,o);
 const cause=ev?'<b>「'+ev.n+'」</b>に負けて、'+what:'何も起きていないのに、'+what;
 const cm=t<3?'早い早い早い。まだ何もしてへんがな':ev?ev.lc:GEN[kind];
 SV.plays++;if(ev)SV.lost[ev.id]=(SV.lost[ev.id]||0)+1;Object.assign(SV.seen,S.seenRun);const nb=t>SV.best;if(nb)SV.best=t;save();
 const sh='熊の前で死んだふりをして '+fmt(t)+' 耐えたけど、'+(ev?'「'+ev.n+'」に負けて':'何もないのに')+(what.replace(/<[^>]+>/g,''))+'。称号【'+rankOf(t)+'】';
 S.result={time:t,rank:rankOf(t),cause,cm,stamp:'不合格',nb,share:sh};
 Q=[];hush();resetBear();$('#count').style.display='none';P.face='shock';P.trem=1;S.hit=.28;S.tenseT=0;
 sfx.lose();flash('#fff',.9,.5);shake(26);buzz(200);
 pose({hy:120,hs:1.7},320);face('wide','o',-1);
 part({x:-150,y:-150,vy:-30,life:1.2,txt:'ギクッ',sz:44,col:'#fff',rot:-.2});
 part({x:0,y:W<H?-560:-470,vy:-12,life:2,txt:({move:o.d+'px 動いた！',click:'クリックした！',touch:'さわった！',key:'キーを押した！',wheel:'スクロールした！',hide:'よそ見した！',blur:'よそ見した！',shake:'揺らした！'})[kind],sz:W<H?46:54,col:'#ffe066',rot:-.05});
 seq(.45,()=>{say('生きとるやんけ！！！',{big:1,spd:50,hold:1.2});face('wide','grr',-1);sfx.roar();shake(14)});
 seq(2.1,()=>{face('happy','smile',0);P.trem=0;showResult()});
}
function win(){
 S.armed=false;S.state='win';S.el=300;$('#timer').textContent=fmt(300);document.body.classList.remove('play');
 if(EV)endEv(true);Q=[];hush();resetBear();S.tenseT=0;$('#count').style.display='none';
 SV.plays++;SV.clear++;SV.best=300;Object.assign(SV.seen,S.seenRun);save();
 face('n','flat',.5);seq(.6,()=>say('………5分や'));
 seq(3,()=>{face('closed','sad',.8);say('参った。あんた、ほんまもんの死体や')});
 seq(6.2,()=>{pose({hy:70,lx:-30,ly:-168,rx:30,ry:-168});face('closed','flat',.6);say('成仏しぃや…ナムナム…');tone(660,1.6,{v:.08});tone(990,1.6,{v:.04})});
 seq(9.4,()=>{pose({x:OFF()*1.8},12);hush()});
 seq(11.6,()=>{P.face='alive';sfx.clear();for(let i=0;i<60;i++)part({x:rnd(W/2/sc),y:-H*.8/sc-R()*200,vx:rnd(60),vy:160+R()*160,g:120,life:4,sz:14,col:['#f2b632','#d8452e','#5d8a4a','#fff','#6aa5e8'][i%5],vr:rnd(8)});
  S.result={time:300,rank:'森の伝説',cause:'<b>熊が先にあきらめた。</b>完全勝利。',cm:'参った。あんた、ほんまもんの死体や',stamp:'合格',ok:1,nb:1,
   share:'熊の前で死んだふりをして 5:00.0 耐えきった。熊に成仏を祈られた。称号【森の伝説】',note:'※これは本物の結果画面です。もう動いて大丈夫。…たぶん。'};
  showResult()});
}
function resHTML(r){
 const seen=Object.keys(SV.seen).length;
 return '<h2>死んだふり検定　結果通知書</h2><div class="lab">耐久時間</div><div class="time">'+fmt(r.time)+'<small>秒</small></div>'+
 '<div class="rank">称号【'+r.rank+'】</div><div class="stamp'+(r.ok?' ok':'')+'">'+r.stamp+'</div>'+
 '<div class="cause">'+(r.ok?'':'敗因：')+r.cause+'</div><div class="cm">「'+r.cm+'」</div>'+
 '<div class="st"><div>耐えた誘惑<b>'+S.survived+'個</b></div><div>誘惑図鑑<b>'+seen+' / '+EVS.length+'</b></div><div>自己ベスト<b>'+fmt(SV.best)+(r.nb&&!r.fake?' 🆕':'')+'</b></div></div>'+
 '<div class="bt"><span class="btn" data-b="もう一度" data-a="retry">もう一度</span><span class="btn x" data-b="Xでシェア" data-a="share">Xでシェア</span><span class="btn sub" data-b="図鑑" data-a="zukan">図鑑</span></div>'+
 (r.note?'<div class="note">'+r.note+'</div>':'');
}
function showResult(){
 S.state='result';const r=$('#result');r.innerHTML='<div class="card rc">'+resHTML(S.result)+'</div>';r.classList.add('on');
 $('#hud').classList.remove('on');
 if(W<H){S.cam.ty=-H*.3;pose(S.result.ok?{x:OFF()*1.8}:{hy:0,hs:1.25})}else{S.cam.tx=-W*.24;pose(S.result.ok?{x:OFF()*1.8}:{hy:20,hs:1.25})}
 if(!S.result.ok)seq(.8,()=>say(S.result.cm,{hold:6}));
}
$('#result').addEventListener('click',e=>{const a=e.target.dataset&&e.target.dataset.a;if(!a)return;
 if(a==='retry')begin();
 else if(a==='share')window.open('https://twitter.com/intent/tweet?text='+encodeURIComponent(S.result.share+' #死んだふり #100個のバカゲー'),'_blank');
 else openZukan()});

/* ================= 図鑑 ================= */
function openZukan(){
 let h='';for(let t=1;t<=4;t++){h+='<h4><span>'+PH[t]+'</span></h4><div class="g">';
  for(const e of EVS)if(e.tier===t){const s=SV.seen[e.id],k=SV.lost[e.id];h+='<div class="it'+(s||k?(k?' ko':''):' no')+'">'+(s||k?(s?'✔':'💀')+' '+e.n+(k?' <small>💀×'+k+'</small>':''):'？？？')+'</div>'}
  h+='</div>'}
 $('#zl').innerHTML=h;const n=EVS.filter(e=>SV.seen[e.id]).length;
 $('#zs').textContent='耐えた誘惑 '+n+' / '+EVS.length+'種　（✔耐えた　💀負けた回数）';$('#zukan').classList.add('on')}
$('#zc').onclick=()=>$('#zukan').classList.remove('on');$('#zbtn').onclick=openZukan;
$('#zukan').addEventListener('click',e=>{if(e.target.id==='zukan')$('#zukan').classList.remove('on')});
function updRec(){$('#rec').textContent=SV.plays?'自己ベスト '+fmt(SV.best)+'（'+rankOf(SV.best)+'）　図鑑 '+Object.keys(SV.seen).length+' / '+EVS.length+(SV.clear?'　👑完全勝利 '+SV.clear+'回':''):'熊の誘惑は全 '+EVS.length+' 種。5分耐えたら、熊があきらめる。'}
if(!TOUCH)$('#tip').textContent='マウスから手をはなして、息をひそめて見守ろう。';
updRec();

/* ================= 進行 ================= */
function begin(){
 initAudio();
 $('#title').style.display='none';$('#result').classList.remove('on');$('#result').innerHTML='';fx.innerHTML='';
 Object.assign(S,{state:'intro',armed:false,el:0,used:{},lastId:'',forced:['sniff'],survived:0,gap:1.1,tier:0,seenRun:{},lastEnd:null,lastEndT:-9,frozen:false,tenseT:.2,result:null});
 S.cam.tx=0;S.cam.ty=0;Q=[];EV=null;PT=[];hush();resetBear();cv.style.transform='';
 P.rot=P.rotT=PI/2;P.rv=0;P.face='alive';P.trem=0;P.bump=0;P.wet=0;
 $('#timer').textContent=fmt(0);$('#phase').firstChild.textContent='';
 snap({x:-OFF(),hy:40});pose({x:W<H?0:60,hy:W<H?70:30,hs:W<H?1.25:1.45,lx:-200,ly:-450,rx:200,ry:-450},70);face('wide','grr',-1);B.pads=1;
 const cn=$('#count'),cb=cn.querySelector('b'),ce=cn.querySelector('em'),cs=cn.querySelector('span');cn.style.display='block';cb.textContent='熊だ！！';ce.textContent='';cs.textContent='まだ動いてOK';
 seq(.35,()=>{say('ガオーーーッ！！',{big:1,spd:50,hold:1,low:1});sfx.roar();shake(22);P.face='shock';part({x:215,y:-290,vy:-30,life:.9,txt:'！',sz:60,col:'#ffe066'})});
 seq(1,()=>{cb.innerHTML='死んだふり！<br>手をはなせ！';ce.textContent='3';sfx.tick();P.rotT=0});
 seq(1.42,()=>{sfx.thud();shake(10);P.face='dead';for(let i=0;i<8;i++)part({x:rnd(200),y:-10,vx:rnd(120),vy:-60-R()*60,life:.6,sz:10,col:'#e6e6b4'})});
 seq(1.8,()=>{ce.textContent='2';sfx.tick();pose({x:0},60);face('n','o',0);B.pads=0});
 seq(2.6,()=>{ce.textContent='1';sfx.tick();face('sq','flat',-.3)});
 seq(3.4,()=>{cb.textContent='';ce.textContent='';cs.textContent='ここから、動いたら負け';sfx.ding();
  S.state='play';S.armed=true;S.t0=performance.now();S.el=0;document.body.classList.add('play');$('#hud').classList.add('on');say('……ん？ 死んどる？')});
 seq(5.2,()=>{cn.style.display='none'});
}
$('#start').onclick=begin;

function frame(now){
 requestAnimationFrame(frame);
 let dt=Math.min(.05,(now-(frame.l||now))/1000);frame.l=now;
 if(S.hit>0){S.hit-=dt;dt=0}
 S.t+=dt;
 while(Q.length){let i=Q.findIndex(q=>q.t<=S.t);if(i<0)break;Q.splice(i,1)[0].fn()}
 if(S.state==='play')updPlay(dt);
 const vdt=S.frozen?0:dt,t=S.frozen?frame.ft:(frame.ft=S.t);
 // 熊のばね
 const k=B.k,dmp=2*Math.sqrt(k)*.72;
 for(const key of BK){const a=k*(B.T[key]-B[key])-dmp*B.v[key];B.v[key]+=a*vdt;B[key]+=B.v[key]*vdt}
 B.look[0]+=(B.lookT[0]-B.look[0])*Math.min(1,vdt*9);B.look[1]+=(B.lookT[1]-B.look[1])*Math.min(1,vdt*9);
 B.blinkT-=vdt;if(B.blinkT<0){B.blink=.12;B.blinkT=1.5+R()*3.5;if(R()<.3)B.earT=.4}B.blink-=vdt;B.earT-=vdt;
 P.rv+=((P.rotT-P.rot)*60-P.rv*6)*vdt;P.rot+=P.rv*vdt;if(P.rot<0){P.rot=0;P.rv=-P.rv*.25}
 if(S.state==='play'&&W<H)S.cam.tx=clamp(-B.T.hx*sc*.32,-46,46);
 S.cam.x+=(S.cam.tx-S.cam.x)*Math.min(1,dt*5);S.cam.y+=(S.cam.ty-S.cam.y)*Math.min(1,dt*5);
 S.shake*=Math.pow(.0015,dt);if(S.shake<.3)S.shake=0;
 S.tense+=(S.tenseT-S.tense)*Math.min(1,dt*2);
 // 環境音・心音
 if(AC&&(S.state==='play'||S.state==='intro')&&!S.frozen){
  S.hbT-=dt;if(S.hbT<0&&S.state==='play'){S.hbT=1.05-.6*S.tense;sfx.thump(.1+.3*S.tense);S.hbP=1}
  S.ambT-=dt;if(S.ambT<0){S.ambT=1.5+R()*4;S.el>130?sfx.cricket():sfx.chirp()}
 }
 if(S.state==='title'){S.cam.tx=W<H?-W*.07:W*.09;S.cam.ty=W<H?-H*.07:-H*.1; // タイトルの熊：木陰からのぞく
  pose({x:W<H?-150:-250,y:-190,sc:.42,hx:Math.sin(S.t*.7)>0.3?60:0,hr:Math.sin(S.t*.7)>.3?.3:0},30);face('n','flat',0);B.lookT=[1,.6];
  if(R()<dt*.7)part({x:250+rnd(20),y:-280,vx:20,vy:-40,life:1.4,txt:'♪',sz:30,col:'#fff'});
 }
 if(S.state==='play'&&S.el>150&&R()<dt*3)part({x:rnd(W/2/sc),y:-R()*400,vx:rnd(20),vy:rnd(20),life:2.5,sz:5,col:'rgba(240,255,150,.9)',glow:1});
 // ---- 描画 ----
 c.setTransform(DPR,0,0,DPR,0,0);
 drawBG(t);
 c.save();c.translate(gx+S.cam.x+rnd(S.shake),gy+S.cam.y+rnd(S.shake));c.scale(sc,sc);
 drawBearBody(t);drawPlayer(t);drawBearArms(false);drawBearHead(t);drawBearArms(true);
 if(EV&&EV.draw)EV.draw(EV.t);
 drawParts(vdt);
 c.restore();
 // 時間帯の色
 const e=S.el,tg=S.state==='win'||(S.result&&S.result.ok)?[255,236,224]:e<55?[255,255,255]:e<110?mix([255,255,255],[255,208,170],(e-55)/55):e<165?mix([255,208,170],[120,132,205],(e-110)/55):[120,132,205];
 for(let i=0;i<3;i++)S.tint[i]+=(tg[i]-S.tint[i])*Math.min(1,dt*1.5);
 if(S.tint[0]<253||S.tint[1]<253){c.globalCompositeOperation='multiply';c.fillStyle='rgb('+S.tint.map(Math.round).join(',')+')';c.fillRect(0,0,W,H);c.globalCompositeOperation='source-over'}
 // 心拍にあわせて画面のふちが脈打つ
 S.hbP=Math.max(0,(S.hbP||0)-dt*2.2);
 if(S.state==='play'&&S.tense>.3&&S.hbP>0){const g=c.createRadialGradient(W/2,H/2,Math.min(W,H)*.35,W/2,H/2,Math.max(W,H)*.72);
  g.addColorStop(0,'rgba(216,69,46,0)');g.addColorStop(1,'rgba(216,69,46,'+(S.hbP*S.tense*.3).toFixed(3)+')');c.fillStyle=g;c.fillRect(0,0,W,H)}
 if(!S.frozen)updSay(dt);
}
const mix=(a,b,k)=>a.map((v,i)=>v+(b[i]-v)*clamp(k,0,1));
requestAnimationFrame(frame);
})();
