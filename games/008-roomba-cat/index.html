<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>猫を乗せたお掃除ロボ</title>
<style>
:root{--ink:#4a3428;--cream:#fff8ea;--teal:#1fae9c;--hot:#ff6b4a;--sun:#ffc94d;--sh:0 5px 0 var(--ink)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#e9d8bd;color:var(--ink);user-select:none;-webkit-user-select:none;touch-action:none;
 font-family:"Hiragino Maru Gothic ProN","Arial Rounded MT Bold","Yu Gothic UI","Yu Gothic","Meiryo",sans-serif;font-weight:800}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
#back{position:fixed;left:10px;top:8px;z-index:30;font-size:12px;color:var(--ink);text-decoration:none;background:var(--cream);border:2px solid var(--ink);border-radius:99px;padding:3px 10px}
.panel{background:var(--cream);border:3px solid var(--ink);border-radius:18px;box-shadow:var(--sh)}
.btn{font:inherit;font-size:18px;color:#fff;background:var(--teal);border:3px solid var(--ink);border-radius:99px;padding:11px 26px;box-shadow:var(--sh);cursor:pointer;transition:transform .08s,box-shadow .08s}
.btn:hover{transform:translateY(-2px);box-shadow:0 7px 0 var(--ink)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn.sub{background:var(--cream);color:var(--ink)}
.btn.x{background:var(--ink)}
.hide{display:none!important}
/* HUD */
#hud{position:fixed;inset:0;pointer-events:none;z-index:10}
#top{position:absolute;left:50%;top:8px;transform:translateX(-50%);display:flex;align-items:center;gap:14px;padding:7px 16px;white-space:nowrap}
#stg{font-size:12px;line-height:1.25;text-align:center}
#stg b{display:block;font-size:15px}
#pctw{display:flex;flex-direction:column;align-items:center;min-width:150px}
#pct{font-size:34px;line-height:1;font-variant-numeric:tabular-nums;display:inline-block}
#pct small{font-size:16px}
#pct.bump{animation:bump .25s}
#pct.down{color:var(--hot);animation:shake .3s}
@keyframes bump{40%{transform:scale(1.28)}}
@keyframes shk2{25%{transform:translateX(calc(-50% - 4px))}75%{transform:translateX(calc(-50% + 4px))}}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.bar{width:150px;height:10px;border:2px solid var(--ink);border-radius:9px;background:#d8cbb5;overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%;width:0;background:var(--teal);transition:width .15s}
#bat{display:flex;align-items:center;gap:6px;font-size:18px;font-variant-numeric:tabular-nums}
#bat .cell{width:38px;height:18px;border:2.5px solid var(--ink);border-radius:5px;position:relative;background:#d8cbb5}
#bat .cell:after{content:"";position:absolute;right:-6px;top:4px;width:3px;height:6px;background:var(--ink);border-radius:0 2px 2px 0}
#bat .cell i{display:block;height:100%;background:var(--sun);border-radius:2px}
#bat.low{color:var(--hot);animation:blink .5s infinite}
#bat.low .cell i{background:var(--hot)}
@keyframes blink{50%{opacity:.45}}
#cats{position:absolute;left:10px;top:52px;display:flex;flex-direction:column-reverse;gap:4px}
.ci{display:flex;align-items:center;gap:6px;background:var(--cream);border:2px solid var(--ink);border-radius:99px;padding:2px 10px 2px 4px;font-size:12px;transition:transform .15s,background .15s}
.ci .st{font-size:11px;color:#9a8474;min-width:3.4em}
.ci.warn{background:#ffe1d6;transform:translateX(6px)}.ci.warn .st{color:var(--hot)}
.ci.off{background:#d9cdbb;opacity:.85}.ci.zz .st{color:#5a7fd0}
.fc{width:20px;height:17px;border-radius:50% 50% 46% 46%;background:var(--c);border:2px solid var(--ink);position:relative;flex:none;margin-top:4px}
.fc:before,.fc:after{content:"";position:absolute;top:-7px;border:5px solid transparent;border-bottom:8px solid var(--ink)}
.fc:before{left:-3px;transform:rotate(-18deg)}.fc:after{right:-3px;transform:rotate(18deg)}
.fc.un{background:#cbbfae}
#gura{white-space:nowrap;position:absolute;left:50%;bottom:16px;transform:translateX(-50%);padding:7px 14px;display:flex;align-items:center;gap:10px;font-size:12px}
#gura .bar{width:170px;margin:0;position:relative}
#gura .bar i{transition:none;background:var(--teal)}
#gura .bar:after{content:"";position:absolute;left:62%;top:0;bottom:0;width:2px;background:var(--ink);opacity:.5}
#gura.claw{animation:shk2 .18s infinite}#gura.claw .bar i{background:var(--hot)}
#soft{border:2px solid var(--ink);border-radius:99px;padding:1px 8px;opacity:.35}
#soft.on{opacity:1;background:var(--sun)}
#hint{position:absolute;left:50%;bottom:70px;transform:translateX(-50%);background:rgba(74,52,40,.9);color:#fff8ea;padding:8px 18px;border-radius:99px;font-size:14px;max-width:92vw;text-align:center;opacity:0;transition:opacity .3s}
#hint.on{opacity:1}
#card{position:absolute;left:50%;top:24%;transform:translate(-50%,-50%) scale(.6);opacity:0;padding:10px 20px;display:flex;align-items:center;gap:12px;transition:transform .25s cubic-bezier(.2,1.6,.4,1),opacity .2s;max-width:92vw}
#card.on{transform:translate(-50%,-50%) scale(1);opacity:1}
#card .fc{transform:scale(1.5);margin:6px 8px 0 6px}
#card b{font-size:22px}#card em{font-style:normal;background:var(--sun);border:2px solid var(--ink);border-radius:99px;font-size:12px;padding:1px 8px;margin-left:6px;vertical-align:middle}
#card p{font-size:13px;margin-top:2px}
#banner{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%) scale(0);font-size:min(13vw,84px);color:#fff;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 6px 0 var(--ink);white-space:nowrap;transition:transform .3s cubic-bezier(.2,1.7,.4,1)}
#banner.on{transform:translate(-50%,-50%) scale(1) rotate(-3deg)}
#cap{position:absolute;left:0;right:0;bottom:0;padding:22px 16px 26px;text-align:center;font-size:min(5.2vw,24px);color:#fff8ea;background:linear-gradient(transparent,rgba(40,26,20,.85) 45%);opacity:0;transition:opacity .4s}
#cap.on{opacity:1}
#pops{position:fixed;inset:0;pointer-events:none;z-index:12;overflow:hidden}
.pop{position:absolute;transform:translate(-50%,-50%);font-size:20px;color:#fff;-webkit-text-stroke:4px var(--ink);paint-order:stroke fill;white-space:nowrap;animation:popf 1s ease-out forwards}
.pop.bad{color:#ffb4a2;font-size:26px}.pop.good{color:#b8f5e6}.pop.big{font-size:34px;color:var(--sun)}
@keyframes popf{0%{transform:translate(-50%,-50%) scale(.3)}18%{transform:translate(-50%,-90%) scale(1.25)}30%{transform:translate(-50%,-100%) scale(1)}100%{transform:translate(-50%,-190%) scale(1);opacity:0}}
#joy{position:fixed;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:3px solid rgba(74,52,40,.5);background:rgba(255,248,234,.25);pointer-events:none;z-index:11}
#joy i{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px;border-radius:50%;background:var(--teal);border:3px solid var(--ink)}
/* overlays */
.ov{position:fixed;inset:0;z-index:20;display:flex;pointer-events:none}
.ov>*{pointer-events:auto}
#title{flex-direction:column;justify-content:center;align-items:flex-start;padding:0 0 0 5vw}
#title .in{width:min(46vw,520px);display:flex;flex-direction:column;gap:14px;align-items:flex-start}
h1{font-size:min(5vw,56px);line-height:1.12;color:#fff;-webkit-text-stroke:10px var(--ink);paint-order:stroke fill;letter-spacing:.02em;filter:drop-shadow(0 5px 0 var(--ink))}
h1 span{color:var(--sun)}
#title .lead{font-size:16px;background:var(--ink);color:var(--cream);padding:6px 14px;border-radius:99px}
#how{padding:12px 16px;font-size:14px;line-height:1.75;width:100%}
#how kbd{font:inherit;font-size:12px;background:#fff;border:2px solid var(--ink);border-radius:6px;padding:0 6px;box-shadow:0 2px 0 var(--ink);margin:0 1px}
#how .r{color:var(--hot)}
#zukan{display:flex;gap:7px;align-items:center;flex-wrap:wrap;font-size:12px;margin-top:6px;padding-top:8px;border-top:2px dashed #cdbb9f}
#zukan .fc{margin-top:6px}
#zukan .e{margin-left:4px;letter-spacing:2px}
#clear{align-items:center;padding-left:6vw}
#clear .panel{padding:20px 26px;text-align:center;min-width:290px;position:relative;animation:pin .35s cubic-bezier(.2,1.6,.4,1)}
@keyframes pin{0%{transform:scale(.5);opacity:0}}
#clear h2{font-size:24px;margin:0 34px 10px 0}
#rank{position:absolute;right:-14px;top:-22px;width:74px;height:74px;border-radius:50%;background:var(--hot);color:#fff;border:3px solid var(--ink);font-size:40px;line-height:68px;transform:rotate(12deg);box-shadow:var(--sh);animation:stamp .4s .25s backwards}
@keyframes stamp{0%{transform:scale(3) rotate(40deg);opacity:0}}
table{margin:0 auto 14px;border-collapse:collapse;font-size:15px}
td{padding:3px 10px;text-align:left}td+td{text-align:right;font-variant-numeric:tabular-nums}
#result{align-items:center;padding-left:4vw}
#result .panel{width:min(44vw,460px);padding:18px 22px;text-align:center;animation:pin .4s cubic-bezier(.2,1.5,.4,1)}
#endn{font-size:13px;background:var(--ink);color:var(--cream);display:inline-block;border-radius:99px;padding:3px 14px}
#ttl{font-size:min(6.4vw,34px);line-height:1.2;margin:10px 0 2px;color:var(--teal);-webkit-text-stroke:6px var(--ink);paint-order:stroke fill}
#ttls{font-size:12px;opacity:.7}
#cmt{font-size:14px;margin:8px 0 12px;line-height:1.5}
#score{font-size:40px;line-height:1.1;font-variant-numeric:tabular-nums}#score small{font-size:14px}
#rec{font-size:12px;color:var(--hot);min-height:16px}
.btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
@media (max-aspect-ratio:1/1){
 #title{justify-content:space-between;align-items:center;padding:44px 12px 18px}
 #title .in{display:contents}
 h1{font-size:min(10.5vw,48px);text-align:center;-webkit-text-stroke:8px var(--ink)}
 #title .lead{font-size:13px;margin-top:-4px}
 #title .sp{flex:1}
 #how{font-size:12.5px;line-height:1.6;max-width:440px}
 #top{gap:8px;padding:6px 10px;top:36px}#pctw,.bar{min-width:0;width:110px}#pct{font-size:28px}
 #cats{top:104px}.ci b,.ci .st{display:none}.ci{padding:2px 4px}.ci.warn{background:var(--hot)}.ci.zz{background:#bcd0ff}
 #gura .bar{width:120px}
 #result,#clear{align-items:flex-end;justify-content:center;padding:0 10px 22px}
 #result .panel{width:100%;max-width:460px;padding:14px 14px}
 #score{font-size:32px}.btn{font-size:16px;padding:9px 18px}
}
@media (max-height:520px) and (min-aspect-ratio:1/1){
 #title .in{gap:7px}h1{font-size:min(5vw,34px);-webkit-text-stroke:7px var(--ink)}#title .lead{font-size:12px;padding:3px 10px}#how{font-size:11.5px;line-height:1.5;padding:7px 12px}#zukan{margin-top:3px;padding-top:4px}
 .btn{font-size:15px;padding:7px 18px}#result .panel{padding:8px 14px}#ttl{font-size:22px;margin:4px 0 0}#cmt{font-size:12px;margin:4px 0}#score{font-size:26px}td{padding:1px 8px;font-size:12px}table{margin-bottom:6px}
 #top{top:4px;padding:4px 12px}#pct{font-size:26px}#cats{top:38px}.ci{font-size:11px;padding:1px 8px 1px 3px}#gura{bottom:8px;padding:4px 12px}#hint{bottom:48px;font-size:12px}
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<a id="back" href="../../index.html">← 一覧</a>
<div id="hud" class="hide">
 <div id="top" class="panel">
  <div id="stg"></div>
  <div id="pctw"><div id="pct">0<small>%</small></div><div class="bar"><i id="pbar"></i></div></div>
  <div id="bat"><div class="cell"><i id="bfill"></i></div><span id="bsec">0</span></div>
 </div>
 <div id="cats"></div>
 <div id="gura" class="panel"><span>ぐらぐら</span><div class="bar"><i id="gbar"></i></div><span id="soft">そーっと</span></div>
 <div id="hint"></div>
 <div id="card" class="panel"></div>
 <div id="banner"></div>
 <div id="cap"></div>
</div>
<div id="pops"></div>
<div id="joy" class="hide"><i></i></div>

<div id="title" class="ov">
 <div class="in">
  <h1>猫を乗せた<br><span>お掃除ロボ</span></h1>
  <div class="lead">背中の猫を落とさずに、部屋を100%ピカピカにせよ。</div>
  <div class="sp"></div>
  <div id="how" class="panel">
   <div>移動　<kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> / <kbd>↑</kbd><kbd>←</kbd><kbd>↓</kbd><kbd>→</kbd>（スマホは画面をドラッグ）</div>
   <div>そーっと走る　<kbd>Shift</kbd> か <kbd>Space</kbd> を押しながら</div>
   <div class="r">急ハンドル・急発進・衝突で猫が落ちる。落ちた猫は怒って毛をまく。</div>
   <div id="zukan"></div>
  </div>
  <button class="btn" id="bstart">おそうじ開始</button>
 </div>
</div>
<div id="clear" class="ov hide">
 <div class="panel"><div id="rank">S</div><h2 id="ch"></h2><table id="ct"></table><button class="btn" id="bnext">次の部屋へ</button></div>
</div>
<div id="result" class="ov hide">
 <div class="panel">
  <div id="endn"></div>
  <div id="ttl"></div><div id="ttls">― 今回の称号 ―</div>
  <div id="cmt"></div>
  <div id="score"></div><div id="rec"></div>
  <table id="rt"></table>
  <div class="btns"><button class="btn" id="bretry">もう一度</button><button class="btn sub hide" id="bcont">この部屋から</button><button class="btn x" id="bshare">Xでシェア</button></div>
 </div>
</div>

<script src="../../lib/three.min.js"></script>
<script>
(()=>{'use strict';

/* ================= 定義 ================= */
const CATS=[
 {n:'たま',t:'おっとり',d:'どっしり構える三毛。踏んばりが長い',c:0xfbf4e8,pat:'mike',eye:0x9bc53d,s:1,gain:1,grip:1.7},

  f:[['tv',-1.6,-2.76],['sofa',-1.6,.1],['shelf',2.3,-2.78],['shelf',4.28,1,'w'],['plant',4.1,-2.6],['box',-4.1,2.6]]},

];

let save={best:0,met:[0,0,0,0,0,0,0],ends:{}};
try{const s=JSON.parse(localStorage.getItem(SAVE_KEY));if(s&&s.met)save=Object.assign(save,s)}catch(e){}

/* ================= three 基本 ================= */
const canvas=$('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();scene.background=new THREE.Color(0xe9d8bd);
const camera=new THREE.PerspectiveCamera(42,1,.1,80);

Object.assign(sun.shadow.camera,{left:-7,right:7,top:7,bottom:-7,near:1,far:30});sun.shadow.bias=-.0015;

const SPH=new THREE.SphereGeometry(1,18,14),BOX=new THREE.BoxGeometry(1,1,1),CYL=new THREE.CylinderGeometry(1,1,1,24),CONE=new THREE.ConeGeometry(1,1,12);
function mk(geo,col,par,x,y,z,sx,sy,sz,sh=true){const m=new THREE.Mesh(geo,typeof col==='number'?mat(col):col);m.position.set(x,y,z);m.scale.set(sx,sy,sz);m.castShadow=sh;m.receiveShadow=sh;par.add(m);return m}
const SPL=new THREE.SphereGeometry(1,10,8);
const sp=(par,col,r,x,y,z,sx=1,sy=1,sz=1,sh=true)=>mk(r<.065?SPL:SPH,col,par,x,y,z,r*sx,r*sy,r*sz,sh);
const VC=new THREE.MeshLambertMaterial({vertexColors:true});
const dyn=o=>{o.userData.dyn=true;return o};
function bake(root,shadow=true){ // 静的な子メッシュを頂点カラー付き1メッシュに統合（描画コール削減）
 root.updateMatrixWorld(true);const inv=new THREE.Matrix4().copy(root.matrixWorld).invert(),pos=[],nor=[],col=[],idx=[],rm=[],m4=new THREE.Matrix4(),n3=new THREE.Matrix3(),v=new THREE.Vector3();
 root.traverse(o=>{if(!o.isMesh||!o.visible||!o.material.isMeshLambertMaterial||o.material.map||o.material.transparent||o.material.side!==THREE.FrontSide||o.material===VC)return;
