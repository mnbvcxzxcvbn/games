<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>村人Aは台詞を変えない</title>
<style>
:root{--k:1;--w:#fff;--y:#ffd84a;--r:#ff5a5a;--c:#7fe3ff;--g:#8f93a8;--bg:#0b0b16}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#000;overflow:hidden;touch-action:manipulation}
body{font-family:"DotGothic16","PixelMplus12","MS Gothic","Osaka-Mono","Noto Sans Mono CJK JP","Hiragino Kaku Gothic ProN","Yu Gothic",monospace;font-weight:bold;color:var(--w);user-select:none;-webkit-user-select:none}
#app{position:fixed;inset:0;overflow:hidden;background:#000}
canvas{position:absolute;left:0;top:0;image-rendering:pixelated;image-rendering:crisp-edges}
.hide{display:none!important}
#back{position:absolute;left:8px;top:6px;z-index:30;font-size:calc(12px*var(--k));color:#fff;text-decoration:none;background:rgba(0,0,0,.55);padding:3px 8px;border-radius:4px;border:1px solid rgba(255,255,255,.5)}
#mute{position:absolute;left:calc(12px + 66px*var(--k));top:6px;z-index:30;font:inherit;font-size:calc(12px*var(--k));color:#fff;background:rgba(0,0,0,.55);padding:3px 8px;border-radius:4px;border:1px solid rgba(255,255,255,.5);cursor:pointer}
.win{background:rgba(8,8,22,.95);border:3px solid var(--w);border-radius:8px;box-shadow:0 0 0 2px #000,inset 0 0 0 2px #000,0 6px 0 rgba(0,0,0,.35);padding:14px 16px 12px;position:relative}
.tag{position:absolute;top:-13px;left:12px;background:#000;border:2px solid var(--w);border-radius:5px;padding:1px 9px;font-size:calc(12px*var(--k));line-height:1.4;white-space:nowrap}
/* HUD */
#hud{position:absolute;right:8px;top:6px;z-index:20;text-align:right;font-size:calc(12px*var(--k));line-height:1.5;background:rgba(0,0,0,.55);border:2px solid #fff;border-radius:6px;padding:4px 9px}
#hud .ch{color:var(--y)}
#npcbar{display:inline-block;vertical-align:middle;width:calc(84px*var(--k));height:calc(9px*var(--k));border:2px solid #fff;margin-left:4px;background:#300}
#npcbar i{display:block;height:100%;width:100%;background:#58e06a;transition:width .25s,background .25s}
#hud.hurt{animation:shk .3s}
/* UI */
#ui{position:absolute;left:50%;bottom:10px;bottom:max(10px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(calc(720px*var(--k)),calc(100% - 16px));display:flex;flex-direction:column;gap:17px;z-index:10}
#heroText{min-height:2.9em;font-size:calc(clamp(15px,2.3vw,20px)*var(--k));line-height:1.45;white-space:pre-wrap}
#heroText.sys{color:var(--c)}
#adv{position:absolute;right:12px;bottom:6px;font-size:calc(12px*var(--k));animation:bob .6s infinite alternate}
#myWin{transition:border-color .3s}
#myWin.fire{border-color:#ff9a3c;animation:winshake .12s infinite}
#myWin.rainy{border-color:#b8c4d0}
#myWin.dark{border-color:#b06cff;animation:winshake .5s infinite}
#myWin.calm{animation:none}
#myWin.bad{animation:shk .25s}
#inner{font-size:calc(clamp(11px,1.7vw,14px)*var(--k));color:var(--g);min-height:1.5em;margin-bottom:2px;white-space:nowrap;overflow:hidden}
#kana{font-size:calc(clamp(21px,5.4vw,32px)*var(--k));line-height:1.5;white-space:nowrap;min-height:1.5em}
#kana .c{display:inline-block;width:1.04em;text-align:center}
#kana .sp{width:.5em}
#kana .done{color:var(--w)}
#kana .rest{color:#5d6076}
#kana .cur{color:var(--y);box-shadow:0 3px 0 var(--y);animation:blink .7s steps(2) infinite}
#kana .pop{animation:pop .18s}
#kana .bad{color:var(--r);box-shadow:0 3px 0 var(--r);animation:shk .2s}
#kana .lie{color:#ff7a7a;animation:jit .16s infinite}
#kana.auto{color:var(--w)}
#roma{font-size:calc(clamp(13px,2.5vw,18px)*var(--k));letter-spacing:.14em;color:#5d6076;min-height:1.5em;font-family:ui-monospace,Menlo,Consolas,monospace}
#roma b{color:#6fe38a}#roma u{color:var(--y);text-decoration:none}
#warn{position:absolute;right:12px;top:10px;color:var(--r);font-size:calc(clamp(11px,1.8vw,14px)*var(--k));opacity:0;transition:opacity .2s}
#warn.on{opacity:1;animation:shk .3s}
#patWrap{position:absolute;right:12px;top:-12px;background:#000;border:2px solid #fff;border-radius:5px;padding:1px 6px;font-size:calc(11px*var(--k));display:flex;align-items:center;gap:5px}
#pat{width:90px;height:7px;background:#333}
#pat i{display:block;height:100%;background:var(--y)}
#pop{position:absolute;z-index:16;left:50%;top:0;transform:translate(-50%,-100%);font-size:calc(clamp(18px,4vw,30px)*var(--k));color:var(--y);text-shadow:3px 3px 0 #000,-2px 0 #000,2px 0 #000,0 -2px #000;white-space:nowrap;pointer-events:none;opacity:0}
#pop.on{animation:rise .9s ease-out}
#freeBox{display:flex;gap:8px;margin-top:4px}
#free{flex:1;min-width:0;font:inherit;font-size:calc(clamp(18px,4.4vw,26px)*var(--k));background:#000;color:var(--y);border:0;border-bottom:3px solid var(--y);padding:4px 2px;outline:none;border-radius:0;user-select:text;-webkit-user-select:text}
#free::placeholder{color:#55586c;font-size:.7em}
button{font:inherit;color:#fff;cursor:pointer}
.btn{background:#000;border:3px solid #fff;border-radius:7px;padding:9px 16px;font-size:calc(clamp(14px,2.4vw,17px)*var(--k));box-shadow:0 4px 0 rgba(255,255,255,.28);transition:transform .06s}
.btn:hover,.btn:focus-visible{background:#fff;color:#000;outline:none}
.btn:active{transform:translateY(3px);box-shadow:none}
.btn.y{border-color:var(--y);color:var(--y)}.btn.y:hover,.btn.y:focus-visible{background:var(--y);color:#000}
#pad{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
#pad button{height:clamp(46px,7.4vh,64px);font-size:calc(23px*var(--k));background:#000;border:3px solid #fff;border-radius:7px;box-shadow:0 3px 0 rgba(255,255,255,.3)}
#pad button:active,#pad button.hit{background:#fff;color:#000;transform:translateY(2px);box-shadow:none}
#pad button.ng{background:var(--r);border-color:var(--r)}
#padTgl{position:absolute;right:10px;bottom:5px;font-size:calc(10px*var(--k));color:#8f93a8;background:none;border:0;text-decoration:underline}
/* bubble */
#quip{position:absolute;z-index:15;transform:translate(-50%,-100%);background:#fff;color:#000;border:3px solid #000;border-radius:8px;padding:4px 9px;font-size:calc(clamp(12px,2vw,16px)*var(--k));white-space:nowrap;pointer-events:none;opacity:0;box-shadow:0 0 0 2px #fff}
#quip::after{content:"";position:absolute;left:50%;bottom:-9px;margin-left:-5px;border:5px solid transparent;border-top-color:#fff}
#quip.on{opacity:1;animation:pop .16s}
/* card */
#card{position:absolute;inset:0;background:#000;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;opacity:0;pointer-events:none;transition:opacity .35s;padding:16px}
#card.on{opacity:1;pointer-events:auto}
#card .no{font-size:calc(clamp(14px,2.6vw,20px)*var(--k));letter-spacing:.5em;color:var(--g)}
#card .ti{font-size:calc(clamp(28px,7vw,56px)*var(--k));letter-spacing:.08em}
#card .when{font-size:calc(clamp(13px,2.4vw,18px)*var(--k));color:var(--c)}
#card .same{margin-top:18px;font-size:calc(clamp(12px,2.2vw,16px)*var(--k));border:2px solid var(--y);color:var(--y);padding:6px 12px;border-radius:5px;line-height:1.7}
#card .same s{color:var(--g);text-decoration:line-through}
/* title */
#logo{position:absolute;left:0;right:0;top:clamp(34px,7vh,60px);text-align:center;z-index:12;pointer-events:none;line-height:1.12}
#logo .l1{font-size:calc(clamp(30px,8vw,66px)*var(--k));letter-spacing:.04em;text-shadow:4px 4px 0 #1b2a6b,-3px 0 #1b2a6b,3px 0 #1b2a6b,0 -3px #1b2a6b,0 7px 0 rgba(0,0,0,.35)}
#logo .l1 em{font-style:normal;color:var(--y)}
#logo .l1 span{display:inline-block}
#logo .sub{display:inline-block;margin-top:10px;font-size:calc(clamp(11px,2vw,15px)*var(--k));background:#000;border:2px solid #fff;border-radius:5px;padding:2px 10px}
#titleWin{text-align:center}
#titleWin p{font-size:calc(clamp(13px,2.2vw,16px)*var(--k));line-height:1.65}
#titleWin .how{color:var(--g);font-size:calc(clamp(11px,1.9vw,13.5px)*var(--k));margin:8px 0 10px;line-height:1.7}
#titleWin .how b{color:#fff}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.modes{display:flex;gap:6px;justify-content:center;margin:2px 0 10px}
.modes button{font-size:calc(12px*var(--k));padding:5px 10px;background:#000;border:2px solid #666;color:#999;border-radius:5px}
.modes button.sel{border-color:var(--c);color:var(--c)}
#rec{font-size:calc(12px*var(--k));color:var(--g);margin-top:9px}
/* result */
#resWin .endno{font-size:calc(12px*var(--k));color:var(--g);letter-spacing:.2em}
#resWin .endname{font-size:calc(clamp(20px,4.6vw,32px)*var(--k));color:var(--y);margin:2px 0 6px;line-height:1.25}
#resWin .last{font-size:calc(clamp(12px,2vw,15px)*var(--k));color:var(--c);margin-bottom:9px;word-break:break-all}
#resWin .last b{color:#fff}
.rk{display:flex;gap:12px;align-items:center;border-top:2px dashed #555;border-bottom:2px dashed #555;padding:8px 0}
.rk .let{font-size:calc(clamp(40px,9vw,60px)*var(--k));line-height:1;color:var(--y);min-width:1.1em;text-align:center;text-shadow:3px 3px 0 #a0522d}
.rk .sho{font-size:calc(clamp(16px,3.2vw,22px)*var(--k))}
.rk .cmt{font-size:calc(clamp(11.5px,1.9vw,14px)*var(--k));color:#cfd2e6;font-weight:normal;margin-top:3px;line-height:1.5}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:9px 0 2px;text-align:center}
.stats div{border:2px solid #444;border-radius:5px;padding:4px 2px;font-size:calc(10.5px*var(--k));color:var(--g)}
.stats b{display:block;font-size:calc(clamp(15px,3.2vw,21px)*var(--k));color:#fff}
.newrec{color:var(--r);font-size:calc(11px*var(--k))}
/* zukan */
#zukan{position:absolute;inset:0;z-index:50;background:rgba(0,0,0,.8);display:flex;align-items:center;justify-content:center;padding:12px}
#zukan .win{width:min(calc(560px*var(--k)),100%);max-height:92%;display:flex;flex-direction:column}
#zlist{overflow:auto;margin:8px 0;display:grid;grid-template-columns:1fr 1fr;gap:5px;font-size:calc(12.5px*var(--k))}
#zlist div{border:2px solid #333;border-radius:5px;padding:5px 7px;color:#666;line-height:1.4}
#zlist div.got{border-color:var(--y);color:#fff}
#zlist small{display:block;color:#777;font-weight:normal;font-size:calc(10.5px*var(--k))}
#zlist .got small{color:var(--c)}
@media(max-width:480px){.btn{padding:9px 10px}#zlist{grid-template-columns:1fr}.stats{grid-template-columns:repeat(4,1fr)}.win{padding:13px 11px 10px}}
@media(max-height:520px){#ui{gap:13px;bottom:6px;width:min(calc(860px*var(--k)),calc(100% - 16px))}#heroText{min-height:1.45em;font-size:calc(14px*var(--k))}.win{padding:9px 12px 5px}#inner{display:none}#kana{font-size:calc(20px*var(--k))}#roma{font-size:calc(12px*var(--k));min-height:1.3em}
 #pad{grid-template-columns:repeat(12,1fr);gap:4px}#pad button{height:38px;font-size:calc(18px*var(--k))}#logo{top:4px}#logo .l1{font-size:calc(26px*var(--k))}#logo .sub{display:none}#titleWin p{font-size:calc(12.5px*var(--k));line-height:1.5}#titleWin .how{display:none}.modes{margin:6px 0}
 #rec{margin-top:4px}.rk{padding:4px 0}.rk .let{font-size:calc(34px*var(--k))}.stats{margin:5px 0 0}.stats b{font-size:calc(15px*var(--k))}#resWin .endname{font-size:calc(20px*var(--k));margin:0 0 2px}#resWin .last{margin-bottom:4px}.btn{padding:6px 14px}.row{margin-top:5px}}
@keyframes blink{50%{opacity:.35}}
@keyframes bob{to{transform:translateY(3px)}}
@keyframes pop{0%{transform:translateY(0) scale(1)}40%{transform:translateY(-6px) scale(1.25)}100%{transform:none}}
#quip.on{animation:qpop .16s}
@keyframes qpop{0%{transform:translate(-50%,-80%) scale(.6)}100%{transform:translate(-50%,-100%) scale(1)}}
@keyframes shk{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes winshake{0%{transform:translate(0,0)}25%{transform:translate(1px,-1px)}50%{transform:translate(-1px,1px)}75%{transform:translate(1px,1px)}}
@keyframes jit{0%{transform:translate(0,0)}50%{transform:translate(1px,-1px)}100%{transform:translate(-1px,1px)}}
@keyframes rise{0%{opacity:0;transform:translate(-50%,-60%) scale(.6)}20%{opacity:1;transform:translate(-50%,-110%) scale(1.15)}80%{opacity:1;transform:translate(-50%,-125%)}100%{opacity:0;transform:translate(-50%,-150%)}}
</style>
</head>
<body>
<div id="app">
  <canvas id="cv"></canvas>
  <a id="back" href="../../index.html">← 一覧</a>
  <button id="mute" aria-label="音のオンオフ">♪ ON</button>
  <div id="hud" class="hide"><div class="ch" id="hudCh"></div><div>村人度<span id="npcbar"><i></i></span></div><div>SCORE <span id="hudSc">0</span></div></div>
  <div id="logo"><div class="l1"><span>村人Aは</span><span><em>台詞</em>を変えない</span></div><div class="sub">― むらびとAは せりふを かえない ―</div></div>
  <div id="quip"></div><div id="pop"></div>
  <div id="ui">
    <div id="heroWin" class="win hide"><span class="tag" id="heroTag">ゆうしゃ</span><div id="heroText"></div><span id="adv" class="hide">▼</span></div>
    <div id="myWin" class="win hide"><span class="tag" id="myTag">むらびとA</span>
      <div id="patWrap" class="hide">勇者のがまん<div id="pat"><i></i></div></div>
      <div id="warn">台詞を かえては ならない</div>
      <div id="inner"></div><div id="kana"></div><div id="roma"></div>
      <div id="freeBox" class="hide"><input id="free" type="text" maxlength="20" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="ここに すきな ことばを（20文字まで）" aria-label="最後の一言"><button class="btn y" id="freeBtn">はなす</button></div>
      <button id="padTgl" class="hide">かなボタン ON/OFF</button>
    </div>
    <div id="pad" class="hide"></div>
    <div id="titleWin" class="win">
      <p>あなたは RPGの <span style="color:var(--y)">村人A</span>。<br>勇者に話しかけられたら、<span style="color:var(--y)">同じ台詞</span>を 正確に 打て。<br>村が焼けても。家族が消えても。勇者が闇に落ちても。</p>
      <p class="how"><b>キーボード</b>：ローマ字で打つ（si/shi などの揺れOK・半角英数で）<br><b>スマホ</b>：かなボタンを順にタップ　／　会話送り：Enter・タップ</p>
      <div class="modes"><button id="mKey">⌨ キーボード</button><button id="mPad">📱 かなボタン</button></div>
      <div class="row"><button class="btn y" id="startBtn">▶ はじめる</button><button class="btn hide" id="finalBtn">最終章から</button><button class="btn" id="zBtn1">図鑑</button></div>
      <div id="rec"></div>
    </div>
    <div id="resWin" class="win hide">
      <div class="endno" id="rNo"></div><div class="endname" id="rName"></div>
      <div class="last" id="rLast"></div>
      <div class="rk"><div class="let" id="rLet">A</div><div><div class="sho" id="rSho"></div><div class="cmt" id="rCmt"></div></div></div>
      <div class="stats"><div>スコア<b id="sSc">0</b></div><div>正確率<b id="sAc">0</b></div><div>速度(打/秒)<b id="sKp">0</b></div><div>ミス<b id="sMs">0</b></div></div>
      <div class="newrec" id="rNew"></div>
      <div class="row"><button class="btn y" id="againBtn">もう一度</button><button class="btn" id="shareBtn">Xでシェア</button><button class="btn" id="zBtn2">図鑑</button><button class="btn" id="titleBtn">タイトル</button></div>
    </div>
  </div>
  <div id="card"><div class="no" id="cNo"></div><div class="ti" id="cTi"></div><div class="when" id="cWhen"></div><div class="same" id="cSame"></div></div>
  <div id="zukan" class="hide"><div class="win"><span class="tag">エンディング図鑑</span><div id="zHead" style="font-size:13px;color:var(--c)"></div><div id="zlist"></div><div class="row"><button class="btn" id="zClose">とじる</button></div></div></div>
</div>
<script>
'use strict';
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.random()*a.length|0];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- save ---------- */
const LS_KEY='murabitoA_v1';
const save={best:0,ends:{},plays:0,cleared:false};
try{Object.assign(save,JSON.parse(localStorage.getItem(LS_KEY)||'{}'))}catch(e){}
const persist=()=>{try{localStorage.setItem(LS_KEY,JSON.stringify(save))}catch(e){}};

/* ---------- audio ---------- */
let AC=null,master=null,muted=false,nbuf=null;
function audioInit(){
  if(AC){if(AC.state==='suspended')AC.resume();return}
  try{AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=muted?0:.55;master.connect(AC.destination);
    nbuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=nbuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  }catch(e){AC=null}
}
function tone(f,d,type,v,slide,t0){
  if(!AC)return;const t=AC.currentTime+(t0||0),o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'square';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,f*slide),t+d);
  g.gain.setValueAtTime(v||.06,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.03);
}
function noise(d,v,fc,t0,q){
  if(!AC)return;const t=AC.currentTime+(t0||0),s=AC.createBufferSource(),g=AC.createGain(),f=AC.createBiquadFilter();
  s.buffer=nbuf;s.loop=true;f.type=q?'bandpass':'lowpass';f.frequency.value=fc||1800;if(q)f.Q.value=q;
  g.gain.setValueAtTime(v||.08,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(f);f.connect(g);g.connect(master);s.start(t,Math.random()*.5);s.stop(t+d+.03);
}
const mf=n=>440*Math.pow(2,(n-69)/12);
const SFX={
  key:i=>tone(mf(72+[0,2,4,7,9,12,14,16,19,21,24,26][i%12]),.06,'square',.045),
  talk:low=>tone(low?150+Math.random()*30:330+Math.random()*40,.035,'square',.03),
  sys:()=>tone(880,.03,'triangle',.04),
  miss:()=>{tone(110,.16,'sawtooth',.07,.6);noise(.1,.05,500)},
  ok:()=>[76,79,84].forEach((n,i)=>tone(mf(n),.11,'square',.05,0,i*.07)),
  perfect:()=>[72,76,79,84,88].forEach((n,i)=>tone(mf(n),.13,'square',.055,0,i*.06)),
  fail:()=>[64,60,57,52].forEach((n,i)=>tone(mf(n),.2,'square',.05,0,i*.14)),
  smash:()=>{noise(.25,.16,3200);tone(900,.08,'square',.05,.3);tone(1400,.05,'square',.04,.4,.05)},
  coin:()=>{tone(988,.07,'square',.05);tone(1319,.22,'square',.05,0,.07)},
  thunder:()=>{noise(1.2,.2,300);noise(.3,.12,1500)},
  flash:()=>{noise(.5,.1,5000);tone(220,.6,'triangle',.07,4)},
  step:()=>noise(.03,.025,900),
  card:()=>{tone(mf(48),.5,'triangle',.09);tone(mf(55),.5,'triangle',.06,0,.02)},
  fanfare:()=>[72,72,72,76,79,76,84].forEach((n,i)=>tone(mf(n),i===6?.5:.12,'square',.05,0,[0,.12,.24,.36,.5,.64,.78][i])),
  sad:()=>[76,72,69,64].forEach((n,i)=>tone(mf(n),.4,'triangle',.07,0,i*.3)),
};

function update(dt){
  S.t+=dt;if(S.stop>0){S.stop-=dt;return}
  gy+=(gyT-gy)*Math.min(1,dt*10);
  S.shake=Math.max(0,S.shake-dt*9);S.flash=Math.max(0,S.flash-dt*1.8);
  for(const a of [S.vil,S.hero,...S.extras]){
    if(a.talk>0)a.talk-=dt;if(a.hop>0)a.hop=Math.max(0,a.hop-dt*3);
    const d=a.tx-a.ox;if(Math.abs(d)>.5){a.ox+=Math.sign(d)*Math.min(Math.abs(d),a.spd*dt);a.stepT=(a.stepT||0)+dt;if(a.stepT>.16){a.stepT=0;SFX.step()}}
    else if(a.onArrive){a.ox=a.tx;const f=a.onArrive;a.onArrive=null;f()}
  }
  for(const p of S.parts){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.type==='shard')p.vy+=160*dt;if(p.type==='flame'||p.type==='smoke')p.vx+=rnd(-20,20)*dt}
  S.parts=S.parts.filter(p=>p.life>0&&p.y<H+4);
  if(S.env==='dark'){S.light-=dt;if(S.light<0){S.light=rnd(4,9);SFX.thunder();S.shake=Math.max(S.shake,2)}}
}
function moveTo(a,tx,spd){return new Promise(res=>{a.tx=tx;if(spd)a.spd=spd;if(Math.abs(a.tx-a.ox)<=.5){res();return}a.onArrive=res})}

   const b={ox:-OFF(),tx:-OFF(),spd:90,pal:'vilB',talk:0};S.extras.push(b);await moveTo(b,-32);S.shake=3;b.talk=2;
   await say('むらびとB','おい！！ ひとの 台詞 とるな！！');b.talk=2;await say('むらびとB','それ いうために 11ねん\nまってたんだぞ！！');
   await sys('村人Aは 台詞の とうようで\nうったえられた。')},
 async maou(){await Hs('…なん…だと…');await Hs('さいしょの 村に\nラスボスが いたのか…！');
   flashTo('#b06cff');SFX.thunder();S.shake=6;await sleep(250);S.vil.form='maou';await sys('村人Aは とくに 魔王では なかったが、');await sys('いきおいで 魔王に なった。')},
 async hai(){await Hs('…それは オレの 台詞だ');await Hs('「はい」と「いいえ」しか いえない\nくるしみが、おまえに わかるか');
   flashTo();await sleep(250);S.env='day';S.parts=[];playBgm('day');S.hero.form='mid';const v=S.vil.ox;S.vil.ox=S.vil.tx=S.hero.ox;S.hero.ox=S.hero.tx=v;
   await sys('ふたりは 台詞を こうかんした。');await autoType(LINE_DISP,'もと勇者');await sys('村人Aは「はい」と こたえた。')},
 async silence(){await Hs('…そうか。なにも ないか');await Hs('…いや。それが こたえ なんだな');
   await sys('村人Aは 11ねんぶん、だまった。');await sys('それは それで、台詞だった。')},
 async meta(){await Hs('…ゲーム？ なんの はなしだ');await Hs('…まて。だれかが オレたちを\nみているのか');
   playBgm(null);S.dim=.35;S.vil.tx=-14;S.hero.tx=2;await sys('ふたりは がめんの むこうを\nじっと みている。');S.shake=2;await sys('…あなたを みている。')},
 async meshi(){await Hs('…めし？');await Hs('…そういえば 10ねん、\nなにも くっていない');
   flashTo('#ffd8a0');await sleep(250);S.hero.form='mid';S.env='dusk';S.parts=[];S.lit=true;playBgm('dusk');heroName='ゆうしゃ';await sys('ふたりで シチューを たべた。');await sys('闇の げんいんは、くうふく だった。')},
 async name(L){await Hs(`「${L}」…`);await Hs('…おまえ、なまえが あったのか');await Hs('「むらびとA」じゃ、なかったんだな');
   morning();await sys('村人Aに なまえが ついた。');await sys('せかいの どこかで、\nデータが ひとつ かきかわった。')},
 async newline(L){await Hs(`「${L}」…？`);await Hs('…それが おまえの ことばか');await Hs('わるくない。おぼえておく');
   S.hero.spd=40;await moveTo(S.hero,OFF());show(heroWin,false);show(myWin,false);
   await card({no:'',ti:'そして',when:'― 次の 勇者が きた ―',same:'',hold:1500,setup:()=>{S.env='day';S.parts=[];S.houses='ok';S.hero.form='newb';S.vil.form='old'}});
   playBgm('day');heroName='しんまい勇者 Lv1';await moveTo(S.hero,6);await Hs('こんにちは！ ここは どこですか？',{hold:600});
   await autoType(L,'むらびとA');S.hero.hop=1;await Hs('……えっ？');await sys('村人Aの 台詞が こうしんされた。')},
};
async function firedEnding(){
  show(myWin,false);playBgm(null);await sys('村人Aは 台詞を まちがえすぎた…',{hold:1300});
  const e={ox:-OFF(),tx:-OFF(),spd:40,pal:'elder',talk:0};S.extras.push(e);await moveTo(e,-34);
  e.talk=2;await say('そんちょう','きみ。あしたから こなくて いいよ');
  S.vil.spd=24;moveTo(e,-OFF());await moveTo(S.vil,-OFF());S.vil.vis=false;
  const n={ox:-OFF(),tx:-OFF(),spd:50,pal:'vilN',talk:0};S.extras=[n];await moveTo(n,-18);
  await Hs(G.ch>=5?'…あたらしい かおだな':'あれ？ あたらしい ひと？',{hold:600});
  n.talk=2;await autoType(LINE_DISP,'むらびとA（2だいめ）');
  await sys('台詞は ひきつがれた。\nいちじ いっく たがわずに。');
  return ENDS.find(x=>x.id==='fired');
}
async function story(finalOnly){
  const my=++run;
  Object.assign(G,{ch:0,npc:100,score:0,keys:0,miss:0,time:0,rounds:0,perfect:0,streak:0,timeouts:0,said:0,fast:0,finalOnly:!!finalOnly,last:'',end:null});
  show($('titleWin'),false);show($('resWin'),false);show($('logo'),false);quipEl.classList.remove('on');kanaEl.style.fontSize='';
  save.plays++;persist();
  try{
    let end=null;
    if(!finalOnly){for(let ch=1;ch<=5;ch++){const ok=await chapter(ch);if(!ok){end=await firedEnding();break}}}
    if(!end){end=await finalChapter();show(myWin,false);layout();await SCRIPT[end.id](G.last||'…');}
    await sleep(500);result(end);
  }catch(e){if(!(e instanceof Cancel))throw e}
}

/* ---------- 結果 ---------- */
function rankOf(){
  if(G.finalOnly)return{let:'？',sho:'最終章だけ来た村人'};
  const acc=G.keys?G.keys/(G.keys+G.miss):0,kps=G.time?G.keys/G.time:0;
  if(G.end.id==='fired')return{let:'E',sho:'元・村人A'};
  if(acc>=1&&G.timeouts===0&&kps>=5.5)return{let:'S',sho:'伝説の村人A'};
  if(acc>=1&&G.timeouts===0)return{let:'S',sho:'一字一句たがえぬ村人'};
  if(acc>=.97&&kps>=4&&G.timeouts===0)return{let:'A',sho:'模範的NPC'};
  if(acc>=.94&&G.timeouts<=1)return{let:'B',sho:'まじめな村人'};
  if(acc>=.86)return{let:'C',sho:'ときどき噛む村人'};
  return{let:'D',sho:'ろれつの怪しい村人'};
}
function result(end){
  G.end=end;const isNew=!save.ends[end.id];save.ends[end.id]=1;if(end.id!=='fired')save.cleared=true;
  const acc=G.keys?G.keys/(G.keys+G.miss)*100:0,kps=G.time?G.keys/G.time:0,rk=rankOf();
  const best=!G.finalOnly&&G.score>save.best;if(best)save.best=G.score;persist();
  const idx=ENDS.indexOf(end)+1,got=Object.keys(save.ends).length;
  $('rNo').textContent=`ENDING ${String(idx).padStart(2,'0')} / ${ENDS.length}`+(isNew?'　★NEW':'');
  $('rName').textContent=`「${end.name}」`;
  const L=G.last===''?'…………':G.last;
  $('rLast').innerHTML=end.id==='fired'?`台詞を言えた回数：<b>${G.said}回</b>（第${G.ch}章で クビ）`:`村人A、11年目の ひとこと：<b>「${esc(L)}」</b>`;
  $('rLet').textContent=rk.let;$('rSho').textContent=rk.sho;
  $('rCmt').textContent=end.id==='newline'?`次の勇者は「${L}」と聞かされて旅立つ。大丈夫か。`:end.cmt;
  $('sSc').textContent=G.finalOnly?'---':G.score;$('sAc').textContent=G.keys?acc.toFixed(1)+'%':'---';$('sKp').textContent=G.time?kps.toFixed(1):'---';$('sMs').textContent=G.keys?G.miss:'---';
  $('rNew').textContent=(best?'★ ハイスコア更新！　':'')+(G.fast?`最速 ${G.fast.toFixed(2)}秒　`:'')+`図鑑 ${got}/${ENDS.length}`+(G.finalOnly?'　※最終章からのプレイは スコアなし':'');
  G.share=end.id==='fired'
    ?`RPGの村人Aに就職したが、台詞を噛みすぎて第${G.ch}章でクビになりました。「ここは はじまりの村です」すら言えなかった…（${G.said}回は言えた）`
    :end.id==='hajimari'
    ?`村が焼けても家族が消えても勇者が闇落ちしても、11年間「ここは はじまりの村です」と言い続けた。称号【${rk.sho}】`+(G.finalOnly?'':`／正確率${acc.toFixed(1)}%・${kps.toFixed(1)}打/秒`)
    :`村人Aとして11年間「ここは はじまりの村です」と打ち続け、最後に一度だけ「${L}」と言った → END「${end.name}」称号【${rk.sho}】`+(G.finalOnly?'':`／正確率${acc.toFixed(1)}%`);
  show(heroWin,false);show(myWin,false);show($('hud'),false);show($('resWin'),true);layout();
  if(end.id==='fired')SFX.sad();else if(!['hajimari','tasuke','newline'].includes(end.id))SFX.ok();
  $('againBtn').focus();
}
$('shareBtn').onclick=()=>{const t=G.share+' #村人Aは台詞を変えない #100個のバカゲー';window.open('https://twitter.com/intent/tweet?text='+encodeURIComponent(t),'_blank','noopener')};
$('againBtn').onclick=()=>{audioInit();story(false)};
$('titleBtn').onclick=()=>{playBgm(null);titleScreen()};
function zukan(){
  const got=Object.keys(save.ends).length;$('zHead').textContent=`あつめた エンディング：${got} / ${ENDS.length}　（最後の ひとことで 分岐）`;
  $('zlist').innerHTML=ENDS.map((e,i)=>save.ends[e.id]?`<div class="got">${String(i+1).padStart(2,'0')} ${esc(e.name)}<small>${esc(e.hint)}</small></div>`:`<div>${String(i+1).padStart(2,'0')} ？？？<small>ヒント：${esc(e.hint)}</small></div>`).join('');
  show($('zukan'),true);$('zClose').focus();
}
$('zBtn1').onclick=$('zBtn2').onclick=zukan;$('zClose').onclick=()=>show($('zukan'),false);
$('zukan').addEventListener('click',e=>{if(e.target===$('zukan'))show($('zukan'),false)});

/* ---------- タイトル ---------- */
function setMode(pad){G.padMode=pad;$('mKey').classList.toggle('sel',!pad);$('mPad').classList.toggle('sel',pad)}
$('mKey').onclick=()=>setMode(false);$('mPad').onclick=()=>setMode(true);
$('padTgl').onclick=()=>{$('padTgl').blur();setMode(!G.padMode);if(Rd){show($('pad'),G.padMode);if(G.padMode)buildPad();renderLine();layout()}};
function titleScreen(){
  ++run;setScene(1);S.hero.ox=S.hero.tx=6;G.ch=0;Rd=null;
  show($('titleWin'),true);show($('logo'),true);show($('resWin'),false);show(heroWin,false);show(myWin,false);show($('hud'),false);show($('pad'),false);
  show($('finalBtn'),!!save.cleared);
  const got=Object.keys(save.ends).length;$('rec').textContent=save.plays?`ハイスコア ${save.best}　／　図鑑 ${got}/${ENDS.length}　／　出勤 ${save.plays}回`:'エンディング 全'+ENDS.length+'種 ― 最後の ひとことで 分岐';
  layout(true);titleLoop(run);
}
async function titleLoop(my){
  const lines=[['hero','はなす'],['vil','ここは はじまりの村です'],['hero','…しってる'],['hero','はなす'],['vil','ここは はじまりの村です'],['hero','ほかに ないの？'],['hero','はなす'],['vil','ここは はじまりの村です'],['hero','ツボ わっていい？'],['vil','ここは はじまりの村です']];
  try{await sleep(700);for(let i=0;;i++){const [w,t]=lines[i%lines.length];if(my!==run)return;quip(t,w,1250);if(w==='vil')S.vil.talk=.9;else S.hero.hop=1;if(AC)SFX.talk(w==='hero');await sleep(1500)}}catch(e){}
}
$('startBtn').onclick=()=>{audioInit();story(false)};
$('finalBtn').onclick=()=>{audioInit();story(true)};
$('mute').onclick=()=>{$('mute').blur();muted=!muted;$('mute').textContent=muted?'♪ OFF':'♪ ON';audioInit();if(master)master.gain.value=muted?0:.55};

/* ---------- 入力 ---------- */
addEventListener('keydown',e=>{
  if(e.target===$('free'))return;
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  audioInit();
  let k=e.key;
  if(Rd&&!Rd.done){
    if(k===' '){e.preventDefault();return}
    if(k.length!==1||!/[a-z]/i.test(k)){const m=/^Key([A-Z])$/.exec(e.code||'');if(m&&(k==='Process'||k==='Unidentified'))k=m[1];else return}
    e.preventDefault();inputChar(k.toLowerCase());return;
  }
  if(k==='Enter'||k===' '){
    if(e.target&&e.target.tagName==='BUTTON')return;
    e.preventDefault();
    if(!$('zukan').classList.contains('hide')){show($('zukan'),false);return}
    if(!$('titleWin').classList.contains('hide')){story(false);return}
    advance();
  }else if(k==='Escape')show($('zukan'),false);
});
for(const el of [cv,heroWin,$('card')])el.addEventListener('pointerdown',()=>{audioInit();advance()});

/* ---------- ループ ---------- */
let lastT=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-lastT)/1000);lastT=now;
  update(dt);tickRound(dt);draw(S.t,dt);requestAnimationFrame(frame);
}
setMode(matchMedia('(pointer:coarse)').matches||('ontouchstart' in window&&innerWidth<700));
resize();titleScreen();requestAnimationFrame(frame);
</script>
