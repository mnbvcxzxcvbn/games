 <div class="tbox">

function tone(f,d,type='sine',v=.15,f2=0,dl=0){if(!AC)return;const t=AC.currentTime+dl,o=AC.createOscillator(),q=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);q.gain.setValueAtTime(0,t);q.gain.linearRampToValueAtTime(v,t+.006);q.gain.exponentialRampToValueAtTime(.0008,t+d);o.connect(q);q.connect(MG);o.start(t);o.stop(t+d+.03)}
